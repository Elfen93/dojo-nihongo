<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f4f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Dojo 日本語</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* Layout: barra lateral fija en escritorio, pestañas inferiores en móvil; una vista activa a la vez. */
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  --bg:#eeebe3; --fg:#2f3330; --muted:#7c817a; --line:#dcd8cd; --card:#f7f5ef; --card2:#e7e3d8;
  --accent:#5f7a5a; --accent-fg:#ffffff; --accent-soft:#e3e8de; --kanji-c:#7d6a5a; --kanji-soft:#ece6dd; --shadow:none;
  --leaf:#6d8a5e; --leaf-soft:#e3e8de;
  --warn:#a2695a; --warn-soft:#efe3dd; --ok:#5f7a5a; --ok-soft:#e3e8de; --gold:#9c8a5a;
  --kanji:#1b2230; --radius:10px;
  --f-ui:"Figtree","Noto Sans JP",system-ui,sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-jp-display:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151a17; --fg:#e3e4dc; --muted:#959b92; --line:#283029; --card:#1b211d; --card2:#232b25;
  --accent:#9db48f; --accent-fg:#131813; --accent-soft:#25302a;
  --leaf:#9db48f; --leaf-soft:#25302a; --warn:#cf9a8a; --warn-soft:#382a26; --ok:#9db48f; --ok-soft:#25302a; --gold:#c6b27e; --kanji:#eceee6; --kanji-c:#c2ad98; --kanji-soft:#302b25; --shadow:none; color-scheme:dark }
 }
:root[data-theme="dark"]{
  --bg:#151a17; --fg:#e3e4dc; --muted:#959b92; --line:#283029; --card:#1b211d; --card2:#232b25;
  --accent:#9db48f; --accent-fg:#131813; --accent-soft:#25302a;
  --leaf:#9db48f; --leaf-soft:#25302a; --warn:#cf9a8a; --warn-soft:#382a26; --ok:#9db48f; --ok-soft:#25302a; --gold:#c6b27e; --kanji:#eceee6; --kanji-c:#c2ad98; --kanji-soft:#302b25; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url("icons/garden.svg") center bottom / cover no-repeat;opacity:.2;transition:opacity .8s}
body.login-mode::after{opacity:.4}
.app{position:relative;z-index:1}
@media (max-width:860px){ body::after{background-size:220% auto;background-position:62% 100%;opacity:.19} body.login-mode::after{opacity:.38} }
:root[data-theme="dark"] body::after{opacity:.16;filter:brightness(.55) saturate(.8)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body::after{opacity:.16;filter:brightness(.55) saturate(.8)} }
:lang(ja),.jp{font-family:var(--f-jp)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.5rem;font-weight:500;font-family:var(--f-jp-display),var(--f-ui);letter-spacing:.01em}
h2{font-size:1.1rem;font-weight:500;font-family:var(--f-jp-display),var(--f-ui)}
h3{font-size:1rem;font-weight:600;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
nav.side{position:sticky;top:0;height:100vh;height:100dvh;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:color-mix(in srgb, var(--bg) 88%, transparent);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 10px 14px}
.brand b{font-family:var(--f-jp-display);font-size:1.35rem;letter-spacing:.02em}
.brand span{font-size:.8rem;color:var(--muted)}
nav.side button,nav.tabs button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;width:100%;color:var(--fg)}
nav.side button .ic{width:22px;text-align:center;font-family:var(--f-jp-display);font-size:1.05rem;color:var(--muted)}
nav.side button.active{background:var(--card2);color:var(--fg);font-weight:600}
nav.side button.active .ic{color:var(--accent)}
nav.side button .badge{margin-left:auto}
.badge{display:inline-block;min-width:1.6em;padding:1px 7px;border-radius:999px;background:var(--card2);color:var(--muted);font-size:.72rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.badge.warn{background:var(--card2);color:var(--warn)}
.badge.ok{background:var(--card2);color:var(--muted)}
.badge.soft{background:var(--card2);color:var(--muted)}
nav.side .foot{margin-top:auto;padding:10px;font-size:.78rem;color:var(--muted)}
nav.tabs{display:none}
header.mobile{display:none}
main{min-width:0;padding-block:28px 48px;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;min-width:0}
.view{display:none}
.view.active{display:block}
.topline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.topline h1{margin-right:auto}

.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card.soft{background:var(--card2);border-color:transparent}
.stack{display:flex;flex-direction:column;gap:10px}
.grid > .card.stack > .btn:last-child,.grid > .card.stack > .row:last-child{margin-top:auto}
.grid > .card{display:flex;flex-direction:column}
.card > h3 + .small,.card > h3 + p{margin-top:2px}
.row.between > h3{line-height:1.3}
.pill{line-height:1.5;vertical-align:middle}
.badge{line-height:1.5}
.eyebrow{line-height:1.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.sp{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.leaf{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.warn{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn.ghost{background:transparent}
.btn.big{padding:14px 18px;font-size:1.05rem;min-height:52px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;min-height:36px;font-size:.85rem}

.action{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;width:100%;transition:border-color .15s}
.action:active{transform:scale(.985)}
.action .big-n{font-size:1.9rem;font-weight:500;font-variant-numeric:tabular-nums;min-width:2.4em;width:2.4em;text-align:center;font-family:var(--f-ui);line-height:1;display:flex;align-items:center;justify-content:center;height:2.2em;font-family:var(--f-ui),var(--f-jp-display)}
.action .t{font-weight:700}
.action .d{color:var(--muted);font-size:.9rem}
.action .big-n{color:var(--fg);font-family:var(--f-jp-display),var(--f-ui)}
.action.locked{opacity:.7}
.action:hover{border-color:var(--accent)}

.bar{height:10px;border-radius:999px;background:var(--card2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar.leaf > i{background:var(--leaf)}
.bar.gold > i{background:var(--gold)}
.push{border-left:2px solid var(--line);background:transparent;padding:4px 14px;color:var(--muted);font-size:.95rem}
.push.ok,.push.info{border-color:var(--line)}
.push.warnish{border-color:var(--warn);color:var(--fg)}

.forecast{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:auto}
.forecast > div{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.forecast > div > i{position:absolute;inset:auto 0 0 0;background:var(--accent);border-radius:3px 3px 0 0}
.forecast-labels{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}

/* Tarjeta de estudio */
.study{max-width:720px;margin:0 auto}
.study-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.85rem;color:var(--muted);min-height:40px}
.prompt-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 20px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px}

.big-jp{font-family:var(--f-jp-display);font-size:clamp(2.6rem,10vw,4.8rem);line-height:1.15;color:var(--kanji);font-weight:500}
.mid-jp{font-family:var(--f-jp);font-size:clamp(1.3rem,4.5vw,1.8rem);line-height:1.6}
.big-es{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:700;line-height:1.2}
.ask{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--accent);margin:0 2px;vertical-align:bottom}
.answer{display:flex;gap:8px;margin-top:12px}
.answer input{flex:1;min-width:0;font-size:1.3rem;padding:12px 14px;border:1px solid var(--line);border-bottom:2px solid var(--fg);border-radius:10px;background:var(--card);text-align:center;font-family:var(--f-jp)}
.answer input.right{border-color:var(--ok);background:var(--ok-soft)}
.answer input.wrong{border-color:var(--warn);background:var(--warn-soft)}
.feedback{margin-top:12px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--card)}
.feedback .verdict{font-weight:700;margin-bottom:6px}
.feedback .verdict.ok{color:var(--ok)}
.feedback .verdict.ko{color:var(--warn)}
.feedback dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 0}
.feedback dt{color:var(--muted);font-size:.85rem}
.feedback dd{margin:0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.choices button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:12px;font-family:var(--f-jp);font-size:1.25rem;min-height:56px}
.choices button.right{border-color:var(--ok);background:var(--ok-soft)}
.choices button.wrong{border-color:var(--warn);background:var(--warn-soft)}
.choices.text button{font-size:1rem;text-align:left;font-family:var(--f-jp)}
.choices.one{grid-template-columns:1fr}
.lesson-body{text-align:left}
.lesson-body .readings{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.lesson-body .readings b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lesson-body .mn{background:var(--card2);padding:10px 12px;border-radius:8px;margin-top:10px}
.lesson-body .ex{margin-top:8px;padding:8px 0;border-top:1px dashed var(--line)}
.lesson-body .ex .jp{font-size:1.15rem}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--card2);font-size:.78rem;font-weight:600;color:var(--muted)}
.pill.k{background:var(--kanji-soft);color:var(--kanji-c)}.pill.v{background:var(--accent-soft);color:var(--accent)}.pill.g{background:var(--leaf-soft);color:var(--leaf)}
:root[data-theme="dark"] .pill.k,:root:not([data-theme="light"]) .pill.k{}
.progress-dots{display:flex;gap:4px;flex-wrap:wrap}
.progress-dots i{width:10px;height:10px;border-radius:3px;background:var(--card2);display:block}
.progress-dots i.on{background:var(--accent)}
.progress-dots i.ko{background:var(--warn)}

/* Hero */
.hero{display:flex;gap:18px;align-items:center;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:20px 20px}
.hero .ring{width:84px;height:84px;flex:none}
.hero .ring svg{display:block;width:84px;height:84px}
.hero .ring text{fill:var(--fg);font-family:var(--f-jp-display);font-weight:500}
.hero .lvl{font-size:1.4rem;font-weight:500;line-height:1.2;font-family:var(--f-jp-display),var(--f-ui)}
.hero .sub{color:var(--muted);font-size:.9rem}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.hero .chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:500;line-height:1.5;display:inline-flex;align-items:center;color:var(--muted)}
/* Acceso */
.login-wrap{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;animation:fadein .9s ease both}
.login{width:min(420px,100%);text-align:center;padding:36px 28px;background:color-mix(in srgb, var(--card) 86%, transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:22px}
.login .enso{width:120px;height:120px;margin:0 auto 10px}
.login .enso path{fill:none;stroke:var(--fg);stroke-width:7;stroke-linecap:round;stroke-dasharray:330;stroke-dashoffset:330;animation:draw 1.6s .2s ease-out forwards;opacity:.85}
.login .enso text{font-family:var(--f-jp-display);font-size:34px;fill:var(--fg)}
.login h1{font-size:1.6rem;margin-top:6px}
.login .sub{color:var(--muted);margin:4px 0 22px}
.login .google{display:inline-flex;align-items:center;gap:10px;width:100%;justify-content:center;background:var(--fg);color:var(--bg);border:0;border-radius:12px;padding:13px 16px;font-weight:600;font-size:1rem;min-height:48px;transition:transform .15s,opacity .15s}
.login .google:hover{opacity:.92}
.login .google:active{transform:scale(.985)}
.login .google svg{width:20px;height:20px;flex:none}
.login .note{color:var(--muted);font-size:.78rem;margin-top:16px}
body.leaving .login-wrap{animation:fadeout .55s ease forwards}
.app{animation:fadein .7s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeout{to{opacity:0;transform:translateY(-8px) scale(.98)}}
@keyframes draw{to{stroke-dashoffset:40}}
@media (prefers-reduced-motion:reduce){ .login .enso path{animation:none;stroke-dashoffset:40} }
/* Micro-interacción */
.prompt-card{animation:cardin .28s ease both}
@keyframes cardin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.answer input{transition:border-color .2s,background .2s}
.feedback{animation:cardin .25s ease both}
.sent-play{border:0;background:transparent;color:var(--muted);font-size:.75em;padding:0 4px;cursor:pointer;vertical-align:middle;opacity:.7}
.sent-play:hover{color:var(--accent);opacity:1}
.sent.reading{background:var(--accent-soft);border-radius:4px}
/* Consejos */
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tip .ic{font-size:1.1rem;flex:none;line-height:1.5;width:1.4em;text-align:center}
.tip .b{min-width:0;flex:1}
.tip .b b{display:block;line-height:1.5}
.tip .b p{margin:2px 0 0;font-size:.9rem}
/* Lectura */
.reader{font-family:var(--f-jp);font-size:1.25rem;line-height:2.3;max-width:62ch}
.reader .tok{cursor:pointer;border-radius:4px;padding:0 1px}
.reader .tok:hover,.reader .tok.sel{background:var(--accent-soft)}
.reader rt{font-size:.55em;color:var(--muted)}
.reader.nofuri rt{visibility:hidden}
.reader.nofuri .tok.sel rt{visibility:visible}
.gloss{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.15);margin-top:12px}
.gloss .w{font-family:var(--f-jp);font-size:1.5rem;font-weight:500}
.gloss .r{color:var(--accent);font-family:var(--f-jp)}
.list{display:flex;flex-direction:column;gap:8px}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:left;width:100%}
.list .item .t{font-weight:600}
.list .item.done{border-color:var(--ok)}
.list .item.locked{opacity:.6}

/* Exámenes */
.exam-q{font-family:var(--f-jp);font-size:1.25rem;line-height:1.9}
.exam-q u{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.exam-q .star{color:var(--gold);font-weight:700}
.exam-q .slot{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--line);margin:0 3px;text-align:center;font-size:.8em;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--warn)}
.section-tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.result-grid .card{padding:10px 12px}
.score{font-size:2.6rem;font-weight:700;line-height:1}
.score.pass{color:var(--ok)}.score.fail{color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.tscroll{overflow-x:auto}

/* Progreso */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stages .card{padding:10px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:64px}
.stages .n{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.stages .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.levelmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px}
.levelmap div{aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--card2);font-size:.8rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.levelmap div.done{background:var(--ok);color:#fff}
.levelmap div.cur{background:var(--accent);color:var(--accent-fg);outline:2px solid var(--accent);outline-offset:2px}
.levelmap div.gen{background:var(--gold);color:#fff}
.tier-row{display:flex;gap:8px;align-items:center;margin:14px 0 6px}

/* Ajustes */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.85rem;font-weight:600}
.field{min-width:0}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);max-width:100%;width:100%;min-width:0;box-sizing:border-box}
.field input[type=checkbox]{width:auto}
.grid > *{min-width:0}
.card{overflow:hidden}
th,td{white-space:nowrap}
td.wrap,th.wrap{white-space:normal}
.field textarea{font-family:ui-monospace,monospace;font-size:.8rem;min-height:120px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);color:var(--fg);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-weight:500;z-index:50;max-width:90vw;font-size:.9rem}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
pre{background:var(--card2);padding:10px;border-radius:8px;overflow-x:auto}
.kbd{font-size:.75rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{display:none}
  header.mobile{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--card);border-bottom:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
  header.mobile .brand{padding:0;flex:1}
  header.mobile button{border:0;background:var(--card2);width:40px;height:40px;border-radius:12px;font-size:1.15rem;display:flex;align-items:center;justify-content:center;color:var(--fg)}
  header.mobile button.active{background:var(--accent-soft);color:var(--accent)}
  nav.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:2px;padding:6px 2px;font-size:.68rem;justify-content:center;align-items:center;color:var(--muted);position:relative}
  nav.tabs button .ic{font-family:var(--f-jp-display);font-size:1.25rem;color:inherit}
  nav.tabs button.active{color:var(--fg);background:none}
  nav.tabs button .badge{position:absolute;top:2px;right:8px;font-size:.65rem;min-width:1.4em;padding:0 5px}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));padding-block-start:0;padding-left:0;padding-right:0}
  main .wrap{padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));width:100%}
  .grid.c2,.grid.c3{grid-template-columns:1fr}
  .stages{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .stages .card{padding:8px 2px}
  .stages .n{font-size:1.05rem}
  .stages .l{font-size:.58rem;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field input[type=range]{padding:0}
  .choices{grid-template-columns:1fr 1fr}
  .reader{font-size:1.15rem}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

 {j:"「さくら」[って]店、知ってる？",s:"¿Conoces una tienda llamada Sakura?"},
 {j:"日本語[って]難しいね。",s:"El japonés es difícil, ¿eh?"}]},
{id:"nde",lv:10,t:"〜んで (coloquial de ので)",s:"informal + んで",bp:"んで",e:"Forma hablada de ので.",ex:[
 {j:"風邪を引いた[んで]、休みます。",s:"Como me he resfriado, falto."},
 {j:"時間がない[んで]、先に行くね。",s:"Como no hay tiempo, me adelanto."},
 {j:"雨[なんで]、中止です。",s:"Como llueve, se cancela.",h:"雨 + なんで"}]},
{id:"chau",lv:10,t:"〜ちゃう / 〜じゃう (coloquial)",s:"V-て (sin て) + ちゃう / V-で (sin で) + じゃう",bp:"ちゃう",e:"Coloquial de てしまう.",ex:[
 {j:"全部[食べちゃった]。",s:"Me lo comí todo.",h:"食べる"},
 {j:"宿題を[忘れちゃった]。",s:"Se me olvidaron los deberes.",h:"忘れる"},
 {j:"本を[読んじゃった]。",s:"Me acabé el libro.",h:"読む + じゃう"}]},
{id:"toka",lv:10,t:"〜とか〜とか",s:"N + とか + N + とか",bp:"とか",e:"Enumeración coloquial de ejemplos («cosas como…»).",ex:[
 {j:"週末は掃除[とか]洗濯[とか]をします。",s:"Los fines de semana hago cosas como limpiar y lavar la ropa."},
 {j:"りんご[とか]バナナ[とか]を買いました。",s:"Compré manzanas, plátanos y cosas así."},
 {j:"映画[とか]音楽[とか]が好きです。",s:"Me gustan cosas como el cine y la música."}]},
// ---- nivel 11 ----
{id:"hazu-datta",lv:11,t:"〜はずだった",s:"V-る + はずだった",bp:"はずだった",e:"«Se suponía que» (pero no ocurrió).",ex:[
 {j:"彼は昨日[来るはずでした]。",s:"Se suponía que él venía ayer."},
 {j:"試験は簡単な[はずだった]のに。",s:"Se suponía que el examen sería fácil."},
 {j:"今日は[休みのはずでした]。",s:"Se suponía que hoy era festivo.",h:"休み + の"}]},
{id:"koto-wa",lv:11,t:"〜ことは〜が",s:"V-る + ことは + V-る + が",bp:"ことは〜が",e:"«Hacer, lo hago, pero…»: concesión parcial.",ex:[
 {j:"日本語を[話すことは話します]が、上手じゃありません。",s:"Hablar, hablo japonés, pero no bien.",h:"話す"},
 {j:"[行くことは行きます]が、遅れます。",s:"Ir, voy, pero llegaré tarde.",h:"行く"},
 {j:"[食べることは食べた]が、おいしくなかった。",s:"Comer, comí, pero no estaba bueno.",h:"食べる, pasado"}]},
{id:"you-ni-naru-hab",lv:11,t:"〜なくなる / 〜ようになる (cambio de hábito)",s:"V-ない (sin い) + くなる / V-る + ようになる",bp:"なくなる",e:"Cambio: dejar de hacer algo (なくなる) o empezar a hacerlo (ようになる).",ex:[
 {j:"最近、お酒を[飲まなくなりました]。",s:"Últimamente he dejado de beber.",h:"飲む"},
 {j:"毎朝走る[ようになりました]。",s:"He empezado a correr cada mañana."},
 {j:"テレビを[見なくなった]。",s:"Dejé de ver la tele.",h:"見る, informal"}]},
{id:"ni-shite-wa",lv:11,t:"〜にしては",s:"N・V + にしては",bp:"にしては",e:"«Para ser…»: resultado contrario a lo esperado.",ex:[
 {j:"初めて[にしては]上手ですね。",s:"Para ser la primera vez, lo haces bien."},
 {j:"子ども[にしては]背が高い。",s:"Para ser un niño, es alto."},
 {j:"冬[にしては]暖かい。",s:"Para ser invierno, hace calor."}]},
// ---- nivel 12 ----
{id:"tara-dou",lv:12,t:"〜たらどうですか",s:"V-たら + どうですか",bp:"たらどう",e:"Sugerencia: «¿por qué no…?».",ex:[
 {j:"医者に[行ったらどうですか]。",s:"¿Por qué no vas al médico?",h:"行く"},
 {j:"少し[休んだらどうですか]。",s:"¿Por qué no descansas un poco?",h:"休む"},
 {j:"先生に[聞いたらどう]？",s:"¿Y si le preguntas al profesor?",h:"聞く, informal"}]},
{id:"nagara-mo",lv:12,t:"〜ながらも / 〜のに〜",s:"V-ます + ながら(も) + contraste",bp:"ながらも",e:"«Aunque, a pesar de» (uso contrastivo de ながら).",ex:[
 {j:"[知っていながら]、教えてくれなかった。",s:"Aunque lo sabía, no me lo dijo.",h:"知る + ている"},
 {j:"[狭いながらも]、楽しい我が家。",s:"Aunque pequeña, mi casa es feliz.",h:"狭い"},
 {j:"悪いと[思いながら]、言ってしまった。",s:"Aunque sabía que estaba mal, lo dije.",h:"思う"}]},
{id:"dake-de-naku",lv:12,t:"〜だけでなく〜も",s:"N・informal + だけでなく + 〜も",bp:"だけでなく",e:"«No solo…, sino también».",ex:[
 {j:"彼は英語[だけでなく]、中国語も話せます。",s:"Él habla no solo inglés, sino también chino."},
 {j:"この店は[安いだけでなく]、おいしい。",s:"Esta tienda no solo es barata, también es buena.",h:"安い"},
 {j:"子ども[だけでなく]大人も楽しめます。",s:"Pueden disfrutarlo no solo los niños, también los adultos."}]},
{id:"tokoro-de",lv:12,t:"ところで / それで / そして / それから",s:"conectores de discurso",bp:"ところで",e:"ところで: por cierto (cambio de tema). それで: por eso. そして: y, además. それから: y luego.",ex:[
 {j:"[ところで]、来週の会議はどこですか。",s:"Por cierto, ¿dónde es la reunión de la semana que viene?"},
 {j:"熱が出ました。[それで]、学校を休みました。",s:"Me subió la fiebre. Por eso falté a la escuela."},
 {j:"買い物をして、[それから]映画を見ました。",s:"Hice compras y luego vi una película."}]},
// ---- nivel 13 ----
{id:"sae-ba",lv:13,t:"〜さえ〜ば",s:"N + さえ + V-ば",bp:"さえ〜ば",e:"«Con tal de que…, basta con…».",ex:[
 {j:"お金[さえあれば]、何でも買えます。",s:"Con tal de tener dinero, se puede comprar cualquier cosa.",h:"ある + ば"},
 {j:"薬を[飲みさえすれば]、治ります。",s:"Basta con tomar la medicina para curarse.",h:"飲む + さえすれば"},
 {j:"時間[さえあれば]、行きたい。",s:"Si al menos tuviera tiempo, querría ir."}]},
{id:"toshite",lv:13,t:"〜として",s:"N + として",bp:"として",e:"«Como, en calidad de».",ex:[
 {j:"留学生[として]日本に来ました。",s:"Vine a Japón como estudiante de intercambio."},
 {j:"彼は医者[として]働いています。",s:"Él trabaja como médico."},
 {j:"趣味[として]写真を撮っています。",s:"Hago fotos como afición."}]},
{id:"wake-da",lv:13,t:"〜わけだ / 〜わけではない",s:"informal + わけだ / わけではない",bp:"わけだ",e:"わけだ: «por eso, con razón» (conclusión lógica). わけではない: «no es que…».",ex:[
 {j:"彼は日本に十年住んでいた。日本語が上手な[わけだ]。",s:"Vivió diez años en Japón. Con razón habla bien japonés."},
 {j:"嫌いな[わけではありません]が、今日は食べたくない。",s:"No es que no me guste, pero hoy no quiero comerlo.",h:"negación"},
 {j:"忙しい[わけではない]。",s:"No es que esté ocupado."}]},
{id:"ni-chigainai",lv:13,t:"〜に違いない / 〜に決まっている",s:"informal + に違いない",bp:"に違いない",e:"Certeza fuerte: «seguro que, sin duda».",ex:[
 {j:"彼が犯人[に違いない|にちがいない]。",s:"Sin duda él es el culpable."},
 {j:"この店は高い[に決まっている|にきまっている]。",s:"Seguro que esta tienda es cara."},
 {j:"あの人は日本人[に違いない|にちがいない]。",s:"Esa persona tiene que ser japonesa."}]}
];

{id:"r4",lv:5,title:"日本の電車",sub:"Los trenes de Japón (N4)",t:
"[日本|にほん|Japón]の[電車|でんしゃ|tren]は[時間|じかん|tiempo]に[正確|せいかく|puntual]だと[言われています|いわれています|se dice]。[朝|あさ|mañana]の[七時|しちじ|las siete]から[九時|くじ|las nueve]までは[通勤|つうきん|ir al trabajo]の[時間|じかん|hora]で、[駅|えき|estación]も[電車|でんしゃ|tren]もとても[込んでいます|こんでいます|estar lleno]。[乗る|のる|subir]ことが[できない|できない|no poder]ほど[人|ひと|gente]が[多い|おおい|mucho]ときもあります。[でも|でも|pero]、[電車|でんしゃ|tren]の[中|なか|dentro]はとても[静か|しずか|silencioso]です。[電話|でんわ|teléfono]で[話して|はなして|hablar]はいけませんし、[大きい|おおきい|grande][声|こえ|voz]で[話す|はなす|hablar][人|ひと|persona]も[少ない|すくない|poco]です。[外国人|がいこくじん|extranjero]は[最初|さいしょ|al principio]は[びっくりします|びっくりします|sorprenderse]が、[すぐに|すぐに|enseguida][慣れる|なれる|acostumbrarse]そうです。[電車|でんしゃ|tren]が[遅れた|おくれた|retrasarse (pasado)]ときは、[駅|えき|estación]で「[遅延|ちえん|retraso][証明書|しょうめいしょ|certificado]」を[もらう|もらう|recibir]ことができます。[会社|かいしゃ|empresa]に[見せる|みせる|mostrar]ためのものです。",

{id:"r6",lv:9,title:"お花見の約束",sub:"Una cita para ver los cerezos (N4)",t:

{id:"r7",lv:11,title:"便利すぎる生活",sub:"Una vida demasiado cómoda (N4)",t:
"[最近|さいきん|últimamente]、[スマートフォン|スマートフォン|smartphone]が[なければ|なければ|si no hay][何も|なにも|nada][できない|できない|no poder][人|ひと|persona]が[増えている|ふえている|estar aumentando]そうです。[道|みち|camino]を[調べる|しらべる|consultar]のも、[買い物|かいもの|compras]をするのも、[友だち|ともだち|amigo]と[連絡|れんらく|contacto]を[取る|とる|tomar]のも、[全部|ぜんぶ|todo][スマートフォン|スマートフォン|smartphone]です。[確かに|たしかに|ciertamente][便利|べんり|cómodo]ですが、[使いすぎる|つかいすぎる|usar demasiado]のは[体|からだ|cuerpo]にも[心|こころ|mente]にも[よくない|よくない|no es bueno]と[医者|いしゃ|médico]は[言っています|いっています|dice]。[私|わたし|yo]も[夜|よる|noche][寝る|ねる|dormir][前|まえ|antes]に[スマートフォン|スマートフォン|smartphone]を[見てしまって|みてしまって|acabar mirando]、[なかなか|なかなか|no fácilmente][眠れない|ねむれない|no poder dormir]ことがあります。[そこで|そこで|por eso]、[寝る|ねる|dormir][一時間|いちじかん|una hora][前|まえ|antes]からは[スマートフォン|スマートフォン|smartphone]を[使わない|つかわない|no usar]ようにしました。[代わりに|かわりに|en su lugar][本|ほん|libro]を[読む|よむ|leer]ことにしたのです。[まだ|まだ|todavía][一週間|いっしゅうかん|una semana]しかたっていませんが、[前|まえ|antes]より[よく|よく|bien][眠れる|ねむれる|poder dormir]ようになった[気|き|sensación]がします。[便利|べんり|cómodo]な[物|もの|cosa]は、[上手に|じょうずに|hábilmente][使えば|つかえば|si se usa][使うほど|つかうほど|cuanto más se usa][生活|せいかつ|vida]が[よくなる|よくなる|mejorar]のだと[思います|おもいます|pienso]。",
es:"Dicen que últimamente aumenta la gente que no puede hacer nada sin el smartphone. Consultar el camino, hacer compras, contactar con los amigos: todo con el smartphone. Ciertamente es cómodo, pero los médicos dicen que usarlo demasiado no es bueno ni para el cuerpo ni para la mente. A mí también me pasa que antes de dormir acabo mirando el móvil y no consigo dormirme. Por eso decidí no usar el móvil desde una hora antes de acostarme. En su lugar, decidí leer libros. Solo ha pasado una semana, pero tengo la sensación de que ahora duermo mejor que antes. Creo que cuanto mejor se usan las cosas cómodas, más mejora la vida.",

{id:"r8",lv:13,title:"日本語を学ぶということ",sub:"Lo que significa aprender japonés (N4+)",t:
"[日本語|にほんご|japonés]を[勉強し|べんきょうし|estudiar][始めた|はじめた|empezar (pasado)]ころ、[私|わたし|yo]は[漢字|かんじ|kanji]が[大嫌い|だいきらい|odiar]でした。[一つ|ひとつ|uno][覚えて|おぼえて|memorizar]も、[次|つぎ|siguiente]の[日|ひ|día]には[忘れてしまう|わすれてしまう|acabar olvidando]からです。[先生|せんせい|profesor]に[相談した|そうだんした|consultar (pasado)]ところ、「[漢字|かんじ|kanji]は[一つずつ|ひとつずつ|uno a uno][覚える|おぼえる|memorizar]ものではなく、[言葉|ことば|palabra]の[中|なか|dentro]で[覚える|おぼえる|memorizar]ものだ」と[教えて|おしえて|enseñar]くださいました。[それ|それ|eso]からは、[読める|よめる|poder leer]ように[なりたい|なりたい|querer volverse][文章|ぶんしょう|texto]を[毎日|まいにち|cada día][少しずつ|すこしずつ|poco a poco][読む|よむ|leer]ことにしました。[分からない|わからない|no entender][言葉|ことば|palabra]があっても、[辞書|じしょ|diccionario]を[引かずに|ひかずに|sin consultar][最後|さいご|final]まで[読んで|よんで|leer]から[調べる|しらべる|buscar]ようにしました。[不思議|ふしぎ|extraño]なことに、[同じ|おなじ|mismo][漢字|かんじ|kanji]に[何度も|なんども|muchas veces][出会う|であう|encontrarse]うちに、[自然に|しぜんに|naturalmente][覚えられる|おぼえられる|poder memorizar]ようになったのです。[今|いま|ahora]では[新聞|しんぶん|periódico]も[少し|すこし|un poco][読める|よめる|poder leer]ようになりました。[語学|ごがく|aprendizaje de idiomas]は[才能|さいのう|talento]ではなく、[続ける|つづける|continuar]ことだと[思います|おもいます|pienso]。[どんなに|どんなに|por mucho que][忙しくても|いそがしくても|aunque esté ocupado]、[一日|いちにち|un día][十分|じゅっぷん|diez minutos]でもいいから[続けてください|つづけてください|siga, por favor]。[続ければ|つづければ|si continúas][続けるほど|つづけるほど|cuanto más continúes]、[日本語|にほんご|japonés]は[あなた|あなた|tú]のものになります。",
es:"Cuando empecé a estudiar japonés, odiaba los kanji. Porque aunque memorizara uno, al día siguiente se me olvidaba. Al consultarlo con el profesor, me enseñó que «los kanji no se memorizan uno a uno, sino dentro de las palabras». Desde entonces decidí leer cada día, poco a poco, textos que quería llegar a poder leer. Aunque hubiera palabras que no entendía, procuraba leer hasta el final sin consultar el diccionario y buscarlas después. Curiosamente, mientras me encontraba con los mismos kanji una y otra vez, llegué a memorizarlos de forma natural. Ahora incluso puedo leer un poco el periódico. Creo que aprender un idioma no es cuestión de talento, sino de continuar. Por muy ocupado que estés, aunque sean diez minutos al día, sigue. Cuanto más continúes, más tuyo será el japonés.",

const READINGS_TALES = [{"id": "t1", "lv": 2, "title": "桃太郎", "sub": "Momotarō (cuento tradicional, N5)", "t": "[昔々|むかしむかし|hace mucho tiempo]、[ある||cierto, un][ところ||lugar]に[おじいさん||anciano, abuelo]と[おばあさん||anciana, abuela]が[住んでいました|すんでいました|vivir (residir)]。[おじいさん||anciano, abuelo]は[山|やま|montaña]へ[行って|いって|ir]、[おばあさん||anciana, abuela]は[川|かわ|río]へ[行きました|いきました|ir]。\\n[おばあさん||anciana, abuela]が[川|かわ|río]で[洗濯|せんたく|colada]を[している||hacer]と、[大きい|おおきい|grande][桃|もも|melocotón]が[流れてきました|ながれてきました|fluir, flotar]。[おばあさん||anciana, abuela]は[桃|もも|melocotón]を[家|いえ|casa]に[持って|もって|tener][帰りました|かえりました|volver (a casa)]。\\n[おじいさん||anciano, abuelo]が[桃|もも|melocotón]を[切る|きる|cortar]と、[中|なか|dentro]から[元気|げんき|sano]な[男の子|おとこのこ|niño]が[出てきました|でてきました|salir]。[二人|ふたり|dos personas]は[男の子|おとこのこ|niño]に「[桃太郎|ももたろう|Momotarō]」と[いう||decir, llamarse][名前|なまえ|nombre]を[つけました||poner (nombre)]。\\n[桃太郎|ももたろう|Momotarō]は[大きく|おおきく|grande][なりました||volverse, llegar a ser]。[ある||haber, existir][日|ひ|día]、[桃太郎|ももたろう|Momotarō]は[言いました|いいました|decir]。「[鬼が島|おにがしま|isla de los ogros]へ[行って|いって|ir]、[悪い|わるい|malo][鬼|おに|ogro]と[戦います|たたかいます|luchar]。」\\n[おばあさん||anciana, abuela]は[きび||mijo][だんご||bolita (dulce)]を[作りました|つくりました|hacer]。[桃太郎|ももたろう|Momotarō]は[犬|いぬ|perro]と[猿|さる|mono]と[鳥|とり|pájaro]に[会いました|あいました|encontrarse con]。三匹は[きび||mijo][だんご||bolita (dulce)]を[もらって||recibir]、[桃太郎|ももたろう|Momotarō]と[一緒|いっしょ|juntos]に[行きました|いきました|ir]。\\n[鬼が島|おにがしま|isla de los ogros]で[桃太郎|ももたろう|Momotarō]たちは[鬼|おに|ogro]と[戦って|たたかって|luchar]、[勝ちました|かちました|ganar]。[桃太郎|ももたろう|Momotarō]は[宝物|ほうもつ|tesoro]を[持って|もって|tener]、[村|むら|aldea]に[帰りました|かえりました|volver (a casa)]。[おじいさん||anciano, abuelo]と[おばあさん||anciana, abuela]は[とても||muy][喜びました|よろこびました|alegrarse]。", "es": "Hace mucho tiempo, en un lugar, vivían un anciano y una anciana. El anciano fue a la montaña y la anciana al río. Mientras la anciana lavaba la ropa en el río, llegó flotando un melocotón grande. La anciana se lo llevó a casa. Cuando el anciano cortó el melocotón, salió de dentro un niño lleno de energía. Los dos le pusieron el nombre de «Momotarō». Momotarō creció. Un día dijo: «Iré a la isla de los ogros y lucharé contra los ogros malvados». La anciana preparó bolitas de mijo. Momotarō se encontró con un perro, un mono y un pájaro. Los tres recibieron bolitas y fueron con él. En la isla, Momotarō y sus compañeros lucharon contra los ogros y ganaron. Momotarō volvió a la aldea con un tesoro. El anciano y la anciana se alegraron mucho.", "g": [], "q": [{"q": "おばあさんは川で何をしていましたか。", "o": ["魚を取っていました", "洗濯をしていました", "桃を食べていました", "泳いでいました"], "a": 1}, {"q": "桃太郎は誰と鬼が島へ行きましたか。", "o": ["おじいさんとおばあさん", "犬と猿と鳥", "村の人たち", "一人で行きました"], "a": 1}, {"q": "桃太郎は村に何を持って帰りましたか。", "o": ["桃", "きびだんご", "宝物", "鬼"], "a": 2}]}, {"id": "t2", "lv": 3, "title": "浦島太郎", "sub": "Urashima Tarō (cuento tradicional, N5+)", "t": "[昔|むかし|antiguamente]、[浦島太郎|うらしまたろう|Urashima Tarō]と[いう||decir, llamarse][若い|わかい|joven][漁師|りょうし|pescador]が[いました||estar, haber (seres)]。[ある||haber, existir][日|ひ|día]、[浜|はま|playa]で[子どもたち|こどもたち|niños]が[亀|かめ|tortuga]を[いじめていました||maltratar]。[太郎|たろう|Tarō (nombre)]は[子どもたち|こどもたち|niños]に[言いました|いいました|decir]。「[やめ||parar, dejar de][なさい||hacer (honorífico)]。[かわいそう||pobrecito, digno de lástima]だよ。」[そして||y entonces][亀|かめ|tortuga]を[海|うみ|mar]に[帰しました|かえしました|devolver, dejar ir]。\\n[次の日|つぎのひ|el día siguiente]、[その||ese][亀|かめ|tortuga]が[来て|きて|venir][言いました|いいました|decir]。「[昨日|きのう|ayer]は[ありがとう||gracias][ございました||ser (muy cortés)]。[お礼|おれい|agradecimiento]に[竜宮城|りゅうぐうじょう|Palacio del Dragón]へ[連れて行きます|つれていきます|llevar (a alguien)]。」[太郎|たろう|Tarō (nombre)]は[亀|かめ|tortuga]の[背中|せなか|espalda]に[乗って|のって|subirse, montar]、[海|うみ|mar]の[底|そこ|fondo]へ[行きました|いきました|ir]。\\n[竜宮城|りゅうぐうじょう|Palacio del Dragón]は[とても||muy][きれい||bonito, limpio]な[所|ところ|lugar]でした。[乙姫|おとひめ|princesa Otohime]様が[太郎|たろう|Tarō (nombre)]を[迎えて|むかえて|recibir, dar la bienvenida]、[毎日|まいにち|cada día][おいしい||delicioso][料理|りょうり|cocina]と[ダンス|だんす|baile]で[楽しませました|たのしませました|disfrutar]。[太郎|たろう|Tarō (nombre)]は[時間|じかん|tiempo]を[忘れました|わすれました|olvidar]。\\n三[年|ねん|año]が[たって||pasar (tiempo)]、[太郎|たろう|Tarō (nombre)]は[言いました|いいました|decir]。「[そろそろ||ya va siendo hora][家|いえ|casa]に[帰ります|かえります|volver (a casa)]。」[乙姫|おとひめ|princesa Otohime]様は[玉手箱|たまてばこ|caja de Otohime]を[くれました||dar (a mí)]。「[これ||esto]は[絶対|ぜったい|absolutamente]に[開けないでください|あけないでください|abrir (algo)]。」\\n[太郎|たろう|Tarō (nombre)]が[村|むら|aldea]に[帰る|かえる|volver (a casa)]と、[知っている|しっている|saber][人|ひと|persona]は[誰|だれ|quién]も[いませんでした||estar, haber (seres)]。三百[年|ねん|año]が[たっていた||pasar (tiempo)]のです。[太郎|たろう|Tarō (nombre)]は[悲しく|かなしく|triste][なって||volverse, llegar a ser]、[玉手箱|たまてばこ|caja de Otohime]を[開けました|あけました|abrir (algo)]。[白い|しろい|blanco][煙|けむり|humo]が[出て|でて|salir]、[太郎|たろう|Tarō (nombre)]は[おじいさん||anciano, abuelo]に[なってしまいました||volverse, llegar a ser]。", "es": "Hace mucho tiempo vivía un joven pescador llamado Urashima Tarō. Un día, en la playa, unos niños maltrataban a una tortuga. Tarō les dijo: «Parad. Pobrecita». Y devolvió la tortuga al mar. Al día siguiente la tortuga vino y dijo: «Gracias por lo de ayer. Como agradecimiento te llevaré al Palacio del Dragón». Tarō se subió al caparazón de la tortuga y fue al fondo del mar. El palacio era un lugar precioso. La princesa Otohime lo recibió y cada día lo entretenía con comida deliciosa y bailes. Tarō olvidó el tiempo. Pasaron tres años y Tarō dijo: «Ya va siendo hora de volver a casa». La princesa le dio una caja (tamatebako): «No la abras nunca». Cuando Tarō volvió a la aldea, no había nadie conocido. Habían pasado trescientos años. Tarō se puso triste y abrió la caja. Salió un humo blanco y Tarō se convirtió en un anciano.", "g": [], "q": [{"q": "太郎はどうして亀を助けましたか。", "o": ["亀が大きかったから", "子どもたちが亀をいじめていたから", "亀が泣いていたから", "乙姫様に言われたから"], "a": 1}, {"q": "太郎は竜宮城に何年いましたか。", "o": ["一年", "三年", "三十年", "三百年"], "a": 1}, {"q": "玉手箱を開けると、どうなりましたか。", "o": ["宝物が出てきました", "亀が出てきました", "太郎はおじいさんになりました", "太郎は竜宮城に戻りました"], "a": 2}]}, {"id": "t3", "lv": 4, "title": "笠地蔵", "sub": "Los Jizō con sombreros (cuento de Año Nuevo, N4)", "t": "[昔|むかし|antiguamente]、[貧しい|まずしい|pobre][おじいさん||anciano, abuelo]と[おばあさん||anciana, abuela]が[いました||estar, haber (seres)]。お[正月|しょうがつ|Año Nuevo]が[近い|ちかい|cerca]のに、お[餅|もち|mochi]を[買う|かう|comprar][お金|おかね|dinero]が[ありませんでした||haber, existir]。\\n[おじいさん||anciano, abuelo]は[笠|かさ|sombrero de paja]を五つ[作って|つくって|hacer]、[町|まち|pueblo]へ[売り|うり|venta]に[行きました|いきました|ir]。でも、[雪|ゆき|nieve]の[日|ひ|día]で、[誰|だれ|quién]も[笠|かさ|sombrero de paja]を[買ってくれませんでした|かってくれませんでした|comprar]。\\n[帰る|かえる|volver (a casa)][途中|とちゅう|a medio camino]、[おじいさん||anciano, abuelo]は[道|みち|camino]に六つのお[地蔵|じぞう|Jizō (estatua budista)]さんを[見つけました|みつけました|encontrar]。お[地蔵|じぞう|Jizō (estatua budista)]さんの[頭|あたま|cabeza]に[雪|ゆき|nieve]が[積もっていました|つもっていました|acumularse]。「[寒いでしょう|さむいでしょう|frío (clima)]。[これ||esto]を[かぶってください||ponerse (en la cabeza)]。」[おじいさん||anciano, abuelo]は[笠|かさ|sombrero de paja]を五つ[かぶせました||poner (en la cabeza de otro)]。一つ[足りなかった|たりなかった|ser suficiente]ので、[自分|じぶん|uno mismo]の[手ぬぐい|てぬぐい|toalla de mano]を[最後|さいご|último]のお[地蔵|じぞう|Jizō (estatua budista)]さんに[かぶせました||poner (en la cabeza de otro)]。\\n[家|いえ|casa]に[帰って|かえって|volver (a casa)]、[おじいさん||anciano, abuelo]は[おばあさん||anciana, abuela]に[話しました|はなしました|hablar]。[おばあさん||anciana, abuela]は[怒らないで|おこらないで|enfadarse]、「[いい||bueno][こと||cosa, hecho]を[しました||hacer]ね」と[言いました|いいました|decir]。\\n[その||ese][夜|よる|noche]、[外|そと|fuera]で[大きな|おおきな|grande][音|おと|sonido]が[しました||hacer]。[二人|ふたり|dos personas]が[戸|と|puerta]を[開ける|あける|abrir (algo)]と、お[米|こめ|arroz (crudo)]やお[餅|もち|mochi]や[魚|さかな|pez]が[たくさん||mucho][置いてありました|おいてありました|poner, dejar]。[雪|ゆき|nieve]の[中|なか|dentro]を、[笠|かさ|sombrero de paja]を[かぶった||ponerse (en la cabeza)]お[地蔵|じぞう|Jizō (estatua budista)]さんたちが[帰っていく|かえっていく|volver (a casa)]のが[見えました|みえました|verse]。", "es": "Hace mucho vivían un anciano y una anciana muy pobres. Aunque se acercaba el Año Nuevo, no tenían dinero para comprar mochi. El anciano hizo cinco sombreros de paja y fue a venderlos al pueblo. Pero era un día de nieve y nadie se los compró. De vuelta, encontró en el camino seis estatuas de Jizō. Tenían nieve acumulada en la cabeza. «Tendréis frío. Poneos esto». Les puso los cinco sombreros. Como faltaba uno, le puso su propia toalla al último. Al llegar a casa se lo contó a la anciana. Ella no se enfadó: «Has hecho algo bueno», dijo. Esa noche se oyó un gran ruido fuera. Cuando abrieron la puerta, había mucho arroz, mochi y pescado. Vieron a los Jizō con sombrero alejándose por la nieve.", "g": [], "q": [{"q": "おじいさんはどうして町へ行きましたか。", "o": ["お餅を買うため", "笠を売るため", "お地蔵さんに会うため", "雪を見るため"], "a": 1}, {"q": "最後のお地蔵さんには何をかぶせましたか。", "o": ["笠", "雪", "手ぬぐい", "お餅"], "a": 2}, {"q": "おばあさんは話を聞いて、どうしましたか。", "o": ["怒りました", "泣きました", "いいことをしたと言いました", "笠を作りました"], "a": 2}]}, {"id": "t4", "lv": 5, "title": "鶴の恩返し", "sub": "La grulla agradecida (N4)", "t": "[昔|むかし|antiguamente]、[ある||haber, existir][村|むら|aldea]に[若い|わかい|joven][男|おとこ|hombre]が[一人|ひとり|una persona]で[住んでいました|すんでいました|vivir (residir)]。[冬|ふゆ|invierno]の[寒い|さむい|frío (clima)][日|ひ|día]、[男|おとこ|hombre]は[罠|わな|trampa]に[かかった||quedar atrapado; tardar][鶴|つる|grulla]を[見つけて|みつけて|encontrar]、[助けてやりました|たすけてやりました|salvar, ayudar]。\\n[その||ese][夜|よる|noche]、[美しい|うつくしい|hermoso][女|おんな|mujer]の[人|ひと|persona]が[男|おとこ|hombre]の[家|いえ|casa]に[来ました|きました|venir]。「[道|みち|camino]に[迷ってしまいました|まよってしまいました|perderse]。[泊めていただけません|とめていただけません|alojar]か。」[二人|ふたり|dos personas]は[やがて||al poco tiempo][結婚|けっこん|casarse][しました||hacer]。\\n[妻|つま|esposa]は[言いました|いいました|decir]。「[私|わたくし|yo]が[布|ぬの|tela]を[織っている|おっている|tejer][間|あいだ|entre]は、[絶対|ぜったい|absolutamente]に[部屋|へや|habitación]を[見ないでください|みないでください|ver]。」[妻|つま|esposa]が[織った|おった|tejer][布|ぬの|tela]は[とても||muy][美しくて|うつくしくて|hermoso]、[高く|たかく|alto][売れました|うれました|venderse]。[男|おとこ|hombre]は[だんだん||poco a poco]お[金持ち|かねもち|rico]に[なりました||volverse, llegar a ser]。\\nでも、[妻|つま|esposa]は[織る|おる|tejer][たび||cada vez que]に[やせていきました||adelgazar]。[男|おとこ|hombre]は[心配|しんぱい|preocupación]に[なって||volverse, llegar a ser]、[約束|やくそく|promesa]を[破って|やぶって|romper (promesa)][部屋|へや|habitación]を[のぞいてしまいました||espiar, asomarse]。\\n[部屋|へや|habitación]の[中|なか|dentro]には[鶴|つる|grulla]が[いました||estar, haber (seres)]。[鶴|つる|grulla]は[自分|じぶん|uno mismo]の[羽|はね|pluma]を[抜いて|ぬいて|arrancar]、[布|ぬの|tela]を[織っていた|おっていた|tejer]のです。「[見られてしまった|みられてしまった|ver]ので、[もう||ya][ここ||aquí]には[いられません||estar, haber (seres)]。」[鶴|つる|grulla]は[空|そら|cielo]へ[飛んでいきました|とんでいきました|volar]。[男|おとこ|hombre]は[約束|やくそく|promesa]を[守らなかった|まもらなかった|cumplir, proteger][こと||cosa, hecho]を、[いつ||cuándo]までも[後悔|こうかい|arrepentimiento][しました||hacer]。", "es": "Hace mucho, en una aldea, vivía solo un hombre joven. Un frío día de invierno encontró una grulla atrapada en una trampa y la liberó. Esa noche, una mujer hermosa llegó a su casa: «Me he perdido. ¿Podría alojarme?». Pronto se casaron. La esposa dijo: «Mientras tejo, no mires nunca en la habitación». La tela que tejía era bellísima y se vendía cara. El hombre se fue haciendo rico. Pero la esposa adelgazaba cada vez que tejía. El hombre, preocupado, rompió la promesa y miró. En la habitación había una grulla: se arrancaba sus propias plumas para tejer la tela. «Ahora que me has visto, ya no puedo quedarme aquí». La grulla voló hacia el cielo. El hombre se arrepintió para siempre de no haber cumplido la promesa.", "g": [], "q": [{"q": "男は冬の日に何をしましたか。", "o": ["鶴を売りました", "罠にかかった鶴を助けました", "布を織りました", "女の人と結婚しました"], "a": 1}, {"q": "妻は男に何を頼みましたか。", "o": ["布を売らないこと", "部屋を見ないこと", "お金持ちになること", "鶴を助けること"], "a": 1}, {"q": "鶴は何で布を織っていましたか。", "o": ["糸", "雪", "自分の羽", "男の服"], "a": 2}]}, {"id": "t5", "lv": 6, "title": "花咲かじいさん", "sub": "El anciano que hacía florecer los árboles (N4)", "t": "[昔|むかし|antiguamente]、[正直|しょうじき|honrado]な[おじいさん||anciano, abuelo]と、[隣|となり|al lado, vecino]に[欲張り|よくばり|codicioso]な[おじいさん||anciano, abuelo]が[住んでいました|すんでいました|vivir (residir)]。[正直|しょうじき|honrado]な[おじいさん||anciano, abuelo]は[白い|しろい|blanco][犬|いぬ|perro]を[飼っていて|かっていて|criar (animal)]、[とても||muy][かわい||mono, adorable]がって[い||estar, haber (seres)]ました。\\n[ある||haber, existir][日|ひ|día]、[犬|いぬ|perro]が[畑|はたけ|campo de cultivo]で「[ここ||aquí][掘れ|ほれ|cavar]、[ワンワン|わんわん|guau guau]」と[鳴きました|なきました|ladrar, cantar (animal)]。[おじいさん||anciano, abuelo]が[そこ||ahí]を[掘る|ほる|cavar]と、[金貨|きんか|moneda de oro]が[たくさん||mucho][出てきました|でてきました|salir]。\\n[隣|となり|al lado, vecino]の[おじいさん||ancia |おとして|dejar caer][逃げました|にげました|huir]。\\n[娘|むすめ|hija]が[小槌|こづち|mazo pequeño]を[振る|ふる|agitar]と、一[寸|すん|sun (3 cm)][法師|ほうし|monje (一寸法師: nombre)]は[どんどん||cada vez más][大きく|おおきく|grande][なって||volverse, llegar a ser]、[立派|りっぱ|admirable, espléndido]な[若者|わかもの|joven (persona)]に[なりました||volverse, llegar a ser]。[二人|ふたり|dos personas]は[結婚|けっこん|casarse][して||hacer]、[幸せ|しあわせ|feliz]に[暮らしました|くらしました|vivir (día a día)]。", "es": "Hace mucho, un matrimonio sin hijos rezó a los dioses y recibió un niño. Pero era del tamaño de un dedo. Lo llamaron Issun-bōshi y lo criaron con cariño. No creció, pero era muy vivaz. Un día dijo: «Quiero ir a la capital y llegar a ser alguien», y con una aguja por espada, un cuenco por barco y un palillo por remo, bajó el río. En la capital entró a trabajar en casa de un ministro. La hija del ministro era amable y se hicieron amigos. Un día, de camino a un templo, apareció un ogro que intentó llevársela. Issun-bōshi saltó dentro de la boca del ogro y lo pinchó por dentro con su aguja. El ogro, dolorido, dejó caer su mazo mágico y huyó. Cuando la muchacha agitó el mazo, Issun-bōshi creció y creció hasta convertirse en un joven apuesto. Se casaron y vivieron felices.", "g": [], "q": [{"q": "一寸法師は何を刀にしましたか。", "o": ["箸", "針", "お椀", "小槌"], "a": 1}, {"q": "一寸法師はどうやって鬼に勝ちましたか。", "o": ["鬼の口に飛び込んで中から突きました", "小槌で鬼をたたきました", "娘と一緒に逃げました", "大臣を呼びました"], "a": 0}, {"q": "小槌を振ると、どうなりましたか。", "o": ["鬼が消えました", "一寸法師が大きくなりました", "娘が小さくなりました", "宝物が出ました"], "a": 1}]}, {"id": "t7", "lv": 8, "title": "かぐや姫", "sub": "La princesa Kaguya (N4)", "t": "[昔|むかし|antiguamente]、[竹|たけ|bambú]を[取って|とって|tomar][生活|せいかつ|vida (cotidiana)][している||hacer][おじいさん||anciano, abuelo]が[いました||estar, haber (seres)]。[ある||haber, existir][日|ひ|día]、[光る|ひかる|brillar][竹|たけ|bambú]を[見つけて切ってみる|みつけてきってみる|encontrar]と、[中|なか|dentro]に[小さな|ちいさな|pequeño][女の子|おんなのこ|niña]が[いました||estar, haber (seres)]。[おじいさん||anciano, abuelo]は[女の子|おんなのこ|niña]を[家|いえ|casa]に[連れて|つれて|llevar (a alguien)][帰り|かえり|volver (a casa)]、[おばあさん||anciana, abuela]と[一緒|いっしょ|j pidieron su mano. Kaguya pidió a cada uno un tesoro que nadie tenía. Pero ninguno pudo traer uno auténtico. Con el tiempo, Kaguya empezó a llorar mirando la luna: «Soy de la capital de la luna. En la noche de luna llena vendrán a buscarme». Esa noche, con la luz de la luna, descendieron los mensajeros. Kaguya dejó una carta a los ancianos y volvió a la luna. Ellos siguieron mirando la luna para siempre.", "g": [], "q": [{"q": "おじいさんは女の子をどこで見つけましたか。", "o": ["山の中", "光る竹の中", "月の都", "川のそば"], "a": 1}, {"q": "かぐや姫は貴族たちに何を頼みましたか。", "o": ["金を持ってくること", "誰も持っていない宝物を持ってくること", "月へ行くこと", "竹を切ること"], "a": 1}, {"q": "かぐや姫はどうして泣いていましたか。", "o": ["結婚したくなかったから", "月に帰らなければならなかったから", "おじいさんが病気だったから", "宝物がなかったから"], "a": 1}]}, {"id": "t8", "lv": 9, "title": "さるかに合戦", "sub": "La batalla del mono y el cangrejo (N4)", "t": "[昔|むかし|antiguamente]、[蟹|かに|cangrejo]が[おにぎり||bola de arroz]を[持って|もって|tener][歩いている|あるいている|caminar]と、[猿|さる|mono]が[柿|かき|caqui]の[種|たね|semilla]を[持ってやって来ました|もってやってきました|tener]。[猿|さる|mono]は「[おにぎり||bola de arroz]と[柿|かき|caqui]の[種|たね|semilla]を[交換|こうかん|intercambio][しよう||hacer]。[種|しゅ|semilla]を[植えれ|うえれ|plantar]ば、[柿|かき|caqui]が[毎年|まいとし|cada año][食べられる|たべられる|comer]よ」と[言いました|いいました|decir]。[蟹|かに|cangrejo]は[交換|こうかん|intercambio][しました||hacer]。\\n[蟹|かに|cangrejo]は[種|しゅ|semilla]を[植えて|うえて|plantar]、[毎日|まいにち|cada día][水|みず|agua]を[やりました||dar (a inferior); hacer]。[柿|かき|caqui]の[木|き|árbol]は[すぐ||enseguida]に[大きく|おおきく|grande][なって||volverse, llegar a ser]、[たくさん||mucho]の[実|じつ|fruto]が[なりました||volverse, llegar a ser]。でも、[蟹|かに|cangrejo]は[木|き|árbol]に[登る|のぼる|trepar, subir][こと||cosa, hecho]が[できません||poder; hacerse]。\\n[そこ||ahí]へ[猿|さる|mono]が[来て|きて|venir]、「[僕|ぼく|yo (masculino)]が[取ってあげよう|とってあげよう|tomar]」と[言って|いって|decir][木|き|árbol]に[登りました|のぼりました|trepar, subir]。[猿|さる|mono]は[熟した|じゅくした|madurar][柿|かき|caqui]を[自分|じぶん|uno mismo]だけで[食べて|たべて|comer]、[蟹|かに|cangrejo]には[青くて|あおくて|azul][固い|かたい|duro][柿|かき|caqui]を[投げつけました|なげつけました|arrojar contra]。[蟹|かに|cangrejo]は大[けが||herida]を[しました||hacer]。\\n[蟹|かに|cangrejo]の[子どもたち|こどもたち|niños]は[怒って|おこって|enf const STAGE_HOURS = [0, 4, 8, 24, 48, 24*7, 24*14, 24*30, 24*120, Infinity];

function srsAnswer(rec, correct, wrongCount=1){
  if (correct) { rec.s=Math.min(9,rec.s+1); rec.c=(rec.c||0)+1; }
  else { const pen = rec.s>=5 ? 2*Math.ceil(wrongCount/2) : Math.ceil(wrongCount/2); rec.s=Math.max(1,rec.s-pen); rec.w=(rec.w||0)+wrongCount; }

}

  M.weekly={last:Math.max((L.weekly||{}).last||0,(R.weekly||{}).last||0)};

  M.stats={...(L.stats||{})}; for (const [f,v] of Object.entries(R.stats||{})){ const l=M.stats[f]||{c:0,w:0}; M.stats[f]={c:Math.max(l.c||0,v.c||0), w:Math.max(l.w||0,v.w||0)}; }

}

function parseCloze(j){
  const m = j.match(/^(.*?)\[([^\]]+)\](.*)$/s);
  if (!m) return {pre:j, answers:[], post:''};
  return {pre:m[1], answers:m[2].split('|'), post:m[3]};
}
function kanjiReadings(k){
  const on=(k.on||[]).map(r=>kataToHira(r.split('.')[0]));
  const kun=(k.kun||[]).map(r=>r.split('.')[0]).filter(Boolean);
  return uniq([...on,...kun]);
}
function facetsFor(it){ return it.kind==='k'?['kr','km'] : it.kind==='v'?['vp','vr','vm'] : ['gc']; }
const FACET_LABEL = {km:'Significado del kanji', kr:'Lectura del kanji', vm:'Significado', vr:'Lectura', vp:'Producción: del español al japonés', gc:'Gramática: completa la frase'};
function kanjiDistractors(v){
  const word=v.w; const chars=[...word].filter(c=>hasKanji(c));
  let pool = VOCAB_ALL.filter(x=>x.w!==word && hasKanji(x.w) && !(VOCAB_BY_WORD[x.w]||[]).some(y=>y.r===v.r&&y.w===v.w));
  const share = pool.filter(x=>chars.some(c=>x.w.includes(c)));
  const sameLen = pool.filter(x=>x.w.length===word.length && !share.includes(x));
  const out = uniq([...pick(share,2), ...shuffle(sameLen), ...shuffle(pool)].map(x=>x.w)).filter(w=>w!==word).slice(0,3);
  return out;
}
// Construye la pregunta de una faceta
function buildPrompt(it, facet){
  const p={it,facet};
  if (facet==='km'){ p.kind='k'; p.main=it.k; p.ask='Significado'; p.input='es'; p.check=a=>matchEs(a,it.m); p.correct=it.m.join(', '); }
  else if (facet==='kr'){ p.kind='k'; p.main=it.k; p.ask='Lectura (cualquiera)'; p.input='kana'; const acc=kanjiReadings(it); p.check=a=>matchKana(a,acc); p.correct=acc.join('・'); }
  else if (facet==='vm'){ p.kind='v'; p.main=it.w; p.ask='Significado'; p.input='es'; p.check=a=>matchEs(a,it.m); p.correct=it.m.join(', '); }
  else if (facet==='vr'){ p.kind='v'; p.main=it.w; p.ask='Lectura'; p.input='kana'; p.check=a=>matchKana(a,[it.r]); p.correct=it.r; }
  else if (facet==='vp'){ p.kind='p'; p.mainEs=it.m.join(', '); p.sub=it.p?posLabel(it.p):''; p.ask='Escribe la palabra en japonés'; p.input='kana'; p.check=a=>matchKana(a,[it.r]); p.correct=it.r+(hasKanji(it.w)?'（'+it.w+'）':''); if (hasKanji(it.w)) { p.pick={correct:it.w, options:shuffle([it.w,...kanjiDistractors(it)])}; } }
  else if (facet==='gc'){ p.kind='g'; const ex = it._ex || rnd(it.ex); const c=parseCloze(ex.j); p.cloze=c; p.ex=ex; p.ask='Completa'; p.input='kana'; const acc=uniq([...c.answers, ...(ex.k?[ex.k]:[]), ...(typeof CLOZE_KANA!=='undefined'&&CLOZE_KANA[c.answers[0]]?[CLOZE_KANA[c.answers[0]]]:[])]); p.check=a=>{ const t=toKana(a,true); return acc.some(x=>normKana(x)===normKana(t)) || acc.some(x=>x===a.trim()); }; p.correct=c.answers[0]; }
  return p;
}

// ===================== Motor de sesión =====================
let SESSION=null;
function startSession(mode, items, opts={}){
  const results={}; const its=shuffle(items); const passes=[[],[],[]];
  for (const it of its){ const k=keyOf(it); const fs=facetsFor(it); results[k]={wrong:0,left:new Set(fs),it}; fs.forEach((f,i)=>passes[i].push({k,f})); }
  // primera pasada: la faceta principal de cada ítem (español→japonés en vocabulario); luego el resto
  const queue=[...shuffle(passes[0]), ...shuffle(passes[1]), ...shuffle(passes[2])];
  SESSION={mode, queue, results, total:items.length, done:0, correct:0, cur:null, phase:'ask', opts, startedAt:now(), wrongKeys:new Set()};
  nextCard();
}
function nextCard(){
  const s=SESSION; if(!s) return;
  if (!s.queue.length){ finishSession(); return; }
  // evita repetir la misma palabra dos veces seguidas si hay alternativa
  if (s.cur && s.queue.length>1 && s.queue[0].k===s.cur.k){ const i=s.queue.findIndex(q=>q.k!==s.cur.k); if(i>0){ const [q]=s.queue.splice(i,1); s.queue.unshift(q);} }
  const q=s.queue.shift(); const it=s.results[q.k].it;
  s.cur={k:q.k,f:q.f,p:buildPrompt(it,q.f),wrong:false}; s.phase='ask'; renderStudy();
}
function snapshotForUndo(){ const s=SESSION, c=s.cur; const rec=S.items[c.k]; s.undo={cur:{...c}, result:{wrong:s.results[c.k].wrong, left:new Set(s.results[c.k].left)}, queue:s.queue.slice(), done:s.done, correct:s.correct, rec:rec?JSON.parse(JSON.stringify(rec)):null, hadRec:!!rec, day:JSON.parse(JSON.stringify(day())), stats:JSON.parse(JSON.stringify(S.stats||{})), wrongHad:s.wrongKeys.has(c.k)}; }
function undoLast(){ const s=SESSION; if(!s||!s.undo) return; const u=s.undo; s.cur=u.cur; s.results[u.cur.k].wrong=u.result.wrong; s.results[u.cur.k].left=u.result.left; s.queue=u.queue; s.done=u.done; s.correct=u.correct; if(u.hadRec) S.items[u.cur.k]=u.rec; else delete S.items[u.cur.k]; S.days[todayKey()]=u.day; S.stats=u.stats; if(!u.wrongHad) s.wrongKeys.delete(u.cur.k); s.undo=null; s.phase='ask'; s.cur.ok=undefined; s.cur.answer=undefined; save(); renderStudy(); }
function markAsCorrect(){ const s=SESSION; if(!s||!s.undo) return; const u=s.undo; undoLast(); SESSION.cur=u.cur; SESSION.cur.answer=u.cur.answer; answerCurrent(true); }
function answerCurrent(correct){
  const s=SESSION, c=s.cur, r=s.results[c.k]; snapshotForUndo();
  if (s.mode!=='lesson'){ S.stats=S.stats||{}; const st=S.stats[c.f]=S.stats[c.f]||{c:0,w:0}; if(correct) st.c++; else st.w++; }
  if (correct){
    r.left.delete(c.f);
    if (!r.left.size){ completeItem(c.k); }
  } else {
    r.wrong++; s.wrongKeys.add(c.k);
    const pos=Math.min(s.queue.length, 2+Math.floor(Math.random()*5)); s.queue.splice(pos,0,{k:c.k,f:c.f});
  }
  s.phase='feedback'; c.ok=correct; renderStudy();
}
function completeItem(k){
  const s=SESSION, r=s.results[k]; s.done++;

// ===================== Ritmo adaptativo =====================
function stats7(){ const t=new Date(); t.setHours(0,0,0,0); let r=0,rc=0,l=0,active=0; for(let i=0;i<7;i++){ const d=S.days[todayKey(new Date(t.getTime()-i*D))]; if(!d) continue; r+=d.r||0; rc+=d.rc||0; l+=d.l||0; if(dayCounts(d)) active++; } return {r,rc,l,active,acc:r?rc/r:null}; }
function clearedStreak(){ // días seguidos (antes de hoy) con la cola vaciada y buena precisión
  let n=0; const t=new Date(); t.setHours(0,0,0,0); for(let i=1;i<=7;i++){ const d=S.days[todayKey(new Date(t.getTime()-i*D))]; if(!d||!d.cleared||!(d.r>=10)||(d.rc/d.r)<0.9) break; n++; } return n; }
function paceToday(){
  const k=todayKey(); S.pace=S.pace||{goal:null,day:null,mode:'normal'};
  if (S.pace.day===k && S.pace.lessons!=null) return S.pace;
  const ceiling=Math.max(0,S.settings.goalLessons||10); const manual=!!S.settings.manualPace;
  const due=dueItems().length, appr=Object.entries(S.items).filter(([key,r])=>ITEMS.has(key)&&r.s>=1&&r.s<=4).length, missed=daysMissed(), st=stats7(), lch=leeches().length;
  let prev=S.pace.goal!=null?S.pace.goal:Math.min(ceiling,10); let goal=prev, mode='normal', why='';
  if (manual){ goal=ceiling; mode='manual'; why='Ritmo fijo: has desactivado la adaptación.'; }
  else if (due>100){ goal=0; mode='recuperacion'; why=`${due} repasos pendientes. Hoy solo repasar, en sesiones cortas.`; }
  else if (appr>120){ goal=0; mode='recuperacion'; why=`${appr} ítems en fase Aprendiz: demasiada carga nueva a la vez. Deja que se asienten.`; }
  else if (missed>=2){ goal=0; mode='recuperacion'; why=`Vuelves tras ${missed} días. Hoy solo repasos, sin prisa. Mañana retomamos lecciones.`; }
  else if (st.acc!=null && st.r>=30 && st.acc<0.75){ goal=Math.max(2,Math.floor(prev/2)); mode='suave'; why=`Precisión del ${Math.round(st.acc*100)} % esta semana. Menos material nuevo hasta que suba.`; }
  else if (lch>=8){ goal=Math.max(2,Math.floor(prev/2)); mode='suave'; why=`${lch} sanguijuelas. Antes de añadir, machaca las que fallas siempre.`; }
  else if (due>60 || appr>90){ goal=Math.max(2,Math.min(prev,ceiling)-2); mode='suave'; why=due>60?`${due} repasos esperando: bajo el ritmo un poco.`:`${appr} en Aprendiz: bajo el ritmo un poco.`; }
  else { const cs=clearedStreak(); if (cs>=3 && (st.acc==null||st.acc>=0.9) && appr<70 && due<30){ goal=Math.min(ceiling,prev+2); mode=goal>prev?'impulso':'normal'; why=goal>prev?`${cs} días seguidos con la cola vacía y más del 90 %: subo a ${goal}.`:`Vas bien y al techo que fijaste (${ceiling}).`; } else { goal=Math.min(ceiling,Math.max(prev,Math.min(ceiling,prev+ (prev<ceiling&&st.active>=3?1:0)))); mode='normal'; why=`Carga equilibrada: ${goal} ${plural(goal,'lección','lecciones')} hoy.`; } }
  goal=Math.max(0,Math.min(ceiling,goal));
  const maxReviews = mode==='recuperacion'?40 : mode==='suave'?60 : (S.settings.maxReviews||100);
  S.pace={goal, lessons:goal, day:k, mode, why, maxReviews, due, appr}; saveLocal(); return S.pace;
}

// Mapea etapas de WaniKani (0-9) a las nuestras (misma escala)
function importSync(text){
  let o; try{ o=JSON.parse(text); }catch(e){ toast('JSON no válido'); return; }
  let wkMatched=0, bpMatched=0;
  if (o.wanikani && Array.isArray(o.wanikani.items)){
    for (const it of o.wanikani.items){ // {type:'kanji'|'vocabulary', chars, srs, meanings:[], readings:[]}
      if (!it.srs) continue;
      const keys=[]; if (it.type==='kanji') keys.push('k|'+it.chars); else if (it.type==='vocabulary'){ for (const v of VOCAB_BY_WORD[it.chars]||[]) keys.push('v|'+v.w+'|'+v.r); }
      for (const k of keys){ if(!ITEMS.has(k)) continue; const cur=S.items[k]; const s=Math.max(1,Math.min(9,it.srs)); if(!cur||cur.s<s){ S.items[k]={...(cur||{c:0,w:0}), s, due: s>=9?Infinity:now()+STAGE_HOURS[s]*H*Math.random(), lrn:cur&&cur.lrn||now(), ls:now()}; wkMatched++; } }
    }
    S.sync.wkLevel=o.wanikani.level;
  }
  if (o.bunpro && Array.isArray(o.bunpro.items)){
    const norm=s=>String(s||'').replace(/[〜～\s()（）・、。～\-ー]/g,'').replace(/[Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).toLowerCase();
    for (const it of o.bunpro.items){ // {title, srs (0-12 Bunpro), learned}
      const t=norm(it.title); if(!t) continue;
      const g=GRAMMAR_ALL.find(x=>norm(x.bp)===t||norm(x.t)===t||norm(x.t).includes(t)||t.includes(norm(x.bp)));
      if (!g) continue; const k='g|'+g.id; const s=Math.max(1,Math.min(9,Math.round((it.srs||1)*9/12))); const cur=S.items[k]; if(!cur||cur.s<s){ S.items[k]={...(cur||{c:0,w:0}), s, due:s>=9?Infinity:now()+STAGE_HOURS[s]*H*Math.random(), lrn:now(), ls:now()}; bpMatched++; }
    }
  }
  S.sync={...S.sync,date:now(),wkMatched,bpMatched};
  // sube el nivel si todo lo de los niveles inferiores ya está aprendido
  while (S.level<13 && itemsOfLevel(S.level).length && itemsOfLevel(S.level).every(it=>S.items[keyOf(it)]&&S.items[keyOf(it)].s>=5)) { S.levelPass[S.level]=S.levelPass[S.level]||'sync'; S.level++; }
  save(); toast(`Sincronizado: ${wkMatched} de WaniKani, ${bpMatched} de Bunpro`); render();
}

function generationPrompt(lv){
  const tier=tierOf(lv); const ks=(ROADMAP[tier.n].kanjiByLevel||{})[lv]||[]; const gs=(ROADMAP[tier.n].grammarByLevel||{})[lv]||[];
  return `Eres un profesor de japonés. Genera el contenido del nivel ${lv} (JLPT ${tier.n}) de una app de estudio para un hispanohablante. Responde SOLO con JSON válido, sin texto alrededor, con esta forma exacta:
{"lv":${lv},"kanji":[{"k":"漢","m":["significado1","significado2"],"on":["カン"],"kun":["から"],"mn":"mnemotecnia breve en español que relacione los componentes con el significado"}],
 "vocab":[{"w":"漢字","r":"かんじ","m":["kanji"],"p":"n","ex":"frase de ejemplo natural y corta en japonés","es":"traducción al español"}],
 "grammar":[{"id":"identificador-ascii","t":"〜ばかりか","s":"estructura","e":"explicación clara en español de 2 a 4 frases, con matices de uso y registro","ex":[{"j":"frase con la parte gramatical entre corchetes [así]","s":"traducción","h":"pista opcional: verbo base o forma","k":"lectura en kana de la parte entre corchetes"}]}]}
Reglas: los significados ("m") en español, cortos, sin artículos. Las lecturas on en katakana y las kun en hiragana (sin puntos). Para cada kanji incluye exactamente 2 palabras de vocabulario frecuentes y de nivel ${tier.n} que lo contengan (campo "w"), con "p" entre: n, v5, v1, vk, adj-i, adj-na, adv, n-vs, exp. Para cada punto gramatical incluye 3 ejemplos; la parte entre corchetes debe ser exactamente lo que el estudiante escribirá, y "k" su lectura en hiragana. Usa vocabulario de nivel ${tier.n} o inferior en los ejemplos.
Kanji del nivel (carácter, lecturas de referencia, significado en inglés): ${ks.map(k=>k.k+' ('+(k.on||[]).join('/')+'; '+(k.kun||[]).join('/')+'; '+(k.en||[]).join(', ')+')').join(' | ')}
Puntos gramaticales del nivel: ${gs.join(' | ')}`;
}
function validateGen(o, lv){
  if (!o||typeof o!=='object') return 'no es un objeto';
  const ks=Array.isArray(o.kanji)?o.kanji.filter(k=>k&&typeof k.k==='string'&&k.k.length===1&&Array.isArray(k.m)&&k.m.length):[];
  const vs=Array.isArray(o.vocab)?o.vocab.filter(v=>v&&v.w&&v.r&&Array.isArray(v.m)&&v.m.length):[];
  const gs=Array.isArray(o.grammar)?o.grammar.filter(g=>g&&g.t&&Array.isArray(g.ex)&&g.ex.some(e=>e&&/\[[^\]]+\]/.test(e.j||''))).map(g=>({...g,id:(g.id||g.t).toString().replace(/[^\w\-一-龯ぁ-んァ-ン〜]/g,'')+'-'+lv,ex:g.ex.filter(e=>e&&/\[[^\]]+\]/.test(e.j||''))})):[];
  if (!ks.length&&!gs.length) return 'sin kanji ni gramática válidos';
  return {lv, kanji:ks.map(k=>({k:k.k,m:k.m,on:k.on||[],kun:k.kun||[],mn:k.mn||''})), vocab:vs.map(v=>({w:v.w,r:v.r,m:v.m,p:v.p||'n',ex:v.ex||'',es:v.es||''})), grammar:gs.map(g=>({id:g.id,t:g.t,s:g.s||'',e:g.e||'',ex:g.ex.map(e=>({j:e.j,s:e.s||'',h:e.h||'',k:e.k||''}))})), generated:now()};
}

  const box=h('div',{class:'card stack',style:'margin-top:12px'}, h('h3',{},'Cuentas autorizadas'), h('p',{class:'small muted',style:'margin:0'},'Solo tú ves este panel. Las cuentas de esta lista pueden entrar y usar las funciones de Claude; el resto puede iniciar sesión con Google pero no accede a nada.'));
  const list=h('div',{class:'list'}); const email=h('input',{type:'email',placeholder:'correo@gmail.com',autocomplete:'off',style:'flex:1;min-width:0'}); const note=h('input',{type:'text',placeholder:'nota (opcional)',style:'flex:1;min-width:0'});
  const refresh=async()=>{ list.innerHTML=''; try{ const rows=await adminList(); if(!rows.length) list.append(h('div',{class:'small muted'},'Lista vacía (ejecuta schema3.sql).')); rows.forEach(r=>list.append(h('div',{class:'item'}, h('div',{style:'flex:1;min-width:0'}, h('div',{class:'t'},r.email), h('div',{class:'small muted'},(r.note||'')+(r.added_at?' · '+fmtDate(new Date(r.added_at).getTime()):''))), r.email.toLowerCase()===(USER.email||'').toLowerCase()?h('span',{class:'badge soft'},'tú'):h('button',{class:'btn sm warn',onclick:()=>confirmBox(`¿Quitar el acceso a ${r.email}? Su progreso se conserva pero no podrá entrar.`,async()=>{ try{ await adminRemove(r.email); toast('Acceso retirado'); refresh(); }catch(e){ toast('Error: '+e.message); } })},'Quitar')))); }catch(e){ list.append(h('div',{class:'small muted'},'No se pudo leer la lista: '+e.message+'. ¿Has ejecutado schema3.sql?')); } };
  box.append(list, h('div',{class:'row'}, email, note, h('button',{class:'btn primary',onclick:async()=>{ const v=email.value.trim().toLowerCase(); if(!v.includes('@')){ toast('Correo no válido'); return; } try{ await adminAdd(v,note.value.trim()); email.value=''; note.value=''; toast('Cuenta autorizada'); refresh(); }catch(e){ toast('Error: '+e.message); } }},'Autorizar')));
  refresh(); return box;
}


</script>
</body>
</html>
