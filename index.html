<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eeebe3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Dojo 日本語</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap"></noscript>
</head>
<body>
<style>
/* Layout: barra lateral fija en escritorio, pestañas inferiores en móvil; una vista activa a la vez. */
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  --bg:#eeebe3; --fg:#2f3330; --muted:#62675f; --line:#dcd8cd; --card:#f7f5ef; --card2:#e7e3d8;
  --accent:#4a6446; --accent-fg:#ffffff; --accent-soft:#e3e8de; --kanji-c:#64523f; --kanji-soft:#ece6dd; --shadow:none;
  --leaf:#4b6239; --leaf-soft:#e3e8de;
  --warn:#8f5646; --warn-soft:#efe3dd; --ok:#4a6446; --ok-soft:#e3e8de; --gold:#7f6e3f;
  --kanji:#1b2230; --radius:10px;
  --f-ui:"Figtree","Noto Sans JP",system-ui,sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-jp-display:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151a17; --fg:#e3e4dc; --muted:#959b92; --line:#283029; --card:#1b211d; --card2:#232b25;
  --accent:#9db48f; --accent-fg:#131813; --accent-soft:#25302a;
  --leaf:#9db48f; --leaf-soft:#25302a; --warn:#cf9a8a; --warn-soft:#382a26; --ok:#9db48f; --ok-soft:#25302a; --gold:#c6b27e; --kanji:#eceee6; --kanji-c:#c2ad98; --kanji-soft:#302b25; --shadow:none; color-scheme:dark }
 }
:root[data-theme="dark"]{
  --bg:#151a17; --fg:#e3e4dc; --muted:#959b92; --line:#283029; --card:#1b211d; --card2:#232b25;
  --accent:#9db48f; --accent-fg:#131813; --accent-soft:#25302a;
  --leaf:#9db48f; --leaf-soft:#25302a; --warn:#cf9a8a; --warn-soft:#382a26; --ok:#9db48f; --ok-soft:#25302a; --gold:#c6b27e; --kanji:#eceee6; --kanji-c:#c2ad98; --kanji-soft:#302b25; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url("icons/garden.svg") center bottom / cover no-repeat;opacity:.2;transition:opacity .8s}
body.login-mode::after{opacity:.4}
.app{position:relative;z-index:1}
@media (max-width:860px){ body::after{background-size:220% auto;background-position:62% 100%;opacity:.19} body.login-mode::after{opacity:.38} }
:root[data-theme="dark"] body::after{opacity:.16;filter:brightness(.55) saturate(.8)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body::after{opacity:.16;filter:brightness(.55) saturate(.8)} }
:lang(ja),.jp{font-family:var(--f-jp)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.5rem;font-weight:500;font-family:var(--f-jp-display),var(--f-ui);letter-spacing:.01em}
h2{font-size:1.1rem;font-weight:500;font-family:var(--f-jp-display),var(--f-ui)}
h3{font-size:1rem;font-weight:600;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
nav.side{position:sticky;top:0;height:100vh;height:100dvh;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:color-mix(in srgb, var(--bg) 88%, transparent);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 10px 14px}
.brand b{font-family:var(--f-jp-display);font-size:1.35rem;letter-spacing:.02em}
.brand span{font-size:.8rem;color:var(--muted)}
nav.side button,nav.tabs button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;width:100%;color:var(--fg)}
nav.side button .ic{width:22px;text-align:center;font-family:var(--f-jp-display);font-size:1.05rem;color:var(--muted)}
nav.side button.active{background:var(--card2);color:var(--fg);font-weight:600}
nav.side button.active .ic{color:var(--accent)}
nav.side button .badge{margin-left:auto}
.badge{display:inline-block;min-width:1.6em;padding:1px 7px;border-radius:999px;background:var(--card2);color:var(--muted);font-size:.72rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.badge.warn{background:var(--card2);color:var(--warn)}
.badge.ok{background:var(--card2);color:var(--muted)}
.badge.soft{background:var(--card2);color:var(--muted)}
nav.side .foot{margin-top:auto;padding:10px;font-size:.78rem;color:var(--muted)}
nav.tabs{display:none}
header.mobile{display:none}
main{min-width:0;padding-block:28px 48px;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;min-width:0}
.view{display:none}
.view.active{display:block}
.topline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.topline h1{margin-right:auto}

.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card.soft{background:var(--card2);border-color:transparent}
.stack{display:flex;flex-direction:column;gap:10px}
.grid > .card.stack > .btn:last-child,.grid > .card.stack > .row:last-child{margin-top:auto}
.grid > .card{display:flex;flex-direction:column}
.card > h3 + .small,.card > h3 + p{margin-top:2px}
.row.between > h3{line-height:1.3}
.pill{line-height:1.5;vertical-align:middle}
.badge{line-height:1.5}
.eyebrow{line-height:1.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.sp{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;min-height:44px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.leaf{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.warn{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn.ghost{background:transparent}
.btn.big{padding:14px 18px;font-size:1.05rem;min-height:52px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;min-height:36px;font-size:.85rem}

.action{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;width:100%;transition:border-color .15s}
.action:active{transform:scale(.985)}
.action .big-n{font-size:1.9rem;font-weight:500;font-variant-numeric:tabular-nums;min-width:2.4em;width:2.4em;text-align:center;font-family:var(--f-ui);line-height:1;display:flex;align-items:center;justify-content:center;height:2.2em;font-family:var(--f-ui),var(--f-jp-display)}
.action .t{font-weight:700}
.action .d{color:var(--muted);font-size:.9rem}
.action .big-n{color:var(--fg);font-family:var(--f-jp-display),var(--f-ui)}
.action.locked{opacity:.7;cursor:default}
.action.locked .big-n{color:var(--muted)}
.action:disabled{cursor:not-allowed}
.action:hover{border-color:var(--accent)}

.bar{height:10px;border-radius:999px;background:var(--card2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar.leaf > i{background:var(--leaf)}
.bar.gold > i{background:var(--gold)}
.push{border-left:2px solid var(--line);background:transparent;padding:4px 14px;color:var(--muted);font-size:.95rem}
.push.ok,.push.info{border-color:var(--line)}
.push.warnish{border-color:var(--warn);color:var(--fg)}

.forecast{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:auto}
.forecast > div{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.forecast > div > i{position:absolute;inset:auto 0 0 0;background:var(--accent);border-radius:3px 3px 0 0}
.forecast-labels{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}

/* Tarjeta de estudio */
.study{max-width:720px;margin:0 auto}
.study-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.85rem;color:var(--muted);min-height:40px;flex-wrap:wrap}
.prompt-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 20px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px}

.big-jp{font-family:var(--f-jp-display);font-size:clamp(2.6rem,10vw,4.8rem);line-height:1.15;color:var(--kanji);font-weight:500}
.mid-jp{font-family:var(--f-jp);font-size:clamp(1.3rem,4.5vw,1.8rem);line-height:1.6}
.big-es{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:700;line-height:1.2}
.ask{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--accent);margin:0 2px;vertical-align:bottom}
.answer{display:flex;gap:8px;margin-top:12px}
.answer input{flex:1;min-width:0;font-size:1.3rem;padding:12px 14px;border:1px solid var(--line);border-bottom:2px solid var(--fg);border-radius:10px;background:var(--card);text-align:center;font-family:var(--f-jp)}
.answer input.right{border-color:var(--ok);background:var(--ok-soft)}
.answer input.wrong{border-color:var(--warn);background:var(--warn-soft)}
.feedback{margin-top:12px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--card)}
.feedback .verdict{font-weight:700;margin-bottom:6px}
.feedback .verdict.ok{color:var(--ok)}
.feedback .verdict.ko{color:var(--warn)}
.feedback dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 0}
.feedback dt{color:var(--muted);font-size:.85rem}
.feedback dd{margin:0}
.feedback.quick{text-align:center;padding:12px 14px}
.feedback.quick .verdict{margin-bottom:2px}
/* Resumen de sesión: cada ítem con su ficha desplegable */
.sess{display:flex;flex-direction:column;gap:8px}
.sess details{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px}
.sess details.ko{border-color:var(--warn)}
.sess summary{display:flex;align-items:center;gap:12px;min-height:56px;cursor:pointer;list-style:none;padding:6px 0}
.sess summary::-webkit-details-marker{display:none}
.sess summary .t{font-weight:600}
.sess details[open] summary{border-bottom:1px dashed var(--line)}
.sess .body{padding:8px 0 12px}
.sess .body dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.sess .body dt{color:var(--muted);font-size:.85rem}
.sess .body dd{margin:0;min-width:0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.choices button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:12px;font-family:var(--f-jp);font-size:1.25rem;min-height:56px}
.choices button.right{border-color:var(--ok);background:var(--ok-soft)}
.choices button.wrong{border-color:var(--warn);background:var(--warn-soft)}
.choices.text button{font-size:1rem;text-align:left;font-family:var(--f-jp)}
.choices.one{grid-template-columns:1fr}
.lesson-body{text-align:left}
.lesson-body .readings{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.lesson-body .readings b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lesson-body .mn{background:var(--card2);padding:10px 12px;border-radius:8px;margin-top:10px}
.lesson-body .ex{margin-top:8px;padding:8px 0;border-top:1px dashed var(--line)}
.lesson-body .ex .jp{font-size:1.15rem}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--card2);font-size:.78rem;font-weight:600;color:var(--muted)}
.pill.k{background:var(--kanji-soft);color:var(--kanji-c)}.pill.v{background:var(--accent-soft);color:var(--accent)}.pill.g{background:var(--leaf-soft);color:var(--leaf)}
button.pill{border:0;cursor:pointer;min-height:36px;padding:4px 11px}
.pill.todo{opacity:.55}
.pill.guru{outline:2px solid var(--leaf);outline-offset:1px}
.progress-dots{display:flex;gap:4px;flex-wrap:wrap}
.progress-dots i{width:10px;height:10px;border-radius:3px;background:var(--card2);display:block}
.progress-dots i.on{background:var(--accent)}
.progress-dots i.ko{background:var(--warn)}

/* Hero */
.hero{display:flex;gap:18px;align-items:center;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:20px 20px}
.hero .ring{width:84px;height:84px;flex:none}
.hero .ring svg{display:block;width:84px;height:84px}
.hero .ring text{fill:var(--fg);font-family:var(--f-jp-display);font-weight:500}
.hero .lvl{font-size:1.4rem;font-weight:500;line-height:1.2;font-family:var(--f-jp-display),var(--f-ui)}
.hero .sub{color:var(--muted);font-size:.9rem}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.hero .chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:500;line-height:1.5;display:inline-flex;align-items:center;color:var(--muted)}
/* Acceso */
.login-wrap{min-height:calc(100vh - 80px);min-height:calc(100dvh - 60px);display:flex;align-items:center;justify-content:center;animation:fadein .9s ease both}
body.login-mode nav.side,body.login-mode nav.tabs,body.login-mode header.mobile{display:none}
body.login-mode .app{grid-template-columns:1fr}
body.login-mode main{padding-bottom:24px}
.login{width:min(420px,100%);text-align:center;padding:36px 28px;background:color-mix(in srgb, var(--card) 86%, transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:22px}
.login .enso{width:120px;height:120px;margin:0 auto 10px}
.login .enso path{fill:none;stroke:var(--fg);stroke-width:7;stroke-linecap:round;stroke-dasharray:330;stroke-dashoffset:330;animation:draw 1.6s .2s ease-out forwards;opacity:.85}
.login .enso text{font-family:var(--f-jp-display);font-size:34px;fill:var(--fg)}
.login h1{font-size:1.6rem;margin-top:6px}
.login .sub{color:var(--muted);margin:4px 0 22px}
.login .google{display:inline-flex;align-items:center;gap:10px;width:100%;justify-content:center;background:var(--fg);color:var(--bg);border:0;border-radius:12px;padding:13px 16px;font-weight:600;font-size:1rem;min-height:48px;transition:transform .15s,opacity .15s}
.login .google:hover{opacity:.92}
.login .google:active{transform:scale(.985)}
.login .google svg{width:20px;height:20px;flex:none}
.login .note{color:var(--muted);font-size:.78rem;margin-top:16px}
body.leaving .login-wrap{animation:fadeout .55s ease forwards}
@keyframes fadeout{to{opacity:0}}
.app{animation:fadein .6s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

@keyframes draw{to{stroke-dashoffset:40}}
@media (prefers-reduced-motion:reduce){ .login .enso path{animation:none;stroke-dashoffset:40} }
/* Aviso de versión nueva */
.updatebar{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--accent);border-radius:999px;padding:6px 8px 6px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18);font-size:.9rem;width:max-content;max-width:calc(100% - 24px);white-space:nowrap}
/* Plegables */
details.sec{border-top:1px solid var(--line);padding:10px 0}
details.sec summary{cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:600;list-style:none;min-height:40px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"＋";margin-left:auto;color:var(--muted);font-weight:400}
details.sec[open] summary::after{content:"－"}
details.sec > :not(summary){margin-top:8px}
/* Micro-interacción: la tarjeta entra animada solo cuando aparece una pregunta nueva */
.prompt-card.enter{animation:cardin .28s ease both}
@keyframes cardin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.answer input{transition:border-color .2s,background .2s}
.feedback{animation:cardin .25s ease both}
.sent-play{border:0;background:transparent;color:var(--muted);font-size:.75em;padding:0 6px;cursor:pointer;vertical-align:middle;opacity:.7;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px}
.sent-play:hover{color:var(--accent);opacity:1}
.sent.reading{background:var(--accent-soft);border-radius:4px}
/* Consejos */
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tip .ic{font-size:1.1rem;flex:none;line-height:1.5;width:1.4em;text-align:center}
.tip .b{min-width:0;flex:1}
.tip .b b{display:block;line-height:1.5}
.tip .b p{margin:2px 0 0;font-size:.9rem}
/* Lectura */
.reader{font-family:var(--f-jp);font-size:1.25rem;line-height:2.3;max-width:62ch}
.reader .tok{cursor:pointer;border-radius:4px;padding:0 1px}
.reader .tok:hover,.reader .tok.sel{background:var(--accent-soft)}
.reader rt{font-size:.55em;color:var(--muted)}
.reader.nofuri rt{visibility:hidden}
.reader.nofuri .tok.sel rt{visibility:visible}
#gloss{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.gloss{background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.gloss .w{font-family:var(--f-jp);font-size:1.5rem;font-weight:500}
.gloss .r{color:var(--accent);font-family:var(--f-jp)}
.list{display:flex;flex-direction:column;gap:8px}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:left;width:100%}
.list .item .t{font-weight:600}
.list .item.done{border-color:var(--ok)}
.list .item.locked{opacity:.6}

/* Exámenes */
.exam-q{font-family:var(--f-jp);font-size:1.25rem;line-height:1.9}
.exam-q u{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.exam-q .star{color:var(--gold);font-weight:700}
.exam-q .slot{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--line);margin:0 3px;text-align:center;font-size:.8em;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--warn)}
.section-tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.result-grid .card{padding:10px 12px}
.score{font-size:2.6rem;font-weight:700;line-height:1}
.score.pass{color:var(--ok)}.score.fail{color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.tscroll{overflow-x:auto}

/* Progreso */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stages .card{padding:10px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:64px}
.stages .n{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.stages .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.levelmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px}
.levelmap div{aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--card2);font-size:.8rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.levelmap div.done{background:var(--ok);color:var(--accent-fg)}
.levelmap div.cur{background:var(--accent);color:var(--accent-fg);outline:2px solid var(--accent);outline-offset:2px}
.levelmap div.gen{background:var(--gold);color:var(--accent-fg)}
.tier-row{display:flex;gap:8px;align-items:center;margin:14px 0 6px}

/* Ajustes */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.85rem;font-weight:600}
.field{min-width:0}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);max-width:100%;width:100%;min-width:0;box-sizing:border-box}
.field input[type=checkbox]{width:auto}
.grid > *{min-width:0}
.card{overflow:hidden}
th,td{white-space:nowrap}
td.wrap,th.wrap{white-space:normal}
.field textarea{font-family:ui-monospace,monospace;font-size:.8rem;min-height:120px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);color:var(--fg);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-weight:500;z-index:50;max-width:90vw;font-size:.9rem}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
pre{background:var(--card2);padding:10px;border-radius:8px;overflow-x:auto}
.kbd{font-size:.75rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{display:none}
  header.mobile{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--card);border-bottom:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
  header.mobile .brand{padding:0;flex:1}
  header.mobile button{border:0;background:var(--card2);width:40px;height:40px;border-radius:12px;font-size:1.15rem;display:flex;align-items:center;justify-content:center;color:var(--fg)}
  header.mobile button.active{background:var(--accent-soft);color:var(--accent)}
  nav.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:2px;padding:6px 2px;font-size:.68rem;justify-content:center;align-items:center;color:var(--muted);position:relative}
  nav.tabs button .ic{font-family:var(--f-jp-display);font-size:1.25rem;color:inherit}
  nav.tabs button.active{color:var(--fg);background:none}
  nav.tabs button .badge{position:absolute;top:2px;right:8px;font-size:.65rem;min-width:1.4em;padding:0 5px}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));padding-block-start:0;padding-left:0;padding-right:0}
  /* Concentración: durante una sesión, lección o examen desaparecen pestañas y cabecera (se sale con ✕) */
  body.focus nav.tabs,body.focus header.mobile{display:none}
  body.focus main{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  #gloss{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  main .wrap{padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));width:100%}
  .grid.c2,.grid.c3{grid-template-columns:1fr}
  .stages{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .stages .card{padding:8px 2px}
  .stages .n{font-size:1.05rem}
  .stages .l{font-size:.58rem;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field input[type=range]{padding:0}
  .choices{grid-template-columns:1fr 1fr}
  .reader{font-size:1.15rem}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

 {j:"電気を[消さないでください]。",s:"No apague la luz, por favor.",h:"消す"},
 {j:"[忘れないでください]。",s:"No lo olvide, por favor.",h:"忘れる"}]},

{id:"ta-form",lv:3,t:"Forma た (pasado informal)",s:"V-た",bp:"Verb[た]",e:"Pasado informal. Se forma igual que la forma て cambiando て→た, で→だ.",ex:[

 {j:"すしを[食べたことがありますか]。",s:"¿Has comido sushi alguna vez?",h:"食べる, pregunta"},

{id:"tari-tari",lv:3,t:"〜たり〜たりする",s:"V-たり + V-たり + する",bp:"たり〜たり",e:"Enumera acciones como ejemplos, sin orden: «hago cosas como ... y ...».",ex:[

 {j:"早く[寝たほうがいい]です。",s:"Es mejor acostarse pronto.",h:"寝る"},
 {j:"お酒を[飲まないほうがいい]です。",s:"Es mejor que no bebas alcohol.",h:"飲む, negativo"}]},
{id:"dictionary-form",lv:3,t:"Forma diccionario + こと / の",s:"V-る + こと / の",bp:"Verb[る]",e:"La forma diccionario nominaliza con こと o の: 泳ぐこと = nadar (el hecho de).",ex:[
 {j:"私の趣味は本を[読むこと]です。",s:"Mi afición es leer libros.",h:"読む + こと"},
 {j:"[泳ぐの]が好きです。",s:"Me gusta nadar.",h:"泳ぐ + の"},

{id:"counter",lv:3,t:"Contadores: つ, 人, 枚, 本, 匹",s:"N + を + número+contador + V",bp:"Counters",e:"Los numerales con contador van tras el objeto: りんごを三つ買う. 人 personas (一人・二人・三人), 枚 planos, 本 largos, 匹 animales pequeños.",ex:[

 {j:"だんだん[暖かくなりました]。",s:"Poco a poco ha ido haciendo más calor.",h:"暖かい"},
 {j:"部屋が[きれいになりました]。",s:"La habitación quedó limpia.",h:"きれい"}]},
{id:"dake-shika",lv:3,t:"〜だけ / 〜しか〜ない",s:"N + だけ / N + しか + V-ない",bp:"だけ",e:"だけ = solo (afirmativo). しか = solo, obligatoriamente con verbo negativo, matiz de «nada más que».",ex:[

{id:"to-omou",lv:3,t:"〜と思う",s:"frase informal + と思う",bp:"と思う",e:"Opinión: «creo que». La frase anterior va en forma informal.",ex:[

 {j:"この本は[面白いと思います]。",s:"Creo que este libro es interesante.",h:"面白い"},
 {j:"彼は[来ないと思います]。",s:"Creo que él no vendrá.",h:"来る, negativo"}]},
{id:"to-iu",lv:3,t:"〜と言う / 〜と言っていた",s:"「cita」と言う",bp:"と言う",e:"Citar lo que alguien dijo: 「...」と言いました. Forma indirecta: informal + と言っていました.",ex:[

 {j:"電車が止まった[んです]。",s:"Es que se paró el tren."},
 {j:"頭が痛い[んです]。",s:"Es que me duele la cabeza."}]}

"[大学|だいがく|universidad]に[入って|はいって|entrar]から、[コンビニ|コンビニ|tienda 24h]で[アルバイト|アルバイト|trabajo parcial]を[始めました|はじめました|empezar (pasado)]。[最初|さいしょ|al principio]の[日|ひ|día]は[とても|とても|muy][緊張して|きんちょうして|ponerse nervioso]、[店長|てんちょう|encargado]に[何度も|なんども|muchas veces][同じ|おなじ|mismo]ことを[聞いて|きいて|preguntar]しまいました。[レジ|レジ|caja registradora]の[使い方|つかいかた|modo de uso]も[覚えなければ|おぼえなければ|si no memorizo]なりませんでしたし、[お客さん|おきゃくさん|cliente]に[敬語|けいご|lenguaje cortés]で[話さなければ|はなさなければ|si no hablo]なりませんでした。[店長|てんちょう|encargado]は[厳しい|きびしい|estricto]ですが、[分からない|わからない|no entender]ことがあったら、[いつでも|いつでも|en cualquier momento][聞いて|きいて|preguntar]もいいと[言って|いって|decir]くれました。[一か月|いっかげつ|un mes]たって、[今|いま|ahora]は[一人|ひとり|solo]でも[仕事|しごと|trabajo]が[できる|できる|poder]ようになりました。[給料|きゅうりょう|sueldo]は[高くない|たかくない|no es alto]ですが、[働く|はたらく|trabajar]のは[楽しい|たのしい|divertido]です。",

{id:"r6",lv:9,title:"お花見の約束",sub:"Una cita para ver los cerezos (N4)",t:
"[先週|せんしゅう|la semana pasada]、[山田|やまだ|Yamada]さんから「[日曜日|にちようび|domingo]に[お花見|おはなみ|ver los cerezos]に[行きませんか|いきませんか|¿no vamos?]」という[メール|メール|correo]が[来ました|きました|llegar (pasado)]。[私|わたし|yo]は[日本|にほん|Japón]に[来て|きて|venir]から[まだ|まだ|todavía][一度も|いちども|ni una vez][お花見|おはなみ|ver los cerezos]をしたことがなかったので、[とても|とても|muy][楽しみ|たのしみ|ilusión]にしていました。[ところが|ところが|sin embargo]、[日曜日|にちようび|domingo]の[朝|あさ|mañana]、[窓|まど|ventana]を[開ける|あける|abrir]と、[強い|つよい|fuerte][雨|あめ|lluvia]が[降っていました|ふっていました|estaba lloviendo]。[天気予報|てんきよほう|pronóstico del tiempo]によると、[午後|ごご|tarde]も[やみそうにない|やみそうにない|no parece que pare]ということでした。[がっかりして|がっかりして|decepcionarse]いると、[山田|やまだ|Yamada]さんから[電話|でんわ|teléfono]がありました。「[雨|あめ|lluvia]なら、[うちで|うちで|en mi casa][お花見|おはなみ|ver cerezos][パーティー|パーティー|fiesta]をしよう」と[言って|いって|decir]くれたのです。[桜|さくら|cerezo]の[写真|しゃしん|foto]を[見ながら|みながら|mientras miraba]、[みんなで|みんなで|todos juntos][お弁当|おべんとう|bento]を[食べました|たべました|comer (pasado)]。[本当|ほんとう|de verdad]の[桜|さくら|cerezo]は[見られません|みられません|no pude ver]でしたが、[忘れられない|わすれられない|inolvidable][一日|いちにち|un día]になりました。",
es:"La semana pasada me llegó un correo de Yamada que decía: «¿No vamos a ver los cerezos el domingo?». Como desde que vine a Japón todavía no había ido ni una vez, me hacía mucha ilusión. Sin embargo, el domingo por la mañana, al abrir la ventana, llovía con fuerza. Según el pronóstico, tampoco parecía que fuera a parar por la tarde. Mientras estaba decepcionado, me llamó Yamada. Me dijo: «Si llueve, hagamos la fiesta de los cerezos en mi casa». Mirando fotos de cerezos, comimos bento todos juntos. No pude ver los cerezos de verdad, pero fue un día inolvidable.",
g:["to-iu-noun","ta-koto-ga-aru","to-conditional","sou-ni-nai","nara","nagara","potential"],
q:[{q:"この人はどうしてお花見を楽しみにしていましたか。",o:["桜が好きだから","日本でお花見をしたことがなかったから","山田さんが好きだから","天気がよかったから"],a:1},
   {q:"日曜日の天気はどうでしたか。",o:["晴れでした","午後から晴れました","一日中雨でした","雪が降りました"],a:2},
   {q:"結局、二人は何をしましたか。",o:["公園で桜を見ました","家でお花見パーティーをしました","お花見をやめて寝ました","写真を撮りに行きました"],a:1}]},
{id:"r7",lv:11,title:"便利すぎる生活",sub:"Una vida demasiado cómoda (N4)",t:
"[最近|さいきん|últimamente]、[スマートフォン|スマートフォン|smartphone]が[なければ|なければ|si no hay][何も|なにも|nada][できない|できない|no poder][人|ひと|persona]が[増えている|ふえている|estar aumentando]そうです。[道|みち|camino]を[調べる|しらべる|consultar]のも、[買い物|かいもの|compras]をするのも、[友だち|ともだち|amigo]と[連絡|れんらく|contacto]を[取る|とる|tomar]のも、[全部|ぜんぶ|todo][スマートフォン|スマートフォン|smartphone]です。[確かに|たしかに|ciertamente][便利|べんり|cómodo]ですが、[使いすぎる|つかいすぎる|usar demasiado]のは[体|からだ|cuerpo]にも[心|こころ|mente]にも[よくない|よくない|no es bueno]と[医者|いしゃ|médico]は[言っています|いっています|dice]。[私|わたし|yo]も[夜|よる|noche][寝る|ねる|dormir][前|まえ|antes]に[スマートフォン|スマートフォン|smartphone]を[見てしまって|みてしまって|acabar mirando]、[なかなか|なかなか|no fácilmente][眠れない|ねむれない|no poder dormir]ことがあります。[そこで|そこで|por eso]、[寝る|ねる|dormir][一時間|いちじかん|una hora][前|まえ|antes]からは[スマートフォン|スマートフォン|smartphone]を[使わない|つかわない|no usar]ようにしました。[代わりに|かわりに|en su lugar][本|ほん|libro]を[読む|よむ|leer]ことにしたのです。[まだ|まだ|todavía][一週間|いっしゅうかん|una semana]しかたっていませんが、[前|まえ|antes]より[よく|よく|bien][眠れる|ねむれる|poder dormir]ようになった[気|き|sensación]がします。[便利|べんり|cómodo]な[物|もの|cosa]は、[上手に|じょうずに|hábilmente][使えば|つかえば|si se usa][使うほど|つかうほど|cuanto más se usa][生活|せいかつ|vida]が[よくなる|よくなる|mejorar]のだと[思います|おもいます|pienso]。",
es:"Dicen que últimamente aumenta la gente que no puede hacer nada sin el smartphone. Consultar el camino, hacer compras, contactar con los amigos: todo con el smartphone. Ciertamente es cómodo, pero los médicos dicen que usarlo demasiado no es bueno ni para el cuerpo ni para la mente. A mí también me pasa que antes de dormir acabo mirando el móvil y no consigo dormirme. Por eso decidí no usar el móvil desde una hora antes de acostarme. En su lugar, decidí leer libros. Solo ha pasado una semana, pero tengo la sensación de que ahora duermo mejor que antes. Creo que cuanto mejor se usan las cosas cómodas, más mejora la vida.",
g:["ba-conditional","sou-desu-hearsay","sugiru","te-shimau","you-ni-suru","ni-suru","dake-shika","no-ni-kuraberu"],
q:[{q:"医者は何と言っていますか。",o:["スマートフォンは便利だ","スマートフォンを使いすぎるのはよくない","スマートフォンを使わないほうがいい","本を読むほうがいい"],a:1},

{id:"r8",lv:13,title:"日本語を学ぶということ",sub:"Lo que significa aprender japonés (N4+)",t:
"[日本語|にほんご|japonés]を[勉強し|べんきょうし|estudiar][始めた|はじめた|empezar (pasado)]ころ、[私|わたし|yo]は[漢字|かんじ|kanji]が[大嫌い|だいきらい|odiar]でした。[一つ|ひとつ|uno][覚えて|おぼえて|memorizar]も、[次|つぎ|siguiente]の[日|ひ|día]には[忘れてしまう|わすれてしまう|acabar olvidando]からです。[先生|せんせい|profesor]に[相談した|そうだんした|consultar (pasado)]ところ、「[漢字|かんじ|kanji]は[一つずつ|ひとつずつ|uno a uno][覚える|おぼえる|memorizar]ものではなく、[言葉|ことば|palabra]の[中|なか|dentro]で[覚える|おぼえる|memorizar]ものだ」と[教えて|おしえて|enseñar]くださいました。[それ|それ|eso]からは、[読める|よめる|poder leer]ように[なりたい|なりたい|querer volverse][文章|ぶんしょう|texto]を[毎日|まいにち|cada día][少しずつ|すこしずつ|poco a poco][読む|よむ|leer]ことにしました。[分からない|わからない|no entender][言葉|ことば|palabra]があっても、[辞書|じしょ|diccionario]を[引かずに|ひかずに|sin consultar][最後|さいご|final]まで[読んで|よんで|leer]から[調べる|しらべる|buscar]ようにしました。[不思議|ふしぎ|extraño]なことに、[同じ|おなじ|mismo][漢字|かんじ|kanji]に[何度も|なんども|muchas veces][出会う|であう|encontrarse]うちに、[自然に|しぜんに|naturalmente][覚えられる|おぼえられる|poder memorizar]ようになったのです。[今|いま|ahora]では[新聞|しんぶん|periódico]も[少し|すこし|un poco][読める|よめる|poder leer]ようになりました。[語学|ごがく|aprendizaje de idiomas]は[才能|さいのう|talento]ではなく、[続ける|つづける|continuar]ことだと[思います|おもいます|pienso]。[どんなに|どんなに|por mucho que][忙しくても|いそがしくても|aunque esté ocupado]、[一日|いちにち|un día][十分|じゅっぷん|diez minutos]でもいいから[続けてください|つづけてください|siga, por favor]。[続ければ|つづければ|si continúas][続けるほど|つづけるほど|cuanto más continúes]、[日本語|にほんご|japonés]は[あなた|あなた|tú]のものになります。",
es:"Cuando empecé a estudiar japonés, odiaba los kanji. Porque aunque memorizara uno, al día siguiente se me olvidaba. Al consultarlo con el profesor, me enseñó que «los kanji no se memorizan uno a uno, sino dentro de las palabras». Desde entonces decidí leer cada día, poco a poco, textos que quería llegar a poder leer. Aunque hubiera palabras que no entendía, procuraba leer hasta el final sin consultar el diccionario y buscarlas después. Curiosamente, mientras me encontraba con los mismos kanji una y otra vez, llegué a memorizarlos de forma natural. Ahora incluso puedo leer un poco el periódico. Creo que aprender un idioma no es cuestión de talento, sino de continuar. Por muy ocupado que estés, aunque sean diez minutos al día, sigue. Cuanto más continúes, más tuyo será el japonés.",
g:["te-shimau","you-ni-suru","zu-ni","uchi-ni","no-ni-kuraberu","te-ageru","ni-suru"],
q:[{q:"この人は初め、どうして漢字が嫌いでしたか。",o:["書くのが難しかったから","すぐ忘れてしまったから","先生が厳しかったから","新聞が読めなかったから"],a:1},

   {q:"この人が一番言いたいことは何ですか。",o:["語学には才能が必要だ","漢字は難しい","続けることが大切だ","先生に相談したほうがいい"],a:2}]}
];

const READINGS_TALES = [{"id": "t1", "lv": 2, "title": "桃太郎", "sub": "Momotarō (cuento tradicional, N5)", "t": "[昔々|むかしむかし|hace mucho tiempo]、[ある||cierto, un][ところ||lugar]に[おじいさん||anciano, abuelo]と[おばあさん||anciana, abuela]が[住んでいました|すんでいました|vivir (residir)]。[おじいさん||anciano, abuelo]は[山|やま|montaña]へ[行って|いって|ir]、[おばあさん||anciana, abuela]は[川|かわ|río]へ[行きました|いきました|ir]。\n[おばあさん||anciana, abuela]が[川|かわ|río]で[洗濯|せんたく|colada]を[している||hacer]と、[大きい|おおきい|grande][桃|もも|melocotón]が[流れてきました|ながれてきました|fluir, flotar]。[おばあさん||anciana, abuela]は[桃|もも|melocotón]を[家|いえ|casa]に[持って|もって|tener][帰りました|かえりました|volver (a casa)]。\n[おじいさん||anciano, abuelo]が[桃|もも|melocotón]を[切る|きる|cortar]と、[中|なか|dentro]から[元気|げんき|sano]な[男の子|おとこのこ|niño]が[出てきました|でてきました|salir]。[二人|ふたり|dos personas]は[男の子|おとこのこ|niño]に「[桃太郎|ももたろう|Momotarō]」と[いう||decir, llamarse][名前|なまえ|nombre]を[つけました||poner (nombre)]。\n[桃太郎|ももたろう|Momotarō]は[大きく|おおきく|grande][なりました||volverse, llegar a ser]。[ある||haber, existir][日|ひ|día]、[桃太郎|ももたろう|Momotarō]は[言いました|いいました|decir]。「[鬼が島|おにがしま|isla de los ogros]へ[行って|いって|ir]、[悪い|わるい|malo][鬼|おに|ogro]と[戦います|たたかいます|luchar]。」\n[おばあさん||anciana, abuela]は[きび||mijo][だんご||bolita (dulce)]を[作りました|つくりました|hacer]。[桃太郎|ももたろう|Momotarō]は[犬|いぬ|perro]と[猿|さる|mono]と[鳥|とり|pájaro]に[会いました|あいました|encontrarse con]。三匹は[きび||mijo][だんご||bolita (dulce)]を[もらって||recibir]、[桃太郎|ももたろう|Momotarō]と[一緒|いっしょ|juntos]に[行きました|いきました|ir]。\n[鬼が島|おにがしま|isla de los ogros]で[桃太郎|ももたろう|Momotarō]たちは[鬼|おに|ogro]と[戦って|たたかって|luchar]、[勝ちました|かちました|ganar]。[桃太郎|ももたろう|Momotarō]は[宝物|ほうもつ|tesoro]を[持って|もって|tener]、[村|むら|aldea]に[帰りました|かえりました|volver (a casa)]。[おじいさん||anciano, abuelo]と[おばあさん||anciana, abuela]は[とても||muy][喜びました|よろこびました|alegrarse]。", "es": "Hace mucho tiempo, en un lugar, vivían un anciano y una anciana. El anciano fue a la montaña y la anciana al río. Mientras la anciana lavaba la ropa en el río, llegó flotando un melocotón grande. La anciana se lo llevó a casa. Cuando el anciano cortó el melocotón, salió de dentro un niño lleno de energía. Los dos le pusieron el nombre de «Momotarō». Momotarō creció. Un día dijo: «Iré a la isla de los ogros y lucharé contra los ogros malvados». La anciana preparó bolitas de mijo. Momotarō se encontró con un perro, un mono y un pájaro. Los tres recibieron bolitas y fueron con él. En la isla, Momotarō y sus compañeros lucharon contra los ogros y ganaron. Momotarō volvió a la aldea con un tesoro. El anciano y la anciana se alegraron mucho.", "g": [], "q": [{"q": "おばあさんは川で何をしていましたか。", "o": ["魚を取っていました", "洗濯をしていました", "桃を食べていました", "泳いでいました"], "a": 1}, {"q": "桃太郎は誰と鬼が島へ行きましたか。", "o": ["おじいさんとおばあさん", "犬と猿と鳥", "村の人たち", "一人で行きました"], "a": 1}, {"q": "桃太郎は村に何を持って帰りましたか。", "o": ["桃", "きびだんご", "宝物", "鬼"], "a": 2}]}, {"id": "t2", "lv": 3, "title": "浦島太郎", "sub": "Urashima Tarō (cuento tradicional, N5+)", "t": "[昔|むかし|antiguamente]、[浦島太郎|うらしまたろう|Urashima Tarō]と[いう||decir, llamarse][若い|わかい|joven][漁師|りょうし|pescador]が[いました||estar, haber (seres)]。[ある||haber, existir][日|ひ|día]、[浜|はま|playa]で[子どもたち|こどもたち|niños]が[亀|かめ|tortuga]を[いじめていました||maltratar]。[太郎|たろう|Tarō (nombre)]は[子どもたち|こどもたち|niños]に[言いました|いいました|decir]。「[やめ||parar, dejar de][なさい||hacer (honorífico)]。[かわいそう||pobrecito, digno de lástima]だよ。」[そして||y entonces][亀|かめ|tortuga]を[海|うみ|mar]に[帰しました|かえしました|devolver, dejar ir]。\n[次の日|つぎのひ|el día siguiente]、[その||ese][亀|かめ|tortuga]が[来て|きて|venir][言いました|いいました|decir]。「[昨日|きのう|ayer]は[ありがとう||gracias][ございました||ser (muy cortés)]。[お礼|おれい|agradecimiento]に[竜宮城|りゅうぐうじょう|Palacio del Dragón]へ[連れて行きます|つれていきます|llevar (a alguien)]。」[太郎|たろう|Tarō (nombre)]は[亀|かめ|tortuga]の[背中|せなか|espalda]に[乗って|のって|subirse, montar]、[海|うみ|mar]の[底|そこ|fondo]へ[行きました|いきました|ir]。\n[竜宮城|りゅうぐうじょう|Palacio del Dragón]は[とても||muy][きれい||bonito, limpio]な[所|ところ|lugar]でした。[乙姫|おとひめ|princesa Otohime]様が[太郎|たろう|Tarō (nombre)]を[迎えて|むかえて|recibir, dar la bienvenida]、[毎日|まいにち|cada día][おいしい||delicioso][料理|りょうり|cocina]と[ダンス|だんす|baile]で[楽しませました|たのしませました|disfrutar]。[太郎|たろう|Tarō (nombre)]は[時間|じかん|tiempo]を[忘れました|わすれました|olvidar]。\n三[年|ねん|año]が[たって||pasar (tiempo)]、[太郎|たろう|Tarō (nombre)]は[言いました|いいました|decir]。「[そろそろ||ya va siendo hora][家|いえ|casa]に[帰ります|かえります|volver (a casa)]。」[乙姫|おとひめ|princesa Otohime]様は[玉手箱|たまてばこ|caja de Otohime]を[くれました||dar (a mí)]。「[これ||esto]は[絶対|ぜったい|absolutamente]に[開けないでください|あけないでください|abrir (algo)]。」\n[太郎|たろう|Tarō (nombre)]が[村|むら|aldea]に[帰る|かえる|volver (a casa)]と、[知っている|しっている|saber][人|ひと|persona]は[誰|だれ|quién]も[いませんでした||estar, haber (seres)]。三百[年|ねん|año]が[たっていた||pasar (tiempo)]のです。[太郎|たろう|Tarō (nombre)]は[悲しく|かなしく|triste][なって||volverse, llegar a ser]、[玉手箱|たまてばこ|caja de Otohime]を[開けました|あけました|abrir (algo)]。[白い|しろい|blanco][煙|けむり|humo]が[出て|でて|salir]、[太郎|たろう|Tarō (nombre)]は[おじいさん||anciano, abuelo]に[なってしまいました||volverse, llegar a ser]。", "es": "Hace mucho tiempo vivía un joven pescador llamado Urashima Tarō. Un día, en la playa, unos niños maltrataban a una tortuga. Tarō les dijo: «Parad. Pobrecita». Y devolvió la tortuga al mar. Al día siguiente la tortuga vino y dijo: «Gracias por lo de ayer. Como agradecimiento te llevaré al Palacio del Dragón». Tarō se subió al caparazón de la tortuga y fue al fondo del mar. El palacio era un lugar precioso. La princesa Otohime lo recibió y cada día lo entretenía con comida deliciosa y bailes. Tarō olvidó el tiempo. Pasaron tres años y Tarō dijo: «Ya va siendo hora de volver a casa». La princesa le dio una caja (tamatebako): «No la abras nunca». Cuando Tarō volvió a la aldea, no había nadie conocido. Habían pasado trescientos años. Tarō se puso triste y abrió la caja. Salió un humo blanco y Tarō se convirtió en un anciano.", "g": [], "q": [{"q": "太郎はどうして亀を助けましたか。", "o": ["亀が大きかったから", "子どもたちが亀をいじめていたから", "亀が泣いていたから", "乙姫様に言われたから"], "a": 1}, {"q": "太郎は竜宮城に何年いましたか。", "o": ["一年", "三年", "三十年", "三百年"], "a": 1}, {"q": "玉手箱を開けると、どうなりましたか。", "o": ["宝物が出てきました", "亀が出てきました", "太郎はおじいさんになりました", "太郎は竜宮城に戻りました"], "a": 2}]}, {"id": "t3", "lv": 4, "title": "笠地蔵", "sub": "Los Jizō con sombreros (cuento de Año Nuevo, N4)", "t": "[昔|むかし|antiguamente]、[貧しい|まずしい|pobre][おじいさん||anciano, abuelo]と[おばあさん||anciana, abuela]が[いました||estar, haber (seres)]。お[正月|しょうがつ|Año Nuevo]が[近い|ちかい|cerca]のに、お[餅|もち|mochi]を[買う|かう|comprar][お金|おかね|dinero]が[ありませんでした||haber, existir]。\n[おじいさん||anciano, abuelo]は[笠|かさ|sombrero de paja]を五つ[作って|つくって|hacer]、[町|まち|pueblo]へ[売り|うり|venta]に[行きました|いきました|ir]。でも、[雪|ゆき|nieve]の[日|ひ|día]で、[誰|だれ|quién]も[笠|かさ|sombrero de paja]を[買ってくれませんでした|かってくれませんでした|comprar]。\n[帰る|かえる|volver (a casa)][途中|とちゅう|a medio camino]、[おじいさん||anciano, abuelo]は[道|みち|camino]に六つのお[地蔵|じぞう|Jizō (estatua budista)]さんを[見つけました|みつけました|encontrar]。お[地蔵|じぞう|Jizō (estatua budista)]さんの[頭|あたま|cabeza]に[雪|ゆき|nieve]が[積もっていました|つもっていました|acumularse]。「[寒いでしょう|さむいでしょう|frío (clima)]。[これ||esto]を[かぶってください||ponerse (en la cabeza)]。」[おじいさん||anciano, abuelo]は[笠|かさ|sombrero de paja]を五つ[かぶせました||poner (en la cabeza de otro)]。一つ[足りなかった|たりなかった|ser suficiente]ので、[自分|じぶん|uno mismo]の[手ぬぐい|てぬぐい|toalla de mano]を[最後|さいご|último]のお[地蔵|じぞう|Jizō (estatua budista)]さんに[かぶせました||poner (en la cabeza de otro)]。\n[家|いえ|casa]に[帰って|かえって|volver (a casa)]、[おじいさん||anciano, abuelo]は[おばあさん||anciana, abuela]に[話しました|はなしました|hablar]。[おばあさん||anciana, abuela]は[怒らないで|おこらないで|enfadarse]、「[いい||bueno][こと||cosa, hecho]を[しました||hacer]ね」と[言いました|いいました|decir]。\n[その||ese][夜|よる|noche]、[外|そと|fuera]で[大きな|おおきな|grande][音|おと|sonido]が[しました||hacer]。[二人|ふたり|dos personas]が[戸|と|puerta]を[開ける|あける|abrir (algo)]と、お[米|こめ|arroz (crudo)]やお[餅|もち|mochi]や[魚|さかな|pez]が[たくさん||mucho][置いてありました|おいてありました|poner, dejar]。[雪|ゆき|nieve]の[中|なか|dentro]を、[笠|かさ|sombrero de paja]を[かぶった||ponerse (en la cabeza)]お[地蔵|じぞう|Jizō (estatua budista)]さんたちが[帰っていく|かえっていく|volver (a casa)]のが[見えました|みえました|verse]。", "es": "Hace mucho vivían un anciano y una anciana muy pobres. Aunque se acercaba el Año Nuevo, no tenían dinero para comprar mochi. El anciano hizo cinco sombreros de paja y fue a venderlos al pueblo. Pero era un día de nieve y nadie se los compró. De vuelta, encontró en el camino seis estatuas de Jizō. Tenían nieve acumulada en la cabeza. «Tendréis frío. Poneos esto». Les puso los cinco sombreros. Como faltaba uno, le puso su propia toall [もう||ya][ここ||aquí]には[いられません||estar, haber (seres)]。」[鶴|つる|grulla]は[空|そら|cielo]へ[飛んでいきました|とんでいきました|volar]。[男|おとこ|hombre]は[約束|やくそく|promesa]を[守らなかった|まもらなかった|cumplir, proteger][こと||cosa, hecho]を、[いつ||cuándo]までも[後悔|こうかい|arrepentimiento][しました||hacer]。", "es": "Hace mucho, en una aldea, vivía solo un hombre joven. Un frío día de invierno encontró una grulla atrapada en una trampa y la liberó. Esa noche, una mujer hermosa llegó a su casa: «Me he perdido. ¿Podría alojarme?». Pronto se casaron. La esposa dijo: «Mientras tejo, no mires nunca en la habitación». La tela que tejía era bellísima y se vendía cara. El hombre se fue haciendo rico. Pero la esposa adelgazaba cada vez que tejía. El hombre, preocupado, rompió la promesa y miró. En la habitación había una grulla: se arrancaba sus propias plumas para tejer la tela. «Ahora que me has visto, ya no puedo quedarme aquí». La grulla voló hacia el cielo. El hombre se arrepintió para siempre de no haber cumplido la promesa.", "g": [], "q": [{"q": "男は冬の日に何をしましたか。", "o": ["鶴を売りました", "罠にかかった鶴を助けました", "布を織りました", "女の人と結婚しました"], "a": 1}, {"q": "妻は男に何を頼みましたか。", "o": ["布を売らないこと", "部屋を見ないこと", "お金持ちになること", "鶴を助けること"], "a": 1}, {"q": "鶴は何で布を織っていましたか。", "o": ["糸", "雪", "自分の羽", "男の服"], "a": 2}]}, {"id": "t5", "lv": 6, "title": "花咲かじいさん", "sub": "El anciano que hacía florecer los árboles (N4)", "t": "[昔|むかし|antiguamente]、[正直|しょうじき|honrado]な[おじいさん||anciano, abuelo]と、[隣|となり|al lado, vecino]に[欲張り|よくばり|codicioso]な[おじいさん||anciano, abuelo]が[住んでいました|すんでいました|vivir (residir)]。[正直|しょうじき|honrado]な[おじいさん||anciano, abuelo]は[白い|しろい|blanco][犬|いぬ|perro]を[飼っていて|かっていて|criar (animal)]、[とても||muy][かわい||mono, adorable]がって[い||estar, haber (seres)]ました。\n[ある||haber, existir][日|ひ|día]、[犬|いぬ|perro]が[畑|はたけ|campo de cultivo]で「[ここ||aquí][掘れ|ほれ|cavar]、[ワンワン|わんわん|guau guau]」と[鳴きました|なきました|ladrar, cantar (animal)]。[おじいさん||anciano, abuelo]が[そこ||ahí]を[掘る|ほる|cavar]と、[金貨|きんか|moneda de oro]が[たくさん||mucho][出てきました|でてきました|salir]。\n[隣|となり|al lado, vecino]の[おじいさん||anciano, abuelo]は[それ||es ]。\n[女の子|おんなのこ|niña]は三[か月|かげつ|meses]で[美しい|うつくしい|hermoso][娘|むすめ|hija]に[なりました||volverse, llegar a ser]。[二人|ふたり|dos personas]は「[かぐや姫|かぐやひめ|princesa Kaguya]」と[名づけました|なづけました|poner nombre]。[その||ese][後|ご|después]、[おじいさん||anciano, abuelo]が[竹|たけ|bambú]を[切る|きる|cortar]と、[中|なか|dentro]から[金|かね|oro]が[出てくる|でてくる|salir][よう||como, parece]に[なり||volverse, llegar a ser]、[家|いえ|casa]は[豊か|ゆたか|rico, próspero]に[なりました||volverse, llegar a ser]。\n[かぐや姫|かぐやひめ|princesa Kaguya]の[美し|うつくし|hermoso]さは[国|くに|país]中に[知られて|しられて|saber]、五人の[貴族|きぞく|noble]が[結婚|けっこん|casarse]を[申し込みました|もうしこみました|solicitar]。[かぐや姫|かぐやひめ|princesa Kaguya]は[一人一人|ひとりひとり|uno por uno]に、[誰|だれ|quién]も[持っていない|もっていない|tener][宝物|たからもの|tesoro]を[持ってくる|もってくる|tener][よう||como, parece]に[言いました|いいました|decir]。[しかし||sin embargo]、[誰|だれ|quién]も[本物|ほんもの|auténtico]を[持ってくる|もってくる|tener][こと||cosa, hecho]が[できませんでした||poder; hacerse]。\n[やがて||al poco tiempo]、[かぐや姫|かぐやひめ|princesa Kaguya]は[月|つき|luna]を[見て|みて|ver][泣く|なく|llorar][よう||como, parece]に[なりました||volverse, llegar a ser]。「[私|わたくし|yo]は[月|つき|luna]の[都|と|capital]の[人間|にんげん|ser humano]です。[十五夜|じゅうごや|noche de luna llena]に[迎え|むかえ|recibimiento, quien viene a buscar]が[来ます|きます|venir]。」\n[十五夜|じゅうごや|noche de luna llena]の[夜|よる|noche]、[月|つき|luna]から[光|ひかり|luz]と[とも||junto con]に[使い|つかい|mensajero]が[降りてきました|おりてきました|bajarse (de un vehículo)]。[かぐや姫|かぐやひめ|princesa Kaguya]は[おじいさん||anciano, abuelo]と[おばあさん||anciana, abuela]に[手紙|てがみ|carta]を[残して|のこして|dejar]、[月|つき|luna]へ[帰っていきました|かえっていきました|volver (a casa)]。[二人|ふたり|dos personas]は[いつ||cuándo]までも[月|つき|luna]を[見上げていました|みあげていました|mirar hacia arriba]。", "es": "Hace mucho vivía un anciano que se ganaba la vida cortando bambú. Un día encontró un bambú que brillaba y, al cortarlo, dentro había una niña diminuta. La llevó a casa y la crió junto a su esposa. En tres meses se convirtió en una joven hermosa. La llamaron princesa Kaguya. Desde entonces, cada vez que el anciano cortaba bambú salía oro, y la casa se volvió rica. Su belleza se conoció en todo el país y cinco nobles pidieron su mano. Kaguya pidió a cada uno un tesoro que nadie tenía. Pero ninguno pudo traer uno auténtico. Con el tiempo, Kaguya empezó a llorar mirando la luna: «Soy de la capital de la luna. En la noche de luna llena vendrán a buscarme». Esa noche, con la luz de la luna, descendieron los mensajeros. Kaguya dejó una carta a los ancianos y volvió a la luna. Ellos siguieron mirando la luna para siempre.", "g": [], "q": [{"q": "おじいさんは女の子をどこで見つけましたか。", "o": ["山の中", "光る竹の中", "月の都", "川のそば"], "a": 1}, {"q": "かぐや姫は貴族たちに何を頼みましたか。", "o": ["金を持ってくること", "誰も持っていない宝物を持ってくること", "月へ行くこと", "竹を切ること"], "a": 1}, {"q": "かぐや姫はどうして泣いていましたか。", "o": ["結婚したくなかったから", "月に帰らなければならなかったから", "おじいさんが病気だったから", "宝物がなかったから"], "a": 1}]}, {"id": "t8", "lv": 9, "title": "さるかに合戦", "sub": "La batalla del mono y el cangrejo (N4)", "t": "[昔|むかし|antiguamente]、[蟹|かに|cangrejo]が[おにぎり||bola de arroz]を[持って|もって|tener][歩いている|あるいている|caminar]と、[猿|さる|mono]が[柿|かき|caqui]の[種|たね|semilla]を[持ってやって来ました|もってやってきました|tener]。[猿|さる|mono]は「[おにぎり||bola de arroz]と[柿|かき|caqui]の[種|たね|semilla]を[交換|こうかん|intercambio][しよう||hacer]。[種|しゅ|semilla]を[植えれ|うえれ|plantar]ば、[柿|かき|caqui]が[毎年|まいとし|cada año][食べられる|たべられる|comer]よ」と[言いました|いいました|decir]。[蟹|かに|cangrejo]は[交換|こうかん|intercambio][しました||hacer]。\n[蟹|かに|cangrejo]は[種|しゅ|semilla]を[植えて|うえて|plantar]、[毎日|まいにち|cada día][水|みず|agua]を[やりました||dar (a inferior); hacer]。[柿|かき|caqui]の[木|き|árbol]は[すぐ||enseguida]に[大きく|おおきく|grande][なって||volverse, llegar a ser]、[たくさん||mucho]の[実|じつ|fruto]が[なりました||volverse, llegar a ser]。でも、[蟹|かに|cangrejo]は[木|き|árbol]に[登る|のぼる|trepar, subir][こと||cosa, hecho]が[できません||poder; hacerse]。\n[そこ||ahí]へ[猿|さる|mono]が[来て|きて|venir]、「[僕|ぼく|yo (masculino)]が[取ってあげよう|とってあげよう|tomar]」と[言って|いって|decir][木|き|árbol]に[登りました|のぼりました|trepar, subir]。[猿|さる|mono]は[熟した|じゅくした|madurar][柿|かき|caqui]を[自分|じぶん|uno mismo]だけで[食べて|たべて|comer]、[蟹|かに|cangrejo]には[青くて|あおくて|azul][固い|かたい|duro][柿|かき|caqui]を[投げつけました|なげつけました|arrojar contra]。[蟹|かに|cangrejo]は大[けが||herida]を[しました||hacer]。\n[蟹|かに|cangrejo]の[子どもたち|こどもたち|niños]は[怒って|おこって|enfadarse]、[栗|くり|castaña]と[蜂|はち|abeja]と[臼|うす|mortero]と[牛|うし|vaca]の[糞|ふん|excremento]に[相談|そうだん|consultar][しました||hacer]。[みんな||todos]で[猿|さる|mono]の[家|いえ|casa]に[行き|いき|ir]、[猿|さる|mono]が[帰ってくる|かえってくる|volver (a casa)]のを[待ちました|まちました|esperar]。\n[猿|さる|mono]が[囲炉裏|いろり|hogar (fuego en el suelo)]に[座る|すわる|sentarse]と、[栗|くり|castaña]が[はじけて||estallar][猿|さる|mono]の[顔|かお|cara]に[当たりました|あたりました|dar, golpear]。[水がめ|みずがめ|tinaja de agua]に[手|て|mano]を[入れる|いれる|meter]と、[蜂|はち|abeja]が[刺しました|さしました|picar, clavar]。[逃げよう|にげよう|huir]と[する||hacer]と、[牛|うし|vaca]の[糞|ふん|excremento]で[滑って|すべって|resbalar][転び|ころび|caerse]、[最後|さいご|último]に[臼|うす|mortero]が[上|うえ|arriba]から[落ちてきました|おちてきました|caer]。[猿|さる|mono]は[泣いて|ないて|llorar][謝りました|あやまりました|pedir perdón]。", "es": "Hace mucho, un cangrejo caminaba con una bola de arroz cuando llegó un mono con una semilla de caqui. El mono dijo: «Cambiemos: si plantas la semilla, podrás comer caquis cada año». El cangrejo aceptó. Plantó la semilla y la regó cada día. El árbol creció rápido y dio muchos frutos. Pero el cangrejo no podía trepar. Entonces llegó el mono: «Yo te los bajo», y subió. Se comió él solo los caquis maduros y le tiró al cangrejo los verdes y duros. El cangrejo quedó malherido. Sus hijos, furiosos, pidieron ayuda a una castaña, una abeja, un mortero y una boñiga de vaca. Fueron todos a casa del mono y esperaron. Cuando el mono se sentó junto al hogar, la castaña estalló y le dio en la cara. Al meter la mano en la tinaja, la abeja lo picó. Al intentar huir resbaló con la boñiga y, al final, el mortero le cayó encima. El mono pidió perdón llorando.", "g": [], "q": [{"q": "猿は蟹に何を渡しましたか。", "o": ["おにぎり", "柿の実", "柿の種", "栗"], "a": 2}, {"q": "猿は蟹に何を投げましたか。", "o": ["熟した柿", "青くて固い柿", "種", "栗"], "a": 1}, {"q": "蟹の子どもたちは誰と一緒に猿の家へ行きましたか。", "o": ["蟹の友だち", "栗、蜂、臼、牛の糞", "猿の家族", "村の人たち"], "a": 1}]}, {"id": "t9", "lv": 11, "title": "舌切り雀", "sub": "El gorrión de la lengua cortada (N4+)", "t": "[昔|むかし|antiguamente]、[やさしい||amable][おじいさん||anciano, abuelo]が一羽の[雀|すずめ|gorrión]を[かわい||mono, adorable]がって[い||estar, haber (seres)]ました。[ところ||l  colada, le cortó la lengua y lo echó. El anciano, preocupado, salió a buscarlo. En la montaña encontró la posada de los gorriones, que lo recibieron contentos y lo agasajaron con banquete y bailes. Al despedirse, el gorrión sacó un cesto grande y uno pequeño: «Elija el que prefiera». El anciano dijo: «Soy viejo, mejor el ligero», y eligió el pequeño. Al abrirlo en casa, estaba lleno de oro y tesoros. La anciana, al verlo, fue también a la posada y sin dudar tomó el cesto grande. De vuelta, cargando el pesado cesto, no aguantó y lo abrió: salieron fantasmas y serpientes y se cayó del susto. Es una historia sobre cómo la codicia acaba saliendo cara.", "g": [], "q": [{"q": "おばあさんはどうして雀の舌を切りましたか。", "o": ["雀がうるさかったから", "雀が洗濯のりを食べたから", "おじいさんが頼んだから", "雀が逃げたから"], "a": 1}, {"q": "おじいさんはどうして小さいつづらを選びましたか。", "o": ["中に宝物があると知っていたから", "年寄りで軽いほうがよかったから", "雀に言われたから", "大きいつづらが汚かったから"], "a": 1}, {"q": "この話が伝えたいことは何ですか。", "o": ["雀は大切にしなければならない", "年寄りは山に行ってはいけない", "欲張ると損をする", "つづらは小さいほうがいい"], "a": 2}]}, {"id": "t10", "lv": 13, "title": "ごんぎつね（やさしい版）", "sub": "Gon, el zorrito (adaptación del cuento de Niimi Nankichi, N4+)", "t": "[ごん||Gon (nombre)]は、[山|やま|montaña]の[中|なか|dentro]に[一人|ひとり|una persona]で[住んでいる|すんでいる|vivir (residir)][小さな|ちいさな|pequeño][きつね||zorro]でした。[いたずら||travesura]が[大好き|だいすき|encantar]で、[村|むら|aldea]に[下りて|おりて|bajar]は[畑|はたけ|campo de cultivo]の[芋|いも|batata, tubérculo]を[掘っ|ほっ|cavar]たり、[干してある|ほしてある|poner a secar][唐辛子|とうがらし|guindilla]を[取っ|とっ|tomar]たり[していました||hacer]。\n[ある||haber, existir][日|ひ|día]、[ごん||Gon (nombre)]は[兵十|へいじゅう|Hyōjū (nombre)]と[いう||decir, llamarse][男|おとこ|hombre]が[川|かわ|río]で[魚|さかな|pez]を[取っている|とっている|tomar]のを[見ました|みました|ver]。[兵十|へいじゅう|Hyōjū (nombre)]が[目|め|ojo]を[離した|はなした|apartar][すき||descuido, momento]に、[ごん||Gon (nombre)]は[いたずら||travesura]で[魚|さかな|pez]を[みんな||todos][川|かわ|río]に[投げ込み|なげこみ|tirar dentro]、[うなぎ||anguila]を一匹[くわえて||llevar en la boca][逃げました|にげました|huir]。\n十日ほど[たって||pasar (tiempo)]、[ごん||Gon (nombre)]は[村|むら|aldea]で[兵十|へいじゅう|Hyōjū (nombre)]の[母親|ははおや|madre]の[葬式|そうしき|fu na]を[飲んでいる|のんでいる|beber][人|ひと|persona]は、[医者|いしゃ|médico]に[言ってください|いってください|decir]。[当日|とうじつ|ese día]は[保険証|ほけんしょう|tarjeta del seguro]を[持ってきてください|もってきてください|tener]。[検査|けんさ|prueba médica]は一[時間|じかん|tiempo]ぐらい[かかります||quedar atrapado; tardar]。[終わったら|おわったら|terminar]、[すぐ||enseguida]に[帰る|かえる|volver (a casa)][こと||cosa, hecho]が[できます||poder; hacerse]。[予約|よやく|reserva, cita]を[変えたい|かえたい|cambiar (algo)][時|とき|cuando]は、[電話|でんわ|teléfono]で[連絡|れんらく|contacto, aviso][してください||hacer]。\n[さくら||Sakura][病院|びょういん|hospital]", "es": "Sr./Sra. Yamada: El viernes de la semana que viene, 10 de octubre, a las diez de la mañana, tiene cita para una prueba. Desde las nueve de la noche del día anterior no coma nada. Puede beber agua. Si toma medicación, dígaselo al médico. Ese día traiga la tarjeta del seguro. La prueba dura alrededor de una hora. Cuando termine, puede irse enseguida. Si quiere cambiar la cita, avise por teléfono. Hospital Sakura", "g": [], "q": [{"q": "検査は何曜日ですか。", "o": ["月曜日", "金曜日", "日曜日", "分かりません"], "a": 1}, {"q": "検査の前の日の夜九時から、何をしてはいけませんか。", "o": ["水を飲むこと", "食べること", "寝ること", "電話すること"], "a": 1}, {"q": "当日、何を持っていきますか。", "o": ["薬", "水", "保険証", "手紙"], "a": 2}]}, {"id": "m06", "lv": 4, "title": "音楽と私", "sub": "La música y yo (N4)", "t": "[私|わたくし|yo]は[音楽|おんがく|música]が[大好き|だいすき|encantar]です。[特に|とくに|especialmente][ピアノ|ぴあの|piano]の[音|おと|sonido]が[好き|すき|gustar]です。[子ども|こども|niño]の[時|とき|cuando]、[母|はは|madre (propia)]が[ピアノ|ぴあの|piano]を[教えてくれました|おしえてくれました|enseñar]。[毎日|まいにち|cada día]三[十分|じゅうぶん|diez minutos][練習|れんしゅう|práctica][しました||hacer]が、[あまり||no mucho][上手|じょうず|hábil]に[なりませんでした||volverse, llegar a ser]。[今|いま|ahora]は[ピアノ|ぴあの|piano]を[弾きません|ひきません|tocar (instrumento)]。でも、[聞く|きく|oír]のは[今|いま|ahora]も[好き|すき|gustar]です。[仕事|しごと|trabajo]が[終わって|おわって|terminar][家|いえ|casa]に[帰る|かえる|volver (a casa)]と、[まず||primero][音楽|おんがく|música]を[かけます||poner (música); llamar]。[暗い|くらい|oscuro][部屋|へや|habitación]で[静か|しずか|tranquilo]な[曲|きょく|pieza musical]を[聞く|きく|oír]と、一[日|にち|día]の[疲れ|つかれ|cansancio]が[消えます|きえます|desaparecer]。[週末|しゅうまつ|fin de semana]には[時々|ときどき|a veces][コンサート|こんさーと|concierto]に[行きます|いきます|ir]。[映画館|えいがかん|cine]の[よう||como, parece]に[大きい|おおきい|grande][音|おと|sonido]では[なく||no haber]、[小さい|ちいさい|pequeño][ホール|ほーる|sala (de conciertos)]の[音|おと|sonido]が[いい||bueno]です。", "es": "Me encanta la música. Sobre todo el sonido del piano. De niño, mi madre me enseñó a tocarlo. Practicaba treinta minutos al día, pero no mejoré mucho. Ahora no toco. Pero escuchar sigue gustándome. Al llegar a casa del trabajo, lo primero es poner música. Escuchar una pieza tranquila en la habitación a oscuras borra el cansancio del día. Los fines de semana a veces voy a conciertos. No el sonido enorme de un cine, sino el de una sala pequeña.", "g": [], "q": [{"q": "この人は今、ピアノを弾きますか。", "o": ["毎日弾きます", "週末だけ弾きます", "弾きません", "コンサートで弾きます"], "a": 2}, {"q": "家に帰って、まず何をしますか。", "o": ["ピアノを練習します", "音楽をかけます", "映画を見ます", "寝ます"], "a": 1}, {"q": "この人はどんな音が好きですか。", "o": ["映画館の大きい音", "小さいホールの音", "暗い部屋の音", "ピアノの音だけ"], "a": 1}]}, {"id": "m07", "lv": 5, "title": "図書館の使い方", "sub": "Cómo usar la biblioteca (aviso, N4)", "t": "[市|し|ciudad, municipio]の[図書館|としょかん|biblioteca]は[月曜日|げつようび|lunes][以外|いがい|excepto]、[毎日|まいにち|cada día][開いています|ひらいています|abrirse]。[時間|じかん|tiempo]は[朝|あさ|mañana][九時|くじ|hora]から[夜|よる|noche][八時|はちじ|hora]までです。[本|ほん|libro]を[借りる|かりる|pedir prestado][時|とき|cuando]は、[カード|かーど|tarjeta]が[必要|ひつよう|necesario]です。[カード|かーど|tarjeta]は一[階|かい|planta, piso]の[受付|うけつけ|recepción]で[作る|つくる|hacer][こと||cosa, hecho]が[できます||poder; hacerse]。[住所|じゅうしょ|dirección (domicilio)]が[分かる|わかる|entender][物|もの|cosa]を[持ってきてください|もってきてください|tener]。[一度|いちど|una vez; de golpe]に十冊まで、二[週間|しゅうかん|semanas][借りる|かりる|pedir prestado][こと||cosa, hecho]が[できます||poder; hacerse]。[返す|かえす|devolver][日|ひ|día]を[過ぎる|すぎる|pasar (fecha)]と、[新しい|あたらしい|nuevo][本|ほん|libro]が[借りられなく|かりられなく|pedir prestado][なります||volverse, llegar a ser]から、[注意|ちゅうい|atención][してください||hacer]。[図書館|としょかん|biblioteca]の[中|なか|dentro]では、[電話|でんわ|teléfono]で[話さないでください|はなさないでください|hablar]。[飲み物|のみもの|bebida]は、[ふた||tapa]が[ある||haber, existir][物|もの|cosa]だけ[大丈夫|だいじょうぶ|estar  [{"q": "ご飯を入れた後、どうしますか。", "o": ["すぐ閉めます", "少し冷まします", "卵を入れます", "温めます"], "a": 1}, {"q": "卵焼きには何を入れますか。", "o": ["砂糖と塩", "トマト", "ご飯", "晩ご飯の残り"], "a": 0}, {"q": "トマトやブロッコリーを入れるのはどうしてですか。", "o": ["安いから", "色がきれいになるから", "熱いから", "残っているから"], "a": 1}]}, {"id": "m13", "lv": 9, "title": "祖父の畑", "sub": "El huerto de mi abuelo (N4)", "t": "[祖父|そふ|abuelo]は八十歳に[なります||volverse, llegar a ser]が、[今|いま|ahora]も[毎朝|まいあさ|cada mañana][畑|はたけ|campo de cultivo]に[出ています|でています|salir]。[畑|はたけ|campo de cultivo]では[野菜|やさい|verdura]を[作っています|つくっています|hacer]。[春|はる|primavera]は[じゃがいも||patata]、[夏|なつ|verano]は[トマト|とまと|tomate]と[きゅうり||pepino]、[秋|あき|otoño]は[さつまいも||boniato]です。[私|わたくし|yo]が[子ども|こども|niño]の[時|とき|cuando]、[祖父|そふ|abuelo]は[よく||a menudo; bien][畑|はたけ|campo de cultivo]に[連れて行ってくれました|つれていってくれました|llevar (a alguien)]。[土|つち|tierra]の[中|なか|dentro]から[野菜|やさい|verdura]を[掘り出す|ほりだす|desenterrar]のが、[まるで||como si][宝物|たからもの|tesoro]を[探すようで|さがすようで|buscar][楽しかったです|たのしかったです|divertido]。[祖父|そふ|abuelo]は「[野菜|やさい|verdura]は[正直|しょうじき|honrado]だ。[世話|せわ|cuidado]を[すれば||hacer][する||hacer]ほど、[おいしく||delicioso][なる||volverse, llegar a ser]」と[よく||a menudo; bien][言います|いいます|decir]。[最近|さいきん|últimamente]、[祖父|そふ|abuelo]は[少し|すこし|un poco][体|からだ|cuerpo]が[弱く|よわく|débil][なりました||volverse, llegar a ser]。だから[私|わたくし|yo]は、[週末|しゅうまつ|fin de semana]に[畑|はたけ|campo de cultivo]を[手伝い|てつだい|ayuda]に[行く|いく|ir][こと||cosa, hecho]に[しました||hacer]。[祖父|そふ|abuelo]が[教えてくれた|おしえてくれた|enseñar][こと||cosa, hecho]を、[今度|こんど|la próxima vez]は[私|わたくし|yo]が[続けたい|つづけたい|continuar]と[思います|おもいます|pensar]。", "es": "Mi abuelo cumple ochenta años, pero sigue saliendo al huerto cada mañana. Cultiva verduras: patatas en primavera, tomates y pepinos en verano, boniatos en otoño. De niño me llevaba a menudo al huerto. Desenterrar las verduras era como buscar un tesoro. Suele decir: «Las verduras son honestas: cuanto más las cuidas, más ricas salen». Últimamente está algo más débil. Por eso decidí ir a ayudarle los fines de semana. Lo que él me enseñó, ahora quiero continuarlo yo.", "g": [], "q": [{"q": "祖父は夏に何を作りますか。", "o": ["じゃがいも", "トマトときゅうり", "さつまいも", "米"], "a": 1}, {"q": "祖父がよく言うことは何ですか。", "o": ["野菜は高い", "野菜は世話をするほどおいしくなる", "畑は大変だ", "宝物がある"], "a": 1}, {"q": "この人はどうして週末に畑に行くことにしましたか。", "o": ["野菜が好きだから", "祖父が少し弱くなったから", "お金がもらえるから", "子どもの時のように遊びたいから"], "a": 1}]}, {"id": "m14", "lv": 10, "title": "引っ越しの日", "sub": "El día de la mudanza (N4)", "t": "[四月|しがつ|mes (fecha)]に[新しい|あたらしい|nuevo][町|まち|pueblo]に[引っ越しました|ひっこしました|mudarse]。[朝|あさ|mañana][八時|はちじ|hora]に[引っ越し|ひっこし|mudanza]の[会社|かいしゃ|empresa]の[人|ひと|persona]が三人[来て|きて|venir]、二[時間|じかん|tiempo]で[全部|ぜんぶ|todo]の[荷物|にもつ|equipaje, bultos]を[運んでくれました|はこんでくれました|transportar]。[思った|おもった|pensar]より[早くて|はやくて|temprano][驚きました|おどろきました|sorprenderse]。[新しい|あたらしい|nuevo][部屋|へや|habitación]は[前|まえ|delante]より[少し|すこし|un poco][狭いです|せまいです|estrecho, pequeño]が、[駅|えき|estación]に[近くて|ちかくて|cerca][便利|べんり|práctico]です。[窓|まど|ventana]から[小さな|ちいさな|pequeño][川|かわ|río]が[見えます|みえます|verse]。[午後|ごご|por la tarde (p. m.)]は[荷物|にもつ|equipaje, bultos]を[開けて|あけて|abrir (algo)]、[本|ほん|libro]や[服|ふく|ropa]を[片づけました|かたづけました|ordenar]。[夜|よる|noche]に[なって||volverse, llegar a ser]、[隣|となり|al lado, vecino]の[人|ひと|persona]に[あいさつ||saludo]に[行きました|いきました|ir]。[隣|となり|al lado, vecino]の[人|ひと|persona]は[年|とし|año]を[取った|とった|tomar][女|おんな|mujer]の[人|ひと|persona]で、「[困った|こまった|estar en apuros][こと||cosa, hecho]が[あったら||haber, existir]、[いつ||cuándo]でも[言って|いって|decir]ね」と[言ってくれました|いってくれました|decir]。[知らない|しらない|saber][町|まち|pueblo]で[少し|すこし|un poco][不安|ふあん|inquietud]でしたが、[その||ese][言葉|ことば|palabra]で[安心|あんしん|tranquilidad][しました||hacer]。", "es": "En abril me mudé a una ciudad nueva. A las ocho de la mañana vinieron tres personas de la empresa de mudanzas y en dos horas lo llevaron todo. Me sorprendió lo rápido. El piso nuevo es algo más pequeño que el anterior, pero está cerca de la estación y es práctico. Desde la ventana se ve un río pequeño. Por la tarde abrí las cajas y ordené libros y ropa. Por la noche fui a saludar a la vecina. Es una señora mayor y me dijo: «Si tienes algún problema, dímelo cuando quieras». En una ciudad desconocida |いれる|meter][こと||cosa, hecho]だと[気づいた|きづいた|darse cuenta]のです。[試験|しけん|examen]に[合格|ごうかく|aprobar][する||hacer][こと||cosa, hecho]も[大切|たいせつ|importante]ですが、[それ||eso]だけが[目的|もくてき|objetivo]では[ありません||haber, existir]。[知らなかった|しらなかった|saber][感じ|かんじ|sentir]方を、一つずつ[自分|じぶん|uno mismo]の[もの||cosa]に[していく||hacer]。[それ||eso]が、[私|わたくし|yo]が[勉強|べんきょう|estudio]を[続ける|つづける|continuar][理由|りゆう|razón]です。", "es": "Me preguntan a menudo por qué estudio japonés. La primera razón fue que quería disfrutar del anime y el manga en japonés. Pero a medida que seguía estudiando, la razón fue cambiando. El japonés tiene muchas palabras que el español no tiene. Por ejemplo, «komorebi» es la luz que se filtra entre las hojas de los árboles. Desde que conozco esa palabra, cuando paseo por el parque veo la luz de otra manera. Me di cuenta de que aprender un idioma es conseguir una nueva forma de ver el mundo. Aprobar el examen importa, pero no es el único objetivo. Hacer míos, uno a uno, modos de sentir que no conocía: por eso sigo estudiando.", "g": [], "q": [{"q": "この人が日本語を始めた最初の理由は何ですか。", "o": ["試験に合格するため", "日本で働くため", "アニメや漫画を日本語で楽しむため", "友だちを作るため"], "a": 2}, {"q": "「木漏れ日」とは何ですか。", "o": ["木の種類", "木の葉の間から差す光", "公園の名前", "日本語の試験"], "a": 1}, {"q": "この人が勉強を続ける理由は何ですか。", "o": ["試験だけが目的だから", "新しい感じ方を自分のものにしたいから", "漫画がたくさんあるから", "スペイン語が難しいから"], "a": 1}]}];

 {j:"風邪を治したいなら、ゆっくり[休むことだ]。",s:"Si quieres curarte el resfriado, lo que tienes que hacer es descansar.",h:"休む"},
 {j:"上手になりたければ、毎日[練習することです]。",s:"Si quieres mejorar, la clave es practicar cada día.",h:"練習する, cortés"},
 {j:"分からないときは[遠慮しないで聞くことだ]。",s:"Cuando no entiendas algo, hay que preguntar sin reparos.",h:"聞く"}]},
{id:"n3-koto-ka",lv:14,t:"〜ことか",s:"interrogativo + informal + ことか",bp:"ことか",e:"Exclamación de intensidad: «¡cuánto…!, ¡qué…!». Va con どんなに, 何度, どれほど y expresa un sentimiento fuerte sobre algo que el hablante ha vivido.",ex:[
 {j:"合格して、どんなに[うれしかったことか]。",s:"¡Cuánto me alegré al aprobar!",h:"うれしい, pasado"},
 {j:"この日を何年[待ったことか]。",s:"¡Cuántos años he esperado este día!",h:"待つ, pasado"},
 {j:"一人暮らしがどれほど[大変なことか]、やってみて分かった。",s:"Al probarlo entendí lo duro que es vivir solo.",h:"大変 + な"}]},
{id:"n3-koto-kara",lv:14,t:"〜ことから",s:"informal + ことから (N・な-adj + な/である + ことから)",bp:"ことから",e:"Indica la razón o el origen de un hecho, un nombre o un juicio: «debido a que, por el hecho de que». Muy habitual para explicar nombres y conclusiones.",ex:[
 {j:"窓が[開いていることから]、誰かが入ったと分かった。",s:"Por el hecho de que la ventana estaba abierta, se supo que alguien había entrado.",h:"開く + ている"},
 {j:"この町は[桜が多いことから]、「桜町」と呼ばれている。",s:"A este pueblo lo llaman Sakuramachi porque tiene muchos cerezos.",h:"多い"},
 {j:"[成績がいいことから]、彼は先生に信頼されている。",s:"Como tiene buenas notas, el profesor confía en él.",h:"いい"}]},
{id:"n3-koto-ni",lv:14,t:"〜ことに",s:"adj-い・adj-な (な)・V-た + ことに",bp:"ことに",e:"Introduce el sentimiento del hablante ante lo que va a decir: «para mi sorpresa, por desgracia, afortunadamente». Va con 驚いた, 残念な, うれしい, 困った.",ex:[
 {j:"[驚いたことに]、彼は一度も日本に行ったことがなかった。",s:"Para mi sorpresa, él nunca había estado en Japón.",h:"驚く, pasado"},
 {j:"[残念なことに]、試合は雨で中止になった。",s:"Por desgracia, el partido se canceló por la lluvia.",h:"残念 + な"},
 {j:"[うれしいことに]、全員が合格した。",s:"Afortunadamente, aprobaron todos.",h:"うれしい"}]},
{id:"n3-koto-ni-shiteiru",lv:14,t:"〜ことにしている",s:"V-る・V-ない + ことにしている",bp:"ことにしている",e:"Hábito que uno se ha impuesto por decisión propia: «tengo por norma, me he propuesto». Diferente de ことになっている, que es una norma externa.",ex:[
 {j:"毎朝三十分[走ることにしています]。",s:"Me he propuesto correr treinta minutos cada mañana.",h:"走る"},
 {j:"夜はコーヒーを[飲まないことにしている]。",s:"Tengo por norma no tomar café por la noche.",h:"飲む, negativo"},
 {j:"週末は仕事のメールを[見ないことにしている]。",s:"Los fines de semana me he propuesto no mirar el correo del trabajo.",h:"見る, negativo"}]},
// ---- nivel 15 ----
{id:"n3-mono-da",lv:15,t:"〜ものだ",s:"V-る・adj + ものだ / V-た + ものだ",bp:"ものだ",e:"Tres usos: (1) verdad general o naturaleza de las cosas («así son las cosas»); (2) con V-た, recuerdo nostálgico («solía…»); (3) con V-る, lo que es propio o debido («se debe…»).",ex:[
 {j:"時間がたつのは[早いものだ]。",s:"Qué rápido pasa el tiempo (así es).",h:"早い"},
 {j:"子どものころ、よくこの川で[泳いだものだ]。",s:"De niño solía nadar en este río.",h:"泳ぐ, pasado"},
 {j:"目上の人には敬語を[使うものだ]。",s:"Con los superiores se debe usar keigo.",h:"使う"}]},
{id:"n3-mono-ka",lv:15,t:"〜ものか",s:"V-る・adj + ものか (もんか)",bp:"ものか",e:"Negación rotunda con emoción: «¡ni hablar!, ¡de ninguna manera!». Coloquial: もんか. Expresa rechazo o determinación.",ex:[
 {j:"あんな店、二度と[行くものか]。",s:"A esa tienda no vuelvo ni loco.",h:"行く"},
 {j:"こんなところで[あきらめるもんか]。",s:"¡Ni hablar de rendirme ahora!",h:"あきらめる, coloquial"},
 {j:"彼の言うことなんて[信じるものか]。",s:"¿Creer lo que dice él? Jamás.",h:"信じる"}]},
{id:"n3-mono-no",lv:15,t:"〜ものの",s:"informal + ものの (な-adj + な/である + ものの)",bp:"ものの",e:"«Aunque, si bien»: se admite A, pero el resultado B no es el esperado. Registro algo formal.",ex:[
 {j:"大学は[卒業したものの]、仕事が見つからない。",s:"Aunque terminé la universidad, no encuentro trabajo.",h:"卒業する, pasado"},
 {j:"日本語は[話せるものの]、漢字はまだ苦手だ。",s:"Si bien sé hablar japonés, los kanji aún se me resisten.",h:"話せる"},
 {j:"[安いものの]、品質はあまりよくない。",s:"Aunque es barato, la calidad no es muy buena.",h:"安い"}]},
{id:"n3-mono-dakara",lv:15,t:"〜ものだから",s:"informal + ものだから (N・な-adj + な + ものだから)",bp:"ものだから",e:"Da una razón a modo de excusa, con tono de justificación: «es que…». Coloquial: もんだから.",ex:[
 {j:"電車が[遅れたものだから]、遅刻してしまいました。",s:"Es que el tren se retrasó, y por eso llegué tarde.",h:"遅れる, pasado"},
 {j:"[急いでいたものだから]、財布を忘れた。",s:"Como iba con prisa, me dejé la cartera.",h:"急ぐ + ている, pasado"},
 {j:"あまりに[おいしかったもんだから]、全部食べてしまった。",s:"Es que estaba tan rico que me lo comí todo.",h:"おいしい, pasado, coloquial"}]},
{id:"n3-mono-reason",lv:15,t:"〜もの / 〜もん (razón)",s:"informal + もの / もん",bp:"もの (because)",e:"Al final de la frase, justifica algo con tono infantil o íntimo: «es que…». Muy coloquial; típico de niños y conversación cercana.",ex:[
 {j:"行きたくない。だって、[寒いんだもん]。",s:"No quiero ir. Es que hace frío.",h:"寒い + んだ + もん"},
 {j:"だって、[知らなかったんだもの]。",s:"¡Es que no lo sabía!",h:"知る, pasado negativo + んだ + もの"},
 {j:"食べられないよ。[嫌いなんだもん]。",s:"No puedo comérmelo. Es que no me gusta.",h:"嫌い + なんだ + もん"}]},
{id:"n3-wake-ga-nai",lv:15,t:"〜わけがない",s:"informal + わけがない (N・な-adj + な/の + わけがない)",bp:"わけがない",e:"«Es imposible que, no puede ser que». Negación basada en la lógica: el hablante está seguro de que algo no puede ocurrir.",ex:[
 {j:"あんなに練習した彼が[負けるわけがない]。",s:"Es imposible que él pierda, con lo que ha entrenado.",h:"負ける"},
 {j:"こんな難しい問題、子どもに[解けるわけがない]。",s:"Un problema tan difícil no puede resolverlo un niño.",h:"解ける"},
 {j:"そんな[安いわけがない]。何か裏があるよ。",s:"No puede ser tan barato. Algo esconde.",h:"安い"}]},
{id:"n3-wake-ni-wa-ikanai",lv:15,t:"〜わけにはいかない",s:"V-る + わけにはいかない / V-ない + わけにはいかない",bp:"わけにはいかない",e:"«No puedo permitirme, no es aceptable (por una razón social o moral)». Con V-ない: «no me queda más remedio que».",ex:[
 {j:"大事な会議だから、[休むわけにはいかない]。",s:"Es una reunión importante; no puedo faltar.",h:"休む"},
 {j:"約束したので、[行かないわけにはいかない]。",s:"Como lo prometí, no me queda más remedio que ir.",h:"行く, negativo"},
 {j:"これは秘密だから、[話すわけにはいきません]。",s:"Es un secreto, así que no puedo contarlo.",h:"話す, cortés"}]},
// ---- nivel 16 ----
{id:"n3-bakari-ka",lv:16,t:"〜ばかりか",s:"informal・N + ばかりか + 〜も",bp:"ばかりか",e:"«No solo…, sino que además». Añade algo de mayor grado, a menudo negativo. Más formal que だけでなく.",ex:[
 {j:"彼は[遅刻したばかりか]、宿題も忘れてきた。",s:"No solo llegó tarde, sino que además olvidó los deberes.",h:"遅刻する, pasado"},
 {j:"この店は[安いばかりか]、味もいい。",s:"Esta tienda no solo es barata; además la comida es buena.",h:"安い"},
 {j:"[雨ばかりか]、風も強くなってきた。",s:"No solo llueve: también se ha levantado viento.",h:"雨 (N)"}]},
{id:"n3-bakari-ni",lv:16,t:"〜ばかりに",s:"informal (V-た・adj) + ばかりに",bp:"ばかりに",e:"«Solo por…, precisamente por…» seguido de un resultado negativo. Expresa arrepentimiento por una causa pequeña que trajo una mala consecuencia.",ex:[
 {j:"一言[言ったばかりに]、彼女を怒らせてしまった。",s:"Solo por decir una palabra, la hice enfadar.",h:"言う, pasado"},
 {j:"[寝坊したばかりに]、試験を受けられなかった。",s:"Por el simple hecho de dormirme, no pude hacer el examen.",h:"寝坊する, pasado"},
 {j:"[安かったばかりに]、すぐ壊れてしまった。",s:"Precisamente por ser barato, se rompió enseguida.",h:"安い, pasado"}]},
{id:"n3-ta-totan",lv:16,t:"〜たとたん（に）",s:"V-た + とたん（に）",bp:"たとたん",e:"«En cuanto, justo al…»: algo ocurre inmediatamente después de otra acción, de forma inesperada. Lo que sigue no es una acción voluntaria del hablante.",ex:[
 {j:"ドアを[開けたとたん]、猫が飛び出してきた。",s:"En cuanto abrí la puerta, el gato salió disparado.",h:"開ける, pasado"},
 {j:"[立ち上がったとたんに]、めまいがした。",s:"Justo al levantarme, me mareé.",h:"立ち上がる, pasado"},
 {j:"その話を[聞いたとたん]、彼は泣き出した。",s:"Nada más oír eso, él rompió a llorar.",h:"聞く, pasado"}]},
{id:"n3-tabi-ni",lv:16,t:"〜たびに",s:"V-る + たびに / N + の + たびに",bp:"たびに",e:"«Cada vez que». Cada repetición de A trae B.",ex:[
 {j:"この歌を[聞くたびに]、学生時代を思い出す。",s:"Cada vez que oigo esta canción, recuerdo mi época de estudiante.",h:"聞く"},
 {j:"[旅行のたびに]、お土産を買ってくる。",s:"Cada vez que viajo, traigo un recuerdo.",h:"旅行 + の"},
 {j:"彼に[会うたびに]、元気をもらう。",s:"Cada vez que lo veo, me da energía.",h:"会う"}]},
{id:"n3-tsuide-ni",lv:16,t:"〜ついでに",s:"V-る・V-た + ついでに / N + の + ついでに",bp:"ついでに",e:"«Aprovechando que, de paso». Se hace B aprovechando la ocasión de A, que es lo principal.",ex:[
 {j:"[買い物のついでに]、郵便局に寄った。",s:"Aprovechando que iba de compras, pasé por correos.",h:"買い物 + の"},
 {j:"東京に[行ったついでに]、昔の友だちに会った。",s:"Ya que fui a Tokio, vi a un viejo amigo.",h:"行く, pasado"},
 {j:"部屋を[掃除するついでに]、窓も拭いた。",s:"De paso que limpiaba la habitación, limpié también las ventanas.",h:"掃除する"}]},
{id:"n3-tsutsu",lv:16,t:"〜つつ / 〜つつある",s:"V-ます + つつ / V-ます + つつある",bp:"つつ",e:"つつ: «mientras» (formal, como ながら) o «aunque» (つつも). つつある: «está en proceso de», cambio en curso (escrito, formal).",ex:[
 {j:"景色を[楽しみつつ]、山道を歩いた。",s:"Caminé por el sendero disfrutando del paisaje.",h:"楽しむ"},
 {j:"悪いと[知りつつも]、うそをついてしまった。",s:"Aun sabiendo que estaba mal, mentí.",h:"知る + つつも"},
 {j:"日本の人口は[減りつつある]。",s:"La población de Japón está disminuyendo.",h:"減る + つつある"}]}
];
// Frases inéditas de examen para estos puntos
const EXAM_GRAMMAR_N3 = [
{g:"n3-koto-ni-natteiru",j:"このアパートではペットを[飼ってはいけないことになっている]。",s:"En este piso la norma es que no se pueden tener mascotas.",h:"飼う + てはいけない"},
{g:"n3-koto-wa-nai",j:"簡単な手続きだから、[心配することはない]。",s:"Es un trámite sencillo; no hay por qué preocuparse.",h:"心配する"},
{g:"n3-koto-da",j:"痩せたいなら、まず甘い物を[やめることだ]。",s:"Si quieres adelgazar, lo primero es dejar los dulces.",h:"やめる"},
{g:"n3-koto-ka",j:"母の料理をどれほど[恋しく思ったことか]。",s:"¡Cuánto eché de menos la comida de mi madre!",h:"恋しく思う, pasado"},
{g:"n3-koto-kara",j:"足跡が[残っていることから]、犯人は裏口から逃げたらしい。",s:"Por las huellas que quedan, parece que el culpable huyó por la puerta trasera.",h:"残る + ている"},
{g:"n3-koto-ni",j:"[困ったことに]、鍵をどこに置いたか思い出せない。",s:"Lo malo es que no recuerdo dónde dejé las llaves.",h:"困る, pasado"},
{g:"n3-koto-ni-shiteiru",j:"健康のために、エレベーターを[使わないことにしている]。",s:"Por salud, tengo por norma no usar el ascensor.",h:"使う, negativo"},
{g:"n3-mono-da",j:"若いころは、徹夜しても[平気だったものだ]。",s:"De joven, aguantaba sin dormir sin problema (recuerdo).",h:"平気 + だった"},
{g:"n3-mono-ka",j:"あんなに失礼な人に[謝るものか]。",s:"¿Pedirle perdón a alguien tan maleducado? Ni hablar.",h:"謝る"},
{g:"n3-mono-no",j:"薬を[飲んだものの]、熱は下がらなかった。",s:"Aunque tomé la medicina, la fiebre no bajó.",h:"飲む, pasado"},
{g:"n3-mono-dakara",j:"[初めてだったものだから]、緊張して何も言えなかった。",s:"Es que era la primera vez, y de los nervios no pude decir nada.",h:"初めて + だった"},
{g:"n3-mono-reason",j:"もう帰る。[疲れたんだもん]。",s:"Me voy ya. Es que estoy cansado.",h:"疲れる, pasado + んだ + もん"},
{g:"n3-wake-ga-nai",j:"彼がそんなことを[言うわけがない]。",s:"Es imposible que él dijera algo así.",h:"言う"},
{g:"n3-wake-ni-wa-ikanai",j:"店長に頼まれたから、[断るわけにはいかない]。",s:"Me lo pidió el encargado; no puedo negarme.",h:"断る"},

{g:"n3-bakari-ni",j:"地図を[忘れたばかりに]、道に迷ってしまった。",s:"Solo por olvidar el mapa, me perdí.",h:"忘れる, pasado"},

{g:"n3-tabi-ni",j:"この写真を[見るたびに]、祖母を思い出す。",s:"Cada vez que veo esta foto, me acuerdo de mi abuela.",h:"見る"},

{g:"n3-tsutsu",j:"この町の人口は少しずつ[増えつつある]。",s:"La población de esta ciudad está aumentando poco a poco.",h:"増える + つつある"}
];
