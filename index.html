// Gramática N3, bloque 2 (20 puntos, niveles 17 a 19), escrita a mano.
GRAMMAR_N3.push(
// ---- nivel 17 ----
{id:"n3-bakari-de-naku",lv:17,t:"〜ばかりでなく〜も",s:"V・adj + ばかりでなく / N + ばかりでなく + も",bp:"ばかりでなく",e:"«No solo… sino también». Añade un segundo elemento a uno ya dado, y el segundo suele ser más llamativo o igual de importante. Muy cercano a だけでなく, algo más formal y enfático.",ex:[
 {j:"彼は[英語ばかりでなく]、中国語も話せる。",s:"No solo habla inglés, también habla chino.",h:"英語"},
 {j:"この店は[安いばかりでなく]、味もいい。",s:"Esta tienda no solo es barata, además la comida es buena.",h:"安い"},
 {j:"彼女は[頭がいいばかりでなく]、性格もいい。",s:"Ella no solo es lista, también tiene buen carácter.",h:"頭がいい"}]},
{id:"n3-tokoro-datta",lv:17,t:"〜ところだった",s:"V-る + ところだった",bp:"ところだった",e:"«Por poco, casi». Cuenta algo que estuvo a punto de pasar y al final no pasó, normalmente algo malo. Suele llevar もう少しで o 危うく.",ex:[
 {j:"もう少しで[電車に乗り遅れるところだった]。",s:"Por poco pierdo el tren.",h:"乗り遅れる"},
 {j:"危うく[車にひかれるところでした]。",s:"Por poco me atropella un coche.",h:"ひかれる, cortés"},
 {j:"大事な書類を[忘れるところだった]よ。",s:"¡Casi me olvido de los documentos importantes!",h:"忘れる"}]},
{id:"n3-tokoro-ni",lv:17,t:"〜ところに / ところへ",s:"V-る・V-ている・V-た + ところに",bp:"ところに",e:"«Justo cuando». Algo ocurre en el preciso momento en que otra cosa está pasando o va a pasar, a menudo interrumpiéndola. Con ところへ la idea de llegada es más marcada.",ex:[
 {j:"出かけようとした[ところに]、友だちが来た。",s:"Justo cuando iba a salir, llegó un amigo.",h:"ところに"},
 {j:"寝ようと思っていた[ところへ]、電話がかかってきた。",s:"Justo cuando pensaba acostarme, sonó el teléfono.",h:"ところへ"},
 {j:"みんなで[話していたところに]、先生が入ってきた。",s:"Mientras hablábamos todos, entró el profesor.",h:"話す + ている"}]},
{id:"n3-dokoro-ka",lv:17,t:"〜どころか",s:"V・adj・N + どころか",bp:"どころか",e:"«Lejos de, ni hablar de». Niega lo dicho y presenta algo más extremo o contrario. A menudo va seguido de も / さえ, y suele aparecer en frases negativas.",ex:[
 {j:"彼は[日本語どころか]、英語も話せない。",s:"Lejos de hablar japonés, ni siquiera habla inglés.",h:"日本語"},
 {j:"忙しくて[休むどころか]、食事をする時間もない。",s:"Estoy tan ocupado que ni descanso ni tengo tiempo de comer.",h:"休む"},
 {j:"今日は[暑いどころか]、寒いくらいだ。",s:"Hoy, lejos de hacer calor, hace casi frío.",h:"暑い"}]},
{id:"n3-toshite",lv:17,t:"〜として",s:"N + として",bp:"として",e:"«Como, en calidad de». Indica la función, el papel o el punto de vista desde el que se habla. Variantes: としては («como…, por lo que respecta a»), としても («aun como»).",ex:[
 {j:"彼は[留学生として]日本に来た。",s:"Vino a Japón como estudiante extranjero.",h:"留学生"},
 {j:"[趣味として]、写真を撮っている。",s:"Hago fotos como afición.",h:"趣味"},
 {j:"この町は[観光地として]有名だ。",s:"Esta ciudad es famosa como destino turístico.",h:"観光地"}]},
{id:"n3-to-tomo-ni",lv:17,t:"〜とともに",s:"N + とともに / V-る・adj + とともに",bp:"とともに",e:"Dos usos: (1) «junto con» una persona o cosa; (2) «a la vez que, a medida que», dos cambios que avanzan al mismo tiempo. Es más formal que と一緒に.",ex:[
 {j:"年を[取るとともに]、体力が落ちてきた。",s:"A medida que me hago mayor, me han ido faltando fuerzas.",h:"取る"},
 {j:"家族[とともに]、京都へ旅行した。",s:"Viajé a Kioto con mi familia.",h:"とともに"},
 {j:"技術の進歩[とともに]、生活は便利になった。",s:"Con el progreso de la tecnología, la vida se ha vuelto más cómoda.",h:"とともに"}]},
{id:"n3-toori",lv:17,t:"〜とおり / 〜どおり",s:"V-る・V-た + とおり / N + どおり",bp:"とおり",e:"«Tal como, conforme a». Hacer algo siguiendo lo dicho, lo escrito o lo esperado. Tras un verbo se escribe とおり (sin sonorizar); tras un sustantivo se usa どおり (予想どおり, 約束どおり).",ex:[
 {j:"先生が[言ったとおりに]やってみた。",s:"Lo intenté tal como dijo el profesor.",h:"言う, pasado"},
 {j:"予想[どおり]、試合は私たちが勝った。",s:"Tal como se esperaba, ganamos el partido.",h:"どおり"},
 {j:"説明書に[書いてあるとおり]にすれば大丈夫だ。",s:"Si lo haces tal como pone en las instrucciones, no habrá problema.",h:"書いてある"}]},
// ---- nivel 18 ----
{id:"n3-toka",lv:18,t:"〜とか〜とか",s:"N・V・adj + とか + N・V・adj + とか",bp:"とか",e:"Enumera ejemplos de forma coloquial y no exhaustiva: «cosas como X, Y…». Con una frase final, también sirve para transmitir un rumor: «dicen que, creo que dijeron que».",ex:[
 {j:"冷蔵庫に[牛乳とか]、卵とかが入っている。",s:"En la nevera hay cosas como leche, huevos…",h:"牛乳"},
 {j:"山田さんは[結婚するとか]。",s:"Dicen que Yamada se casa.",h:"結婚する"},
 {j:"休みの日は[映画を見るとか]、買い物に行くとかして過ごしている。",s:"Los días libres los paso viendo películas, yendo de compras…",h:"映画を見る"}]},
{id:"n3-to-shitara",lv:18,t:"〜としたら / 〜とすれば",s:"informal + としたら / とすれば",bp:"としたら",e:"«Suponiendo que, si fuera el caso de que». Plantea una hipótesis sobre algo que no se sabe si es verdad, y comenta sus consecuencias. とすれば es más formal y razonado.",ex:[
 {j:"もし[宝くじが当たったとしたら]、世界旅行に行く。",s:"Si me tocara la lotería, me iría de viaje por el mundo.",h:"当たる, pasado"},
 {j:"[行くとすれば]、来月がいい。",s:"Si hubiera que ir, el mes que viene sería lo mejor.",h:"行く"},
 {j:"[一人で住むとしたら]、駅の近くがいい。",s:"Si fuera a vivir solo, preferiría cerca de la estación.",h:"一人で住む"}]},
{id:"n3-to-ittemo",lv:18,t:"〜といっても",s:"informal + といっても",bp:"といっても",e:"«Aunque diga X, en realidad…». Matiza o corrige la impresión que da una afirmación: lo dicho es cierto, pero no tanto como parece. Después va lo que lo rebaja.",ex:[
 {j:"料理が[得意といっても]、簡単なものしか作れない。",s:"Aunque digo que se me da bien cocinar, solo hago cosas sencillas.",h:"得意"},
 {j:"[旅行に行ったといっても]、日帰りです。",s:"Aunque dije que viajé, fue solo una excursión de un día.",h:"行く, pasado"},
 {j:"日本語が[話せるといっても]、挨拶ができる程度です。",s:"Aunque hable japonés, es solo lo justo para saludar.",h:"話せる"}]},
{id:"n3-to-iu-yori",lv:18,t:"〜というより",s:"informal + というより",bp:"というより",e:"«Más que X, es Y». Reformula una descripción con otra más acertada: lo primero no es del todo falso, pero lo segundo lo describe mejor. Se cierra con una afirmación.",ex:[
 {j:"彼女は[優しいというより]、気が弱いのだ。",s:"Más que amable, es de carácter débil.",h:"優しい"},
 {j:"これは[ケーキというより]、パンに近い。",s:"Esto más que un pastel es casi un pan.",h:"ケーキ"},
 {j:"今日は[暑いというより]、蒸し暑い。",s:"Hoy más que calor, hace bochorno.",h:"暑い"}]},
{id:"n3-to-iu-to",lv:18,t:"〜というと",s:"N + というと",bp:"というと",e:"«Hablando de, cuando se dice X». Toma un tema y lo asocia con lo primero que viene a la mente, o pide aclarar a qué se refiere el otro. Variante coloquial: っていうと.",ex:[
 {j:"[日本の食べ物というと]、すぐ寿司を思い出す。",s:"Hablando de comida japonesa, enseguida pienso en el sushi.",h:"日本の食べ物"},
 {j:"[京都というと]、お寺ですね。",s:"Cuando se dice Kioto, uno piensa en templos.",h:"京都"},
 {j:"[夏というと]、花火を思い浮かべる。",s:"Si se dice verano, me viene a la cabeza los fuegos artificiales.",h:"夏"}]},
{id:"n3-to-itta",lv:18,t:"〜といった",s:"N + や + N + といった + N",bp:"といった",e:"«Como, tales como». Pone ejemplos representativos justo antes del sustantivo que los agrupa. Más escrito que のような, y casi siempre con や o と para listar.",ex:[
 {j:"[りんごやバナナといった]果物が好きだ。",s:"Me gustan las frutas como la manzana o el plátano.",h:"りんご + バナナ"},
 {j:"[東京や大阪といった]大都市は人が多い。",s:"Las grandes ciudades como Tokio y Osaka tienen mucha gente.",h:"東京 + 大阪"},
 {j:"[ギターやピアノといった]楽器を習いたい。",s:"Quiero aprender instrumentos como la guitarra o el piano.",h:"ギター + ピアノ"}]},
{id:"n3-ni-oite",lv:18,t:"〜において",s:"N + において / N + における + N",bp:"において",e:"«En, dentro de» un lugar, un momento o un ámbito. Equivale a で pero en registro formal o escrito. Con sustantivo después: における (社会における役割).",ex:[
 {j:"会議は第一会議室[において]行われる。",s:"La reunión se celebrará en la sala de reuniones uno.",h:"において"},
 {j:"現代社会[において]、情報は大変重要だ。",s:"En la sociedad actual, la información es muy importante.",h:"において"},
 {j:"日本の歴史[において]、この事件は大きな意味を持つ。",s:"En la historia de Japón, este suceso tiene un gran significado.",h:"において"}]},
// ---- nivel 19 ----
{id:"n3-ni-kanshite",lv:19,t:"〜に関して",s:"N + に関して / N + に関する + N",bp:"に関して",e:"«Sobre, en relación con, acerca de». Delimita el tema de lo que se habla o se hace. Más formal que について; con sustantivo después: に関する.",ex:[
 {j:"この問題[に関して]、意見を聞かせてください。",s:"Dígame su opinión sobre este problema.",h:"に関して"},
 {j:"事故の原因[に関しては]、まだ調査中だ。",s:"En cuanto a la causa del accidente, aún se está investigando.",h:"に関しては"},
 {j:"日本の文化[に関して]、レポートを書いた。",s:"Escribí un informe sobre la cultura japonesa.",h:"に関して"}]},
{id:"n3-ni-taishite",lv:19,t:"〜に対して",s:"N + に対して / V・adj + のに対して",bp:"に対して",e:"Dos usos: (1) «hacia, frente a» una persona o cosa a la que se dirige una acción o actitud; (2) «mientras que, en contraste con», comparando dos cosas opuestas.",ex:[
 {j:"お客様[に対して]、失礼なことを言ってはいけない。",s:"No se debe decir nada descortés a los clientes.",h:"に対して"},
 {j:"兄は静か[なのに対して]、弟はにぎやかだ。",s:"Mi hermano mayor es tranquilo, mientras que el pequeño es bullicioso.",h:"なのに対して"},
 {j:"先生の質問[に対して]、学生は何も答えなかった。",s:"Ante la pregunta del profesor, los alumnos no respondieron nada.",h:"に対して"}]},
{id:"n3-ni-tsurete",lv:19,t:"〜につれて",s:"V-る・N + につれて",bp:"につれて",e:"«A medida que». Un cambio provoca o acompaña otro cambio gradual. Ambas partes son cambios progresivos; no se usa para acciones puntuales ni con la voluntad del hablante.",ex:[
 {j:"時間が[たつにつれて]、悲しみは薄れた。",s:"Con el paso del tiempo, la tristeza se fue apagando.",h:"たつ"},
 {j:"年を[とるにつれて]、体が弱くなる。",s:"A medida que uno envejece, el cuerpo se debilita.",h:"とる"},
 {j:"都市が[発展するにつれて]、人口が増えた。",s:"A medida que la ciudad se desarrolló, creció la población.",h:"発展する"}]},
{id:"n3-ni-shitagatte",lv:19,t:"〜にしたがって",s:"V-る・N + にしたがって",bp:"にしたがって",e:"Dos usos: (1) «a medida que», parecido a につれて pero algo más formal; (2) «de acuerdo con, siguiendo» una indicación, una regla o una persona.",ex:[
 {j:"山を[登るにしたがって]、気温が下がった。",s:"A medida que subíamos la montaña, bajaba la temperatura.",h:"登る"},
 {j:"先生の[指示にしたがって]、作業を進めた。",s:"Seguí con el trabajo según las instrucciones del profesor.",h:"指示"},
 {j:"ルール[にしたがって]、行動してください。",s:"Actúen conforme a las normas.",h:"にしたがって"}]},
{id:"n3-ni-tomonatte",lv:19,t:"〜にともなって",s:"N・V-る + にともなって / にともない",bp:"にともなって",e:"«Junto con, a raíz de». Un cambio importante arrastra otro cambio. Es formal, de textos y noticias; la forma にともない es todavía más escrita.",ex:[
 {j:"人口の増加[にともなって]、住宅不足が問題になった。",s:"Con el aumento de población, la falta de viviendas se convirtió en un problema.",h:"にともなって"},
 {j:"台風の接近[にともなって]、風が強くなってきた。",s:"Con la aproximación del tifón, el viento se ha ido haciendo más fuerte.",h:"にともなって"},
 {j:"事業の拡大[にともない]、社員を増やした。",s:"Con la expansión del negocio, aumentamos la plantilla.",h:"にともない"}]},
{id:"n3-ni-kurabete",lv:19,t:"〜に比べて",s:"N + に比べて / N + に比べ",bp:"にくらべて",e:"«Comparado con». Pone una cosa como punto de referencia para comparar otra. Equivale a より en registro algo más formal; にくらべ es la forma escrita.",ex:[
 {j:"去年[に比べて]、今年は雪が少ない。",s:"Comparado con el año pasado, este año hay menos nieve.",h:"に比べて"},
 {j:"姉[に比べて]、妹は背が高い。",s:"Comparada con mi hermana mayor, la pequeña es más alta.",h:"に比べて"},
 {j:"東京は地方[に比べて]、物価が高い。",s:"Tokio tiene los precios más altos en comparación con las provincias.",h:"に比べて"}]}
);

// ===================== Facetas de estudio =====================
function parseCloze(j){
  const m = j.match(/^(.*?)\[([^\]]+)\](.*)$/s);
  if (!m) return {pre:j, answers:[], post:''};
  return {pre:m[1], answers:m[2].split('|'), post:m[3].replace(/\[([^\]|]+)(?:\|[^\]]*)?\]/g,'$1')};
}
function kanjiReadings(k){
  const on=(k.on||[]).map(r=>kataToHira(r.split('.')[0]));
  const kun=(k.kun||[]).map(r=>r.split('.')[0]).filter(Boolean);
  return uniq([...on,...kun]);
}
function facetsFor(it){ return it.kind==='k'?['kr','km'] : it.kind==='v'?(S.settings.askReading?['vp','vr','vm']:['vp','vm']) : ['gc']; }
const FACET_LABEL = {km:'Significado del kanji', kr:'Lectura del kanji', vm:'Significado', vr:'Lectura', vp:'Producción: del español al japonés', gc:'Gramática: completa la frase'};
// Sinónimo válido: otra palabra del catálogo con esa lectura y algún significado en común con la pedida
function vocabSynonym(it, typed){
  const t=normKana(toKana(typed,true)); if(!t) return null;
  const parts=m=>normEs(m).split(/\s*\/\s*|\s*,\s*/).filter(Boolean);
  const mine=new Set((it.m||[]).flatMap(parts));
  for (const x of ITEMS.values()){
    if (x.kind!=='v' || x===it || (x.w===it.w && x.r===it.r)) continue;
    if (normKana(x.r)!==t) continue;
    if ((x.m||[]).flatMap(parts).some(q=>mine.has(q))) return x;
  }
  return null;
}
// Palabras que el propio alumno ya marcó como válidas para este ítem
function customAlt(it, typed){ const t=normKana(toKana(typed,true)); const list=(S.alts&&S.alts[keyOf(it)])||[]; return t&&list.includes(t)?{w:t,r:t,custom:true}:null; }
function kanjiDistractors(v){
  const word=v.w; const chars=[...word].filter(c=>hasKanji(c));
  let pool = VOCAB_ALL.filter(x=>x.w!==word && hasKanji(x.w) && !(VOCAB_BY_WORD[x.w]||[]).some(y=>y.r===v.r&&y.w===v.w));
  const share = pool.filter(x=>chars.some(c=>x.w.includes(c)));
  const sameLen = pool.filter(x=>x.w.length===word.length && !share.includes(x));
  const out = uniq([...pick(share,2), ...shuffle(sameLen), ...shuffle(pool)].map(x=>x.w)).filter(w=>w!==word).slice(0,3);
  return out;
}
// Construye la pregunta de una faceta
function buildPrompt(it, facet){
  const p={it,facet};
  if (facet==='km'){ p.kind='k'; p.main=it.k; p.ask='Significado'; p.input='es'; p.check=a=>matchEs(a,it.m); p.correct=it.m.join(', '); }
  else if (facet==='kr'){ p.kind='k'; p.main=it.k; p.ask='Lectura (cualquiera)'; p.input='kana'; const acc=kanjiReadings(it); p.check=a=>matchKana(a,acc); p.correct=acc.join('・'); }
  else if (facet==='vm'){ p.kind='v'; p.main=it.w; p.ask='Significado'; p.input='es'; p.check=a=>matchEs(a,it.m); p.correct=it.m.join(', '); }
  else if (facet==='vr'){ p.kind='v'; p.main=it.w; p.ask='Lectura'; p.input='kana'; p.check=a=>matchKana(a,[it.r]); p.correct=it.r; }
  else if (facet==='vp'){ p.kind='p'; p.mainEs=it.m.join(', '); p.sub=it.p?posLabel(it.p):''; p.ask='Escribe la palabra en japonés'; p.input='kana'; p.check=a=>matchKana(a,[it.r]); p.synonym=a=>vocabSynonym(it,a)||customAlt(it,a); p.hint=(typeof VOCAB_HINT!=='undefined'&&VOCAB_HINT[it.w])||''; p.correct=it.r+(hasKanji(it.w)?'（'+it.w+'）':''); if (hasKanji(it.w)) { p.pick={correct:it.w, options:shuffle([it.w,...kanjiDistractors(it)])}; } }

  return p;
}

let SESSION=null;
function startSession(mode, items, opts={}){
  const results={}; const its=shuffle(items); const passes=[[],[],[]];
  for (const it of its){ const k=keyOf(it); const fs=(opts.facets||facetsFor(it)).filter(f=>facetsFor(it).includes(f)); if(!fs.length) continue; results[k]={wrong:0,left:new Set(fs),it}; fs.forEach((f,i)=>passes[i].push({k,f})); }
  // primera pasada: la faceta principal de cada ítem (español→japonés en vocabulario); luego el resto
  const queue=[...shuffle(passes[0]), ...shuffle(passes[1]), ...shuffle(passes[2])];
  SESSION={mode, queue, results, total:Object.keys(results).length, done:0, correct:0, cur:null, phase:'ask', opts, startedAt:now(), wrongKeys:new Set()};
  if (!queue.length){ SESSION=null; toast('No hay nada que repasar'); return; }

}
function nextCard(){
  const s=SESSION; if(!s) return; clearTimeout(s.autoT); if(s.enterHandler){ document.removeEventListener('keydown',s.enterHandler); s.enterHandler=null; }
  if (!s.queue.length){ for (const [k,r] of Object.entries(s.results)) for (const f of r.left) s.queue.push({k,f}); }
  if (!s.queue.length){ finishSession(); return; }
  // evita repetir la misma palabra dos veces seguidas si hay alternativa
  if (s.cur && s.queue.length>1 && s.queue[0].k===s.cur.k){ const i=s.queue.findIndex(q=>q.k!==s.cur.k); if(i>0){ const [q]=s.queue.splice(i,1); s.queue.unshift(q);} }
  const q=s.queue.shift(); const it=s.results[q.k].it;
  s.cur={k:q.k,f:q.f,p:buildPrompt(it,q.f),wrong:false}; s.phase='ask'; renderStudy();
}

function answerCurrent(correct){
  const s=SESSION, c=s.cur, r=s.results[c.k]; snapshotForUndo(); r.lastP=c.p; if(!correct) r.failed=true;
  if (s.mode!=='lesson'){ S.stats=S.stats||{}; const st=S.stats[c.f]=S.stats[c.f]||{c:0,w:0}; if(correct) st.c++; else st.w++; }

    const pos=Math.min(s.queue.length, 2+Math.floor(Math.random()*5)); s.queue.splice(pos,0,{k:c.k,f:c.f});

function stats7(){ const t=new Date(); t.setHours(0,0,0,0); let r=0,rc=0,l=0,active=0; for(let i=0;i<7;i++){ const d=S.days[todayKey(new Date(t.getTime()-i*D))]; if(!d) continue; r+=d.r||0; rc+=d.rc||0; l+=d.l||0; if(dayCounts(d)) active++; } return {r,rc,l,active,acc:r?rc/r:null}; }

function paceToday(){

  else { const cs=clearedStreak(); if (cs>=3 && (st.acc==null||st.acc>=0.9) && appr<70 && due<30){ goal=Math.min(ceiling,prev+2); mode=goal>prev?'impulso':'normal'; why=goal>prev?`${cs} días seguidos con la cola vacía y más del 90 %: subo a ${goal}.`:`Vas bien y al techo que fijaste (${ceiling}).`; } else { goal=Math.min(ceiling,Math.max(prev,Math.min(ceiling,prev+ (prev<ceiling&&st.active>=3?1:0)))); mode='normal'; why=`Carga equilibrada: ${goal} ${plural(goal,'lección','lecciones')} hoy.`; } }

// Mapea etapas de WaniKani (0-9) a las nuestras (misma escala)
function importSync(text){
  let o; try{ o=parseLooseJson(text); }catch(e){ toast('JSON no válido'); return; }

      if (!it.srs) continue;

      for (const k of keys){ if(!ITEMS.has(k)) continue; const cur=S.items[k]; const s=Math.max(1,Math.min(9,it.srs)); if(!cur||cur.s<s){ S.items[k]={...(cur||{c:0,w:0}), s, due: s>=9?Infinity:now()+STAGE_HOURS[s]*H*Math.random(), lrn:cur&&cur.lrn||now(), ls:now()}; wkMatched++; } }
    }

      if (!g) continue; const k='g|'+g.id; const s=Math.max(1,Math.min(9,Math.round((it.srs||1)*9/12))); const cur=S.items[k]; if(!cur||cur.s<s){ S.items[k]={...(cur||{c:0,w:0}), s, due:s>=9?Infinity:now()+STAGE_HOURS[s]*H*Math.random(), lrn:now(), ls:now()}; bpMatched++; }
    }
  }
  S.sync={...S.sync,date:now(),wkMatched,bpMatched};
  // sube el nivel si todo lo de los niveles inferiores ya está aprendido
  while (S.level<13 && itemsOfLevel(S.level).length && itemsOfLevel(S.level).every(it=>S.items[keyOf(it)]&&S.items[keyOf(it)].s>=5)) { S.levelPass[S.level]=S.levelPass[S.level]||'sync'; S.level++; }

}

 "vocab":[{"w":"漢字","r":"かんじ","m":["kanji"],"p":"n","ex":"frase de ejemplo natural y corta en japonés","es":"traducción al español"}],
 "grammar":[{"id":"identificador-ascii","t":"〜ばかりか","s":"estructura","e":"explicación clara en español de 2 a 4 frases, con matices de uso y registro","ex":[{"j":"frase con la parte gramatical entre corchetes [así]","s":"traducción","h":"pista opcional: verbo base o forma","k":"lectura en kana de la parte entre corchetes"}]}]}

Puntos gramaticales del nivel: ${gs.join(' | ')}`;

function validateGen(o, lv){

async function wkFetchAll(url, token){
  let all=[]; while(url){ const r=await fetch(url,{headers:{Authorization:'Bearer '+token,'Wanikani-Revision':'20170710'}}); if(!r.ok) throw new Error('WaniKani '+r.status); const j=await r.json(); if(Array.isArray(j.data)){ all=all.concat(j.data); url=j.pages&&j.pages.next_url; } else return j; } return all;
}
async function syncExternal(){
  const st=S.settings; const payload={};

    toast('Leyendo WaniKani…');

    const assignments=await wkFetchAll('https://api.wanikani.com/v2/assignments?started=true&subject_types=kanji,vocabulary', st.wkToken);
    const ids=assignments.map(a=>a.data.subject_id); const subjects={};
    for(let i=0;i<ids.length;i+=1000){ const chunk=await wkFetchAll('https://api.wanikani.com/v2/subjects?ids='+ids.slice(i,i+1000).join(','), st.wkToken); for(const sj of chunk) subjects[sj.id]={type:sj.object,chars:sj.data.characters}; }
    S.sync.wkDiag='WaniKani devolvió '+assignments.length+' asignaciones.';
    payload.wanikani={level:user.data.level, items:assignments.map(a=>{ const sj=subjects[a.data.subject_id]; return sj&&sj.chars?{type:sj.type,chars:sj.chars,srs:a.data.srs_stage}:null; }).filter(Boolean)};
  }

    let data=null;
    try{ const r=await fetch('https://bunpro.jp/api/user/'+encodeURIComponent(st.bpKey)+'/all_reviews',{headers:{Accept:'application/json'}}); if(r.ok){ const j=await r.json(); const arr=Array.isArray(j)?j:(j.reviews||j.data||[]); data={items:arr.map(x=>{const gp=x.grammar_point||{}; return {title:gp.title||x.title||'', srs:Number(x.srs_stage??x.streak??1)};}).filter(i=>i.title), diag:'directo desde el navegador: '+arr.length+' elementos'}; } }catch(e){}

// Escala propia de redacción (independiente del nivel de kanji): 10 grados, se sube con 3 redacciones corregidas dentro del rango con 85 % o más
const WRITING_GRADES = [null,{tier:'N5',r:[120,180]},{tier:'N5',r:[180,260]},{tier:'N5',r:[260,350]},{tier:'N4',r:[350,450]},{tier:'N4',r:[450,600]},{tier:'N3',r:[600,750]},{tier:'N3',r:[750,900]},{tier:'N2',r:[900,1100]},{tier:'N2',r:[1100,1300]},{tier:'N1',r:[1300,1700]}];
const WR_PASS=85, WR_NEED=3;
function writingGrade(){ return Math.max(1,Math.min(10,S.wgrade||1)); }
function writingRange(){ return WRITING_GRADES[writingGrade()].r; }
function writingMin(){ return writingRange()[0]; }
// Redacciones que cuentan para subir: del grado actual, corregidas, con nota suficiente y longitud dentro del rango
function writingPassCount(){ const g=writingGrade(); return (S.writings||[]).filter(w=>w.grade===g&&w.score!=null&&w.score>=WR_PASS&&jaLen(w.text)>=WRITING_GRADES[g].r[0]).length; }
function writingPromote(){ const g=writingGrade(); if(g>=10||writingPassCount()<WR_NEED) return false; S.wgrade=g+1; S.wgradeAt=now(); save(); return true; }
function writingLowStreak(){ const g=writingGrade(); const last=(S.writings||[]).filter(w=>w.grade===g&&w.score!=null).slice(-2); return last.length===2&&last.every(w=>w.score<60); }
function pickTopic(repeat){ const g=writingGrade(); const tier=WRITING_GRADES[g].tier; const pool=WRITING_TOPICS[tier].map(x=>({...x,tier})); const ws=(S.writings||[]); const recent=ws.slice(-6).map(w=>w.topic.t); let pick1; if(repeat&&writingLowStreak()) pick1=pool.find(x=>x.t===ws[ws.length-1].topic.t)||rnd(pool); else { const fresh=pool.filter(x=>!recent.includes(x.t)); pick1=rnd(fresh.length?fresh:pool); } const gs=shuffle(learnedKeys().map(k=>ITEMS.get(k)).filter(i=>i.kind==='g')).slice(0,2).map(g=>g.t); const [mn,mx]=writingRange(); return {...pick1, use:gs, min:mn, max:mx, grade:g}; }
function renderRedaccion(){

    else box.append(h('div',{class:'small muted'},'Sin errores señalados.'));

// Dónde estudiar lo que ha fallado: punto de la app (si existe) y recursos externos por tema
function studyLinks(errors){
  const normT=s=>String(s||'').replace(/（[^）]*）|\([^)]*\)/g,'').replace(/[〜～\s()（）・、。\-ー]/g,'').toLowerCase();
  const points=uniq(errors.map(e=>e.point).filter(Boolean)); if(!points.length) return null;
  const box=h('div',{}, h('div',{class:'eyebrow'},'Dónde estudiar lo que has fallado'));
  const list=h('div',{class:'stack',style:'margin-top:6px'});
  points.slice(0,8).forEach(pt=>{
    const own=[...ITEMS.values()].find(i=>i.kind==='g'&&(normT(i.t)===normT(pt)||normT(i.t).includes(normT(pt))||(normT(pt).length>=3&&normT(pt).includes(normT(i.t)))));
    const q=encodeURIComponent(pt);
    list.append(h('div',{class:'row small',style:'align-items:center'}, h('b',{class:'jp'},pt), own?h('button',{class:'pill g jp',title:'Ver el punto en la app',onclick:()=>itemSheet(own)},'En la app: '+own.t):h('span',{class:'muted'},'(no está en el temario de la app)'),
      h('a',{href:'https://bunpro.jp/grammar_points?search='+q,target:'_blank',rel:'noopener'},'Bunpro'), h('a',{href:'https://jlptsensei.com/?s='+q,target:'_blank',rel:'noopener'},'JLPT Sensei'), h('a',{href:'https://www.google.com/search?q='+encodeURIComponent(pt+' gramática japonesa'),target:'_blank',rel:'noopener'},'Buscar')));
  });
  box.append(list);
  return box;
}
function saveWriting(P,r){ S.writings=S.writings||[]; const rec={date:now(),topic:P.topic,grade:P.topic.grade||writingGrade(),text:P.text,score:r?r.score:null,result:r?{score:r.score,comment:r.comment||'',errors:(r.errors||[]).slice(0,30).map(e=>({orig:e.orig||'',fix:e.fix||'',why:e.why||'',point:e.point||''})),corrected:r.corrected||'',level:r.level||''}:null}; const i=S.writings.findIndex(w=>w.topic.t===P.topic.t&&w.text===P.text); if(i>=0) S.writings[i]=rec; else S.writings.push(rec); if(S.writings.length>50) S.writings=S.writings.slice(-50); if(!P.saved) bump('wr'); P.saved=true; save(); }
