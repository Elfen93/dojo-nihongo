<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f4f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Dojo 日本語</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* Layout: barra lateral fija en escritorio, pestañas inferiores en móvil; una vista activa a la vez. */
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  --bg:#f3f4f7; --fg:#1b2230; --muted:#5c667a; --line:#d9dde6; --card:#ffffff; --card2:#eaedf3;
  --accent:#2f4f8f; --accent-fg:#ffffff; --accent-soft:#dfe7f6; --kanji-c:#c9607a; --kanji-soft:#f6e3e8; --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px -12px rgba(20,30,60,.18);
  --leaf:#5f8f2e; --leaf-soft:#e3eed6;
  --warn:#c3482c; --warn-soft:#f8e1dc; --ok:#2e7d4f; --ok-soft:#dcefe3; --gold:#b8860b;
  --kanji:#1b2230; --radius:10px;
  --f-ui:"Figtree","Noto Sans JP",system-ui,sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-jp-display:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12161f; --fg:#e7eaf1; --muted:#9aa4b8; --line:#2a3242; --card:#1a2030; --card2:#232b3d;
  --accent:#8fb0f0; --accent-fg:#0f1522; --accent-soft:#223050;
  --leaf:#9cc96a; --leaf-soft:#243420; --warn:#f08a74; --warn-soft:#432520; --ok:#7fd1a0; --ok-soft:#1f3a2c; --gold:#e0b64a; --kanji:#f2f4f8; --kanji-c:#e28aa0; --kanji-soft:#3a2630; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12161f; --fg:#e7eaf1; --muted:#9aa4b8; --line:#2a3242; --card:#1a2030; --card2:#232b3d;
  --accent:#8fb0f0; --accent-fg:#0f1522; --accent-soft:#223050;
  --leaf:#9cc96a; --leaf-soft:#243420; --warn:#f08a74; --warn-soft:#432520; --ok:#7fd1a0; --ok-soft:#1f3a2c; --gold:#e0b64a; --kanji:#f2f4f8; --kanji-c:#e28aa0; --kanji-soft:#3a2630; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
:lang(ja),.jp{font-family:var(--f-jp)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
nav.side{position:sticky;top:0;height:100vh;height:100dvh;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 10px 14px}
.brand b{font-family:var(--f-jp-display);font-size:1.35rem;letter-spacing:.02em}
.brand span{font-size:.8rem;color:var(--muted)}
nav.side button,nav.tabs button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;width:100%;color:var(--fg)}
nav.side button .ic{width:22px;text-align:center;font-family:var(--f-jp-display);font-size:1.05rem;color:var(--muted)}
nav.side button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side button.active .ic{color:var(--accent)}
nav.side button .badge{margin-left:auto}
.badge{display:inline-block;min-width:1.6em;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:.75rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.badge.warn{background:var(--warn);color:#fff}
.badge.ok{background:var(--ok);color:#fff}
.badge.soft{background:var(--card2);color:var(--muted)}
nav.side .foot{margin-top:auto;padding:10px;font-size:.78rem;color:var(--muted)}
nav.tabs{display:none}
header.mobile{display:none}
main{min-width:0;padding-block:22px 40px;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;min-width:0}
.view{display:none}
.view.active{display:block}
.topline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.topline h1{margin-right:auto}

.grid{display:grid;gap:12px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.card.soft{background:var(--card2);border-color:transparent}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.sp{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.leaf{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.btn.warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.ghost{background:transparent}
.btn.big{padding:14px 18px;font-size:1.05rem;min-height:52px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;min-height:36px;font-size:.85rem}

.action{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:left;width:100%;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.action:active{transform:scale(.985)}
.action.rev{background:linear-gradient(135deg,var(--accent-soft),var(--card) 60%)}
.action.les{background:linear-gradient(135deg,var(--leaf-soft),var(--card) 60%)}
.action.exam{background:linear-gradient(135deg,#f6edd3,var(--card) 60%)}
:root[data-theme="dark"] .action.exam,:root:not([data-theme="light"]) .action.exam{background:linear-gradient(135deg,#3a3220,var(--card) 60%)}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .action.exam{background:linear-gradient(135deg,#f6edd3,var(--card) 60%)} }
.action .big-n{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:2.4em;text-align:center;font-family:var(--f-ui)}
.action .t{font-weight:700}
.action .d{color:var(--muted);font-size:.9rem}
.action.rev .big-n{color:var(--accent)}
.action.les .big-n{color:var(--leaf)}
.action.exam .big-n{color:var(--gold)}
.action.locked{opacity:.7}
.action:hover{border-color:var(--accent)}

.bar{height:10px;border-radius:999px;background:var(--card2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar.leaf > i{background:var(--leaf)}
.bar.gold > i{background:var(--gold)}
.push{border-left:4px solid var(--warn);background:var(--warn-soft);padding:12px 14px;border-radius:8px}
.push.ok{border-color:var(--ok);background:var(--ok-soft)}
.push.info{border-color:var(--accent);background:var(--accent-soft)}

.forecast{display:flex;align-items:flex-end;gap:3px;height:70px}
.forecast > div{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.forecast > div > i{position:absolute;inset:auto 0 0 0;background:var(--accent);border-radius:3px 3px 0 0}
.forecast-labels{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}

/* Tarjeta de estudio */
.study{max-width:720px;margin:0 auto}
.study-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.85rem;color:var(--muted)}
.prompt-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px 20px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.prompt-card.kind-k{border-top:5px solid var(--kanji-c)}
.prompt-card.kind-v{border-top:5px solid var(--accent)}
.prompt-card.kind-g{border-top:5px solid var(--leaf)}
.prompt-card.kind-p{border-top:5px solid var(--gold)}
.big-jp{font-family:var(--f-jp-display);font-size:clamp(2.6rem,10vw,4.8rem);line-height:1.15;color:var(--kanji);font-weight:500}
.mid-jp{font-family:var(--f-jp);font-size:clamp(1.3rem,4.5vw,1.8rem);line-height:1.6}
.big-es{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:700;line-height:1.2}
.ask{font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.ask.k{color:var(--kanji-c)}.ask.v{color:var(--accent)}.ask.g{color:var(--leaf)}.ask.p{color:var(--gold)}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--accent);margin:0 2px;vertical-align:bottom}
.answer{display:flex;gap:8px;margin-top:12px}
.answer input{flex:1;min-width:0;font-size:1.3rem;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);text-align:center;font-family:var(--f-jp)}
.answer input.right{border-color:var(--ok);background:var(--ok-soft)}
.answer input.wrong{border-color:var(--warn);background:var(--warn-soft)}
.feedback{margin-top:12px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--card)}
.feedback .verdict{font-weight:700;margin-bottom:6px}
.feedback .verdict.ok{color:var(--ok)}
.feedback .verdict.ko{color:var(--warn)}
.feedback dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 0}
.feedback dt{color:var(--muted);font-size:.85rem}
.feedback dd{margin:0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.choices button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:12px;font-family:var(--f-jp);font-size:1.25rem;min-height:56px}
.choices button.right{border-color:var(--ok);background:var(--ok-soft)}
.choices button.wrong{border-color:var(--warn);background:var(--warn-soft)}
.choices.text button{font-size:1rem;text-align:left;font-family:var(--f-jp)}
.choices.one{grid-template-columns:1fr}
.lesson-body{text-align:left}
.lesson-body .readings{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.lesson-body .readings b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lesson-body .mn{background:var(--card2);padding:10px 12px;border-radius:8px;margin-top:10px}
.lesson-body .ex{margin-top:8px;padding:8px 0;border-top:1px dashed var(--line)}
.lesson-body .ex .jp{font-size:1.15rem}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--card2);font-size:.78rem;font-weight:600;color:var(--muted)}
.pill.k{background:var(--kanji-soft);color:var(--kanji-c)}.pill.v{background:var(--accent-soft);color:var(--accent)}.pill.g{background:var(--leaf-soft);color:var(--leaf)}
:root[data-theme="dark"] .pill.k,:root:not([data-theme="light"]) .pill.k{}
.progress-dots{display:flex;gap:4px;flex-wrap:wrap}
.progress-dots i{width:10px;height:10px;border-radius:3px;background:var(--card2);display:block}
.progress-dots i.on{background:var(--accent)}
.progress-dots i.ko{background:var(--warn)}

/* Hero */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--accent) 0%,#1f3566 100%);color:#fff;border-radius:18px;padding:18px 18px;box-shadow:var(--shadow)}
.hero .ring{width:84px;height:84px;flex:none}
.hero .ring svg{display:block;width:84px;height:84px}
.hero .ring text{fill:#fff;font-family:var(--f-ui);font-weight:700}
.hero .lvl{font-size:1.35rem;font-weight:700;line-height:1.2}
.hero .sub{opacity:.85;font-size:.9rem}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hero .chip{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600}
/* Consejos */
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--card2)}
.tip .ic{font-size:1.1rem;flex:none}
.tip .b{min-width:0;flex:1}
.tip .b b{display:block}
.tip .b p{margin:2px 0 0;font-size:.9rem}
/* Lectura */
.reader{font-family:var(--f-jp);font-size:1.25rem;line-height:2.3;max-width:62ch}
.reader .tok{cursor:pointer;border-radius:4px;padding:0 1px}
.reader .tok:hover,.reader .tok.sel{background:var(--accent-soft)}
.reader rt{font-size:.55em;color:var(--muted)}
.reader.nofuri rt{visibility:hidden}
.reader.nofuri .tok.sel rt{visibility:visible}
.gloss{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.15);margin-top:12px}
.gloss .w{font-family:var(--f-jp);font-size:1.5rem;font-weight:500}
.gloss .r{color:var(--accent);font-family:var(--f-jp)}
.list{display:flex;flex-direction:column;gap:8px}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:left;width:100%}
.list .item .t{font-weight:600}
.list .item.done{border-color:var(--ok)}
.list .item.locked{opacity:.6}

/* Exámenes */
.exam-q{font-family:var(--f-jp);font-size:1.25rem;line-height:1.9}
.exam-q u{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.exam-q .star{color:var(--gold);font-weight:700}
.exam-q .slot{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--line);margin:0 3px;text-align:center;font-size:.8em;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--warn)}
.section-tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.result-grid .card{padding:10px 12px}
.score{font-size:2.6rem;font-weight:700;line-height:1}
.score.pass{color:var(--ok)}.score.fail{color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.tscroll{overflow-x:auto}

/* Progreso */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stages .card{padding:10px;text-align:center}
.stages .n{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.stages .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.levelmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px}
.levelmap div{aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--card2);font-size:.8rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.levelmap div.done{background:var(--ok);color:#fff}
.levelmap div.cur{background:var(--accent);color:var(--accent-fg);outline:2px solid var(--accent);outline-offset:2px}
.levelmap div.gen{background:var(--gold);color:#fff}
.tier-row{display:flex;gap:8px;align-items:center;margin:14px 0 6px}

/* Ajustes */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.85rem;font-weight:600}
.field{min-width:0}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);max-width:100%;width:100%;min-width:0;box-sizing:border-box}
.field input[type=checkbox]{width:auto}
.grid > *{min-width:0}
.card{overflow:hidden}
th,td{white-space:nowrap}
td.wrap,th.wrap{white-space:normal}
.field textarea{font-family:ui-monospace,monospace;font-size:.8rem;min-height:120px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
pre{background:var(--card2);padding:10px;border-radius:8px;overflow-x:auto}
.kbd{font-size:.75rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{display:none}
  header.mobile{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--card);border-bottom:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
  header.mobile .brand{padding:0;flex:1}
  header.mobile button{border:0;background:var(--card2);width:40px;height:40px;border-radius:12px;font-size:1.15rem;display:flex;align-items:center;justify-content:center;color:var(--fg)}
  header.mobile button.active{background:var(--accent-soft);color:var(--accent)}
  nav.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:2px;padding:6px 2px;font-size:.68rem;justify-content:center;align-items:center;color:var(--muted);position:relative}
  nav.tabs button .ic{font-family:var(--f-jp-display);font-size:1.25rem;color:inherit}
  nav.tabs button.active{color:var(--accent);background:none}
  nav.tabs button .badge{position:absolute;top:2px;right:8px;font-size:.65rem;min-width:1.4em;padding:0 5px}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));padding-block-start:0;padding-left:0;padding-right:0}
  main .wrap{padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));width:100%}
  .grid.c2,.grid.c3{grid-template-columns:1fr}
  .stages{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .stages .card{padding:8px 2px}
  .stages .n{font-size:1.05rem}
  .stages .l{font-size:.58rem;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field input[type=range]{padding:0}
  .choices{grid-template-columns:1fr 1fr}
  .reader{font-size:1.15rem}
}
